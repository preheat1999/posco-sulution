<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자재반납 (QR) · AI 자재 솔루션</title>
<link rel="stylesheet" href="assets/shell.css">
<script>window.PAGE = 'return';</script>
</head>
<body>

<div class="layout">
  <aside class="side" id="side"></aside>

  <main class="main">
    <div class="top">
      <div class="top-left">
        <button class="hamb" id="hamb" aria-label="메뉴" aria-expanded="false">&#9776;</button>
        <div>
          <div class="crumb" data-group="업무">&nbsp;</div>
          <h1>자재반납 (QR)</h1>
        </div>
      </div>
      <div class="top-right">
        <span class="pill" id="asof">기준일 확인 중</span>
        <div class="avatar">이</div>
      </div>
    </div>

    <!-- 물품 상태별로 나눈다. 명세의 7갈래 판정은 알고리즘이 낼 값이라 아직 없다 -->
    <div class="tagrow" id="tabs"></div>

    <div class="split">
      <section class="card" id="table-card">
        <header>
          <div><h2>불출 잔여 자재</h2><p class="sub" id="tsub">&nbsp;</p></div>
          <div class="card-tools">
            <span class="badge" id="tcount">&nbsp;</span>
            <!-- 시연용 문 · 현장 폰 화면을 PC 에서 열어 본다 -->
            <a class="btn line sm" href="material-view.html?code=Q4046777">폰 화면 · QR 진입</a>
          </div>
        </header>
        <div class="callout ok" style="margin-top:0">
          <span class="ci">↩</span>
          <span><b>반납하면 재고가 바로 다시 계산됩니다</b>
          적정재고 조치도 같이 바뀝니다 · 현재고를 저장하지 않고 트랜잭션으로 더합니다</span>
        </div>
        <div class="tablewrap" id="table"></div>
        <p class="note" style="margin-top:12px" id="tnote">&nbsp;</p>
      </section>

      <!-- 스마트 반납 QR 은 여기 없다 · 자재식별표에 붙은 QR 을 현장에서 폰으로 찍는 것이라
           PC 화면에 QR 그림을 띄울 이유가 없다. 폰 화면으로 가는 문은 표 머리에 두었다 -->
      <div class="sticky">
        <section class="card" id="effect"></section>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>

<script src="assets/config.js"></script>
<!-- .env 에서 내려온 연결값 (토큰) · serve.py 가 만든다 · 없으면 그냥 넘어간다 -->
<script src="assets/config.local.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/org.js"></script>
<script src="assets/popover.js"></script>
<script src="assets/db-master.js"></script>
<script src="assets/db-derived.js"></script>
<script src="assets/db-changes.js"></script>
<script src="assets/db.js"></script>
<!-- 음성은 한국어로 받아쓰고 품명은 영어다 · 그 사이를 잇는다 (너트 → Nut) -->
<script src="assets/ko-en.js"></script>
<script src="assets/db-biz.js"></script>
<script src="assets/plan-data.js"></script>
<script src="assets/analysis-data.js"></script>
<script src="assets/screen-data.js"></script>
<script src="assets/qr-items.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  'use strict';

  var S = window.SCREEN;
  var tab = 'all';
  var picked = null;
  var done = {};        // 이번 화면에서 반납한 자재. 버튼을 「완료」 로 바꾼다

  function el(id) { return document.getElementById(id); }

  /* QR 자리표시 그림은 지웠다 · QR 은 자재식별표에 인쇄해 현장에서 폰으로 찍는다.
   * 실제 QR 은 make_qr.py 가 만들고, 찍으면 material-view.html 로 들어온다 */

  function paintTabs() {
    var tabs = S.retTabs();
    el('tabs').innerHTML = tabs.map(function (t) {
      return '<button class="tab' + (t.key === tab ? ' on' : '') + '" type="button" ' +
        'data-tab="' + UI.esc(t.key) + '">' + UI.esc(t.label) +
        ' <span class="n">' + t.n + '</span></button>';
    }).join('');
  }

  function paintTable() {
    var rows = S.retList(tab);
    var all = S.retList('all');
    el('tcount').textContent = UI.num(rows.length) + '건';
    el('tsub').textContent = { all: '불출 잔여가 있는 자재 전체',
      wait: '아직 반납하지 않은 자재 · 물품 상태는 반납 뒤에 정합니다',
      done: '반납한 자재 · 검사에서 확정된 물품 상태' }[tab] ||
      ('전체 ' + UI.num(all.length) + '건');

    if (!picked || !rows.filter(function (r) { return r.q === picked; }).length) {
      picked = rows.length ? rows[0].q : null;
    }

    el('table').innerHTML = rows.length ?
      '<table><thead><tr><th>자재 · 코드</th><th>불출 창고</th>' +
      '<th class="num">불출 잔여</th><th>물품 상태</th><th>반납</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr' + (r.q === picked ? ' class="on"' : '') + '>' +
          '<td data-label="자재 · 코드"><div class="cell-2">' +
            '<div class="cell-1st">' + UI.esc(r.name) + '</div>' +
            '<div class="cell-2nd">' + UI.esc(r.q) +
              (r.asm ? ' · ' + UI.esc(r.asm) : '') +
              (r.locator ? ' · 보관 ' + UI.esc(r.locator) : '') + '</div>' +
          '</div></td>' +
          '<td data-label="불출 창고">' + UI.esc(r.issueWh || '미확인') + '</td>' +
          '<td class="num" data-label="불출 잔여">' + UI.num(r.left) + ' ' +
            UI.esc(r.unit) + '</td>' +
          /* 상태는 반납한 줄에만 적는다 · 반납 전에는 아직 정해지지 않은 값이다 */
          '<td data-label="물품 상태">' +
            ((r.returned || done[r.q])
              ? condBadge(done[r.q] && cond[r.q] ? cond[r.q] : r.cond)
              : '<span class="sub">반납 뒤 결정</span>') + '</td>' +
          '<td data-label="반납">' +
            (done[r.q]
              ? '<span class="badge ok">완료</span>'
              : '<button class="btn sm" type="button" data-ret="' + UI.esc(r.q) +
                '">반납</button>') +
            ' <button class="btn line sm" type="button" data-pick="' + UI.esc(r.q) +
              '">미리보기</button>' +
          '</td></tr>';
      }).join('') + '</tbody></table>' :
      '<div class="empty"><strong>' +
      ({ wait: '반납할 자재가 남아 있지 않습니다', done: '아직 반납한 자재가 없습니다' }[tab]
        || '반납 대상이 없습니다') + '</strong>다른 칸을 눌러 보세요</div>';

    var txn = window.DB ? DB.changes().stock_transactions.filter(function (t) {
      return t.txnType === '반납';
    }).length : 0;
    el('tnote').innerHTML = '반납 대상은 <b>불출 후 남은 수량</b>입니다. ' +
      '<b>물품 상태는 반납받은 자재를 검사하고 담당자가 정합니다</b> · 그래서 ' +
      '「반납 완료」 칸에서만 상태를 보여 줍니다. 명세의 7갈래 반납 유형 판정은 ' +
      '알고리즘이 낼 값이라 아직 데이터에 없습니다.' +
      (txn ? ' 지금까지 <b>' + txn + '건</b> 반납했습니다.' : '');
  }

  function condBadge(c) {
    var cls = { '신품': 'ok', '중고': 'plan', '불용': 'insur' }[c] || '';
    return '<span class="badge ' + cls + '">' + UI.esc(c) + '</span>';
  }

  /* 반납하면 무엇이 바뀌는지 먼저 보여 준다. 눌러 보고 알게 하면 안 된다 */
  /* 반납 수량은 사람이 고친다 · 추천값은 불출 잔여다.
   * 화면이 기억하고 있어야 다시 그릴 때 되돌아가지 않는다 (자재별로 따로 둔다) */
  var qty = {};
  var cond = {};

  /* 조치(반납 유형) · 원천 08_반납_거래상태 에 있는 상태 이름을 그대로 쓴다.
   * 「미정」 이 기본이다 · 물품 상태는 반납받은 자재를 검사하고 정하는 것이라
   * 반납자가 신고한 값과 검사에서 확정한 값은 다를 수 있다 */
  var CONDS = ['신품', '중고', '수리 필요', '불용'];

  function qtyOf(r) {
    var v = qty[r.q];
    if (v === undefined) { return Number(r.left) || 0; }
    return v;
  }

  function paintEffect() {
    var rows = S.retList(tab);
    var r = picked ? rows.filter(function (x) { return x.q === picked; })[0] : null;
    if (!r) {
      el('effect').innerHTML = '<div class="empty"><strong>반납 대상을 고르세요</strong>' +
        '표에서 「미리보기」 를 누르면 신청서 초안이 채워집니다</div>';
      return;
    }
    var e = S.retEffect(r);
    var n = qtyOf(r);
    var price = window.DB ? (Number(DB.item(r.q).price) || 0) : 0;

    el('effect').innerHTML =
      '<p class="gt"><span>자재반납신청서 초안</span>' +
        '<span class="gt-sub">' + UI.esc(r.q) + '</span></p>' +
      '<h2 style="font-size:16px;letter-spacing:-.4px;margin-bottom:10px">' +
        UI.esc(r.name) + '</h2>' +

      '<div class="rf">' +
        /* 4 · 추천값을 넣어 두고 고칠 수 있게 둔다 · 최대는 불출 잔여다 */
        '<div class="rf-row">' +
          '<label class="rf-k" for="retqty">반납 수량</label>' +
          '<div class="rf-v">' +
            '<input class="input" id="retqty" type="number" inputmode="numeric" ' +
              'min="1" step="1" max="' + UI.esc(String(r.left)) + '" value="' + n + '">' +
            '<span class="rf-u">' + UI.esc(r.unit) + '</span>' +
          '</div>' +
          '<p class="rf-x">추천 ' + UI.num(r.left) + ' ' + UI.esc(r.unit) +
            ' · 불출 잔여 전량 (최대)</p>' +
        '</div>' +

        /* 3 · 조치는 고르는 값이다 · 반납자가 신고하고 검사에서 확정한다 */
        '<div class="rf-row">' +
          '<label class="rf-k" for="retcond">조치</label>' +
          '<div class="rf-v">' +
            '<select class="input" id="retcond">' +
              '<option value="">미정 · 검사에서 정함</option>' +
              CONDS.map(function (c) {
                return '<option value="' + UI.esc(c) + '"' +
                  (cond[r.q] === c ? ' selected' : '') + '>' + UI.esc(c) + '</option>';
              }).join('') +
            '</select>' +
          '</div>' +
          '<p class="rf-x">반납자가 신고하는 값입니다 · 검사에서 바뀔 수 있습니다</p>' +
        '</div>' +
      '</div>' +

      /* 5 · 6 · 회수 금액은 수량을 고치는 대로 다시 세고, 테두리를 초록으로 둔다 */
      '<div class="pgrid" style="margin-top:14px">' +
        '<div class="won-box"><div class="pk">회수 금액</div>' +
          '<div class="pv ok" id="retamt">' + UI.won(n * price) + '</div></div>' +
        (e ? '<div><div class="pk">현재고</div><div class="pv">' + UI.num(e.stock[0]) +
          ' → ' + UI.num(e.stock[0] + n) + '</div></div>' : '') +
      '</div>' +

      /* 7 · 「재고 계산」 산식은 뺐다 · 불출 근거는 남긴다 */
      '<div class="formula">' +
        '<div class="ft"><span>불출 근거</span><span>원천 그대로</span></div>' +
        UI.esc((r.wo ? '작업주문 ' + r.wo : '작업주문 미확인') + ' · ' +
          (r.acc || '계정 미확인') +
          (r.issueWh ? ' · 불출 창고 ' + r.issueWh : '') +
          (r.asm ? ' · ' + r.asm : '')) +
      '</div>' +

      '<div class="decide">' +
        '<div class="decide-row">' +
          '<button class="btn pln" type="button" data-ret="' + UI.esc(r.q) + '">' +
            '반납 신청 · ' + UI.num(n) + ' ' + UI.esc(r.unit) + '</button>' +
        '</div>' +
      '</div>';
  }

  /* 수량을 치는 대로 회수 금액과 단추 글자만 고친다 · 카드를 다시 그리면 입력칸에서 포커스가 빠진다 */
  function retLive() {
    var rows = S.retList(tab);
    var r = picked ? rows.filter(function (x) { return x.q === picked; })[0] : null;
    var inp = el('retqty');
    if (!r || !inp) { return; }
    var max = Number(r.left) || 1;
    var v = Math.round(Number(inp.value));
    if (!(v > 0)) { v = 1; }
    if (v > max) { v = max; inp.value = max; }
    qty[r.q] = v;
    var price = window.DB ? (Number(DB.item(r.q).price) || 0) : 0;
    if (el('retamt')) { el('retamt').textContent = UI.won(v * price); }
    var btn = el('effect').querySelector('[data-ret]');
    if (btn) { btn.textContent = '반납 신청 · ' + UI.num(v) + ' ' + r.unit; }
    var sk = el('effect').querySelector('.pgrid > div:last-child .pv');
    var e = S.retEffect(r);
    if (sk && e) { sk.textContent = UI.num(e.stock[0]) + ' → ' + UI.num(e.stock[0] + v); }
  }

  function doReturn(q, anchor) {
    var rows = S.retList('all');
    var r = rows.filter(function (x) { return x.q === q; })[0];
    if (!r) { return; }
    var before = DB.item(q);
    var n = Math.min(Number(r.left) || 0, qtyOf(r));
    var c = cond[q] || '';
    done[q] = true;
    try {
      /* 부호는 config 가 정한다. 화면이 -1 을 만들지 않는다 */
      /* 조치는 반납자가 신고한 값이다 · 없으면 검사에서 정한다고 적는다 */
      DB.txn({ q: q, type: '반납', qty: n,
               note: '자재반납신청서 · ' + (c ? '신고 ' + c : '상태 미정') });
      var after = DB.item(q);
      POP.show(anchor, {
        title: '반납 신청을 접수했습니다',
        rows: [['자재', r.name + ' · ' + q],
               ['수량', UI.num(n) + ' ' + r.unit +
                 (n < Number(r.left) ? ' (잔여 ' + UI.num(Number(r.left) - n) + ')' : '')],
               ['회수 금액', UI.won(n * (Number(before.price) || 0))],
               ['조치', c ? c + ' (신고값 · 검사에서 확정)' : '미정 · 검사에서 정합니다'],
               ['현재고', UI.num(before.stock) + ' → ' + UI.num(after.stock)],
               ['적정재고 조치', before.actionNow + ' → ' + after.actionNow]],
        note: '재고를 저장하지 않고 트랜잭션으로 더했습니다. 적정재고 화면 숫자도 같이 움직입니다.'
      });
    } catch (err) {
      POP.show(anchor, { title: '반납하지 못했습니다', rows: [['이유', String(err.message)]] });
    }
  }

  function wire() {
    el('tabs').addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('.tab');
      if (!b) { return; }
      tab = b.getAttribute('data-tab');
      paintTabs(); paintTable(); paintEffect();
    });

    /* 수량은 치는 대로 · 조치는 고르는 대로 받는다 */
    el('effect').addEventListener('input', function (e) {
      if (e.target.id === 'retqty') { retLive(); }
    });
    el('effect').addEventListener('change', function (e) {
      if (e.target.id !== 'retcond') { return; }
      if (picked) { cond[picked] = e.target.value; }
    });

    document.addEventListener('click', function (e) {
      var p = e.target.closest && e.target.closest('[data-pick]');
      if (p) { picked = p.getAttribute('data-pick'); paintTable(); paintEffect(); return; }
      var r = e.target.closest && e.target.closest('[data-ret]');
      if (r && window.DB) { doReturn(r.getAttribute('data-ret'), r); }
    });
  }

  function paintAll() {
    var m = window.DB ? DB.meta() : null;
    el('asof').textContent = m && m.asof ? ('기준일 ' + UI.date(m.asof)) : '기준일 확인 중';
    paintTabs(); paintTable(); paintEffect();
  }

  paintAll();
  wire();
  S.on(function () { paintTable(); paintEffect(); });
})();
</script>
<script src="assets/md.js"></script>
<script src="assets/catalog.js"></script>
<script src="assets/ask.js"></script>
<script src="assets/actions.js"></script>
<script src="assets/voice.js"></script>
<script src="assets/chat.js"></script>
<script src="assets/tour.js"></script>
</body>
</html>
