# 02_프롬프트/00_마스터_구현_프롬프트.md 5절 확정 파라미터. 재튜닝 금지(실측 확정값).
embedding:
  provider: "local"
  model_name: "BAAI/bge-m3"
  dimension: 1024
  max_seq_length: 2048
  normalize: true
  device: "auto"
  query_prefix: ""
  torch_threads: null

vectorstore:
  provider: "qdrant"
  mode: "server"
  collection_name: "material_rag"
  dense_vector_name: "dense"
  sparse_vector_name: "bm25"
  use_sparse: false
  distance: "cosine"
  store_text: false
  timeout_seconds: 60
  read_only: true

retrieval:
  mode: "hybrid"          # hybrid | bm25
  # ★ 문서수준 dense 게이트
  # 색인의 chunk_id 정렬은 재현되지 않아(정합 20%) 본문 하이드레이션에 쓸 수 없다.
  # 반면 doc_id 는 30/30 일치하므로 "어느 문서가 관련 있는가" 신호는 신뢰할 수 있다.
  # 따라서 dense 는 문서 순위만 제공하고, 실제 청크·본문은 로컬 BM25 에서만 가져온다.
  doc_gate:
    enabled: true
    dense_limit: 50       # 문서 신호 수집용 dense 히트 수
    doc_top: 5            # 가중할 상위 문서 수
    doc_weight: 0.6       # 곱셈 가중 계수. 1위 문서 ×1.6, 5위 문서 ×1.12
  fusion: "rrf"
  rrf_k: 10
  dense_limit: 20
  bm25_limit: 20
  candidate_k: 20
  top_k: 5
  similarity_threshold: 0.0
  bm25:
    tokenizer: "kiwi"
    k1: 1.2
    b: 0.75
    keep_pos: ["NNG","NNP","NNB","NR","SL","SN","VV","VA","XR"]
  category_weights:
    enabled: true
    default_weight: 0.90
    weights: {guideline: 1.00, contract: 0.95, manual: 0.90, training: 0.85, faq: 0.75}
    min_non_faq_candidates: 3
  metadata_filter:
    enabled: true
    auto_category_filter: false

reranker:
  enabled: true
  model_name: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
  rerank_top_k: 5
  batch_size: 8
  max_length: 512
  device: "auto"
  score_threshold: null

llm:
  provider: "openrouter"
  model: "google/gemini-3.1-flash-lite"
  fallback_models:
    - "google/gemini-2.5-flash-lite"
    - "qwen/qwen3-next-80b-a3b-instruct"
    - "anthropic/claude-haiku-4.5"
  temperature: 0.0
  max_tokens: 1024
  timeout_seconds: 120
  max_retries: 3
  max_context_chars: 24000
  min_citation_coverage: 0.5

workflow:
  query_rewrite: false
  self_check: false
  max_retry_on_low_recall: 1
  no_answer_message: "제공된 사내 문서에서 해당 내용을 찾을 수 없습니다."

api:
  preload_models: true
  allowed_origins: ["null","http://localhost:8000","http://127.0.0.1:8000",
                    "http://localhost:5173","http://localhost:3000"]
  allowed_origin_regex: null

security:
  mask_pii: true
  audit_log: true
  log_raw_query: false
  allow_external_embedding: false

paths:
  chunks_file: "data/chunks/chunks.jsonl"
  bm25_index: "data/index/bm25_index.json"
  models_cache_dir: "models"

# --- 정형(SQL) 라우팅 · A안 (05_정형데이터_라우팅_프롬프트.md) ---
# A안은 원천 CSV 4종만 적재한다. 적정재고 산출 결과는 반입하지 않았으므로
# order_urgent · pooling_candidates 는 만들지 않고, 그 의도로 분류되면 답할 수 없음을 밝힌다.
structured:
  enabled: true
  provider: "sqlite"
  db_path: "data/structured/materials.db"
  asof: "2026-09-03"                  # 원천 CSV 기준일. 모든 정형 답변에 명시한다
  sample_notice: "※ 아래 수치는 연습용 샘플 데이터(자재 743종)이며 실제 사내 자재 데이터가 아닙니다."
  router:
    mode: "rule_then_llm"             # rule | llm | rule_then_llm
    default_route: "rag"              # 판단 불가 시 안전한 쪽
    rule_confidence_threshold: 0.7
  query:
    read_only: true
    max_rows: 200
    timeout_seconds: 5
    mask_unit_cost: false             # 단가·금액은 마스킹 없이 전송(승인됨)
