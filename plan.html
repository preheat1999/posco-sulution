<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>적정구매시점 · AI 자재 솔루션</title>
<link rel="stylesheet" href="assets/shell.css">
<script>window.PAGE = 'plan';</script>
</head>
<body>

<div class="layout">
  <aside class="side" id="side"></aside>

  <main class="main">
    <div class="top">
      <div class="top-left">
        <button class="hamb" id="hamb" aria-label="메뉴" aria-expanded="false">&#9776;</button>
        <div>
          <div class="crumb" data-group="분석">&nbsp;</div>
          <h1>적정구매시점</h1>
        </div>
      </div>
      <div class="top-right">
        <span class="pill" id="asof">기준일 확인 중</span>
        <div class="avatar">이</div>
      </div>
    </div>

    <!-- 어느 날짜 기준의 데이터인가. 제목 밑에 먼저 적는다 -->
    <div class="stampbar" id="stamp"></div>

    <!-- 머리 카드 네 장. 마감일 산식은 WO 머리의 수리계획 배지에서 본다 -->
    <div class="statrow cards" id="stat"></div>

    <div class="phead">
      <div class="tabs" id="tabs"></div>
      <div class="ptools">
        <div class="seg" id="sort">
          <button type="button" data-sort="week" class="on">이번 주 WO</button>
          <button type="button" data-sort="due">마감 급한 순</button>
          <button type="button" data-sort="stop">작업 계획일 순</button>
        </div>
      </div>
    </div>

    <div id="list"></div>
    <div class="pagerow">
      <span id="pinfo">&nbsp;</span>
      <span class="pg">
        <button class="btn line sm" type="button" id="prev">이전</button>
        <button class="btn line sm" type="button" id="next">다음</button>
      </span>
    </div>

    <p class="note" style="margin-top:14px" id="foot">&nbsp;</p>
  </main>
</div>

<div class="overlay" id="overlay"></div>

<script src="assets/config.js"></script>
<!-- .env 에서 내려온 연결값 (토큰) · serve.py 가 만든다 · 없으면 그냥 넘어간다 -->
<script src="assets/config.local.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/org.js"></script>
<script src="assets/popover.js"></script>
<script src="assets/db-master.js"></script>
<script src="assets/db-derived.js"></script>
<script src="assets/db-changes.js"></script>
<script src="assets/db.js"></script>
<script src="assets/db-biz.js"></script>
<script src="assets/plan-data.js"></script>
<script src="assets/analysis-data.js"></script>
<script src="assets/screen-data.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  'use strict';

  var S = window.SCREEN;
  var sort = 'week';        // 이번 주에 손이 가는 WO 부터 본다
  var tab = 'all';
  var PAGE = 6;
  var page = 0;
  var open = {};        // 펼친 WO

  var TABS = [
    { key: 'over', label: '마감 초과' },
    { key: 'need', label: '발주 필요' },
    { key: 'all', label: '전체' }
  ];

  function el(id) { return document.getElementById(id); }
  function asof() { return window.DB ? DB.meta().asof : (window.CFG && CFG.BASE_DATE); }

  function paintStat() {
    var c = S.planCounts();
    el('stat').innerHTML =
      cell(UI.num(c.wos), '건', '내 담당 WO 정비계획',
           '기준일부터 ' + UI.num(c.mdays) + '일 이내') +
      cell(UI.num(c.mats), '종', '예상 소요 자재', '이 달 정비계획에 걸린 자재', '', true) +
      cell(UI.num(c.over + c.soon), '건', '발주 마감 초과 및 임박',
           '지금 신청해야 하는 정비계획', 'ins') +
      cell(UI.wonMNum(c.orderAmt), '백만원', '예상 발주금액',
           '부족분 기준 · 이관 가능분 제외');
  }

  /* 기준일 줄 · 데이터의 날짜와 지금 보는 시각은 다른 값이다 */
  function paintStamp() {
    var c = S.planCounts();
    var now = window.SCREEN && SCREEN.nowStamp ? SCREEN.nowStamp() : '';
    el('stamp').innerHTML =
      '<span class="st-k">데이터 기준일</span>' +
      '<b class="st-v">' + UI.esc(UI.date(asof())) + '</b>' +
      '<span class="st-x">이 달 정비계획 ' + UI.num(c.wos) + '건 · ' +
        '반출 전체 ' + UI.num(c.all) + '건 중 기준일부터 ' + UI.num(c.mdays) + '일 이내</span>' +
      (now ? '<span class="st-k" style="margin-left:auto">조회 시각</span>' +
        '<b class="st-v">' + UI.esc(now) + '</b>' : '');
  }

  function cell(v, unit, k, x, cls, ai) {
    return '<div class="scard">' +
      '<div class="sk">' + UI.esc(k) + (ai ? '<i class="ai">✦</i>' : '') + '</div>' +
      '<div class="sv' + (cls ? ' ' + cls : '') + '">' + v +
      (unit ? '<small>' + unit + '</small>' : '') + '</div>' +
      '<div class="sx">' + UI.esc(x) + '</div></div>';
  }

  // ------------------------------------------------------------ 목록
  function filtered() {
    var rows = S.planList(sort);
    if (tab === 'over') { return rows.filter(function (w) { return w.tone === 'over'; }); }
    if (tab === 'need') { return rows.filter(function (w) { return w.needCount > 0; }); }
    return rows;
  }

  function paintTabs() {
    /* 지금 정렬로 나온 목록에서 센다. 이번 주 WO 를 보면서 전체 156건 수를 적으면 안 맞는다 */
    var all = S.planList(sort);
    var n = {
      over: all.filter(function (w) { return w.tone === 'over'; }).length,
      need: all.filter(function (w) { return w.needCount > 0; }).length,
      all: all.length
    };
    el('tabs').innerHTML = TABS.map(function (t) {
      return '<button class="tab' + (t.key === tab ? ' on' : '') + '" type="button" ' +
        'data-tab="' + t.key + '">' + t.label + ' ' + UI.num(n[t.key]) + '</button>';
    }).join('');
  }

  function paintList() {
    var rows = filtered();
    var max = Math.max(0, Math.ceil(rows.length / PAGE) - 1);
    if (page > max) { page = max; }
    var view = rows.slice(page * PAGE, page * PAGE + PAGE);

    el('list').innerHTML = view.length ? view.map(function (w) {
      var on = !!open[w.wo];
      var tone = w.tone || 'fine';
      /* 설비명이 제일 크다. WO 번호는 표시용 식별자라 알약으로 앞에 붙이고,
       * 수리계획은 마감일 산식의 선행일수를 정하는 값이라 배지로 세우고 ? 를 붙인다 */
      return '<div class="wo' + (on ? ' open' : '') + '" data-wo="' + UI.esc(w.wo) + '">' +
        '<div class="wo-head" role="button" tabindex="0">' +
          UI.face(tone) +
          '<div class="wo-main">' +
            '<div class="wo-t1">' +
              '<span class="wo-chip">' + UI.esc(w.wo) + '</span>' +
              '<span class="wo-name">' + UI.esc(w.eq || '설비 미확인') + '</span>' +
              '<span class="badge rep">' + UI.esc(w.kind || '수리계획 미확인') +
                '<button class="askbtn" type="button" data-lead="' + UI.esc(w.kind || '') +
                  '" aria-label="수리계획과 마감일">?</button></span>' +
              (w.demo ? '<span class="badge">시연 일정</span>' : '') +
            '</div>' +
            '<div class="wo-sub">' + UI.esc(w.factory || '공장 미확인') + ' · ' +
              UI.esc(w.line || '라인 미확인') + ' · 자재 ' + UI.num(w.matCount) + '품목' +
              (w.needCount ? ' · 발주 필요 ' + UI.num(w.needCount) + '품목' : ' · 자재 확보') +
              '</div>' +
          '</div>' +
          '<div class="wo-right">' +
            '<div class="due-d tone-' + tone + '" style="font-size:15px">' +
              UI.esc(w.left === null ? '자재 확보' : UI.dleft(w.left)) + '</div>' +
            '<div class="due-date">마감 ' +
              UI.esc(w.dueDate ? UI.date(w.dueDate) : '없음') +
              ' · 작업 계획 ' + UI.esc(UI.date(w.stopStart)) + '</div>' +
          '</div>' +
          '<span class="sect-arrow" style="margin-left:10px">' + (on ? '∧' : '∨') + '</span>' +
        '</div>' +
        '<div class="wo-body">' + (on ? woBody(w) : '') + '</div>' +
        '</div>';
    }).join('') :
      '<div class="empty"><strong>이 칸에는 정비계획이 없습니다</strong>' +
      '다른 칸을 눌러 보세요</div>';

    el('pinfo').textContent = rows.length
      ? ('표시 ' + view.length + '건 · 전체 ' + UI.num(rows.length) + '건 · ' +
         (page + 1) + ' / ' + (max + 1))
      : '표시할 정비계획이 없습니다';
    el('prev').disabled = page <= 0;
    el('next').disabled = page >= max;

    var c = S.planCounts();
    if (sort !== 'week' && rows.length) {
      el('foot').innerHTML = '이 목록은 <b>기준일부터 ' + UI.num(c.mdays) + '일 이내 ' +
        UI.num(c.wos) + '건</b>입니다. 반출된 ' + UI.num(c.all) + '건은 넉 달에 걸쳐 있어 ' +
        '한 화면에 늘어놓으면 이번에 손댈 일이 보이지 않습니다 · 나머지는 다음 달에 ' +
        '이 화면에서 다시 봅니다. 마감을 넘긴 것이 ' + UI.num(c.over) + '건입니다.';
      return;
    }
    if (sort === 'week') {
      /* 이번 주 목록은 날짜를 시연용으로 옮긴 값이다. 그 사실을 목록 아래에 적는다 */
      el('foot').innerHTML = '<b>이번 주 WO ' + UI.num(rows.length) + '건</b>은 ' +
        '이번 주에 정비하는 건(자재 확보)과 이번 주가 발주 마감인 건을 함께 봅니다. ' +
        '<b>시연을 위해 정비계획일 · 발주 마감일만 이번 주로 옮긴 값</b>이며, ' +
        '설비 · 수리계획 · 자재 · 재고 · 부족분은 원천 값 그대로입니다. ' +
        '전체 156건은 「마감 급한 순」 에서 봅니다.';
      return;
    }
    el('foot').innerHTML = c.now
      ? ('마감을 넘긴 ' + UI.num(c.over) + '건 중 <b>지금 신청해야 하는 것은 ' +
         UI.num(c.now) + '건</b>입니다. 나머지는 마감을 넘겼지만 재고로 충당됩니다. ' +
         '마감을 넘겼다는 것과 지금 신청해야 한다는 것은 다릅니다.')
      : ('마감을 넘긴 것이 ' + UI.num(c.over) + '건이지만 <b>지금 신청할 것은 없습니다</b>. ' +
         '예상 소요가 현재고로 충당되기 때문입니다 · 마감을 넘겼다는 것과 ' +
         '지금 신청해야 한다는 것은 다릅니다. 정비 일정이 바뀌면 다시 계산됩니다.');
  }

  /* 펼친 WO · 세 날짜를 한 줄에 놓고, 걸린 자재를 표로 낸다 */
  function woBody(w) {
    var ax = S.planAxis(w, asof());
    var mats = S.planMats(w);
    var need = mats.filter(function (m) { return m.needOrder; });

    /* 점 세 개를 위치 순으로 훑어 가까운 것에만 alt 를 붙인다.
       점을 벌리면 날짜 간격을 거짓으로 보여 주는 셈이 된다 */
    var marks = [];
    if (ax.due !== null) { marks.push(['due', ax.due, '마감 ' + short(w.dueDate)]); }
    marks.push(['now', ax.now, '오늘 ' + short(asof())]);
    marks.push(['stop', ax.stop, '작업 계획 ' + short(w.stopStart)]);
    marks.sort(function (a, b) { return a[1] - b[1]; });
    var last = -99;
    marks.forEach(function (m) {
      m[3] = (m[1] - last) < 13;      // 13% 안쪽이면 글자를 아래로
      last = m[1];
    });

    /* 점 세 개가 무엇인지 위에 먼저 적는다. 색만 있으면 점의 뜻을 알 수 없다 */
    var legend = '<div class="tlegend">' +
      (ax.due !== null
        ? '<span class="tl lim"><i></i>구매신청 deadline ' + UI.esc(UI.date(w.dueDate)) + '</span>'
        : '<span class="tl"><i></i>구매신청 deadline 없음 · 자재 확보</span>') +
      '<span class="tl now"><i></i>기준일 (오늘) ' + UI.esc(UI.date(asof())) + '</span>' +
      '<span class="tl stop"><i></i>작업 계획 일정 ' + UI.esc(UI.date(w.stopStart)) +
        (ax.toStop === null ? '' : ' (' + UI.esc(UI.dleft(ax.toStop)) + ')') + '</span>' +
      '</div>';

    var line = '<div class="tline">' +
      '<div class="tline-bar"></div>' +
      (ax.fill ? '<div class="tline-fill" style="left:' + ax.fill[0].toFixed(1) +
        '%;width:' + (ax.fill[1] - ax.fill[0]).toFixed(1) + '%"></div>' : '') +
      marks.map(function (m) { return pt(m[0] + (m[3] ? ' alt' : ''), m[1], m[2]); }).join('') +
      '</div>';

    var table = mats.length ?
      '<div class="tablewrap"><table><thead><tr>' +
        '<th>자재명 / 자재코드</th><th class="num">소요 수량</th>' +
        '<th class="num">현재 재고</th><th>과부족</th><th>긴급 조치</th>' +
      '</tr></thead><tbody>' +
      mats.map(function (m) {
        if (m.missing) {
          return '<tr><td data-label="자재명 / 자재코드">' + UI.esc(m.q) +
            '</td><td data-label="소요 수량" colspan="4">정본에 없는 코드입니다</td></tr>';
        }
        /* 소요 수량은 이 정비 건의 예상 소요다. 원천에 없는 행은 목표재고를 쓰고 그렇게 적는다 ·
         * 과부족도 같은 기준이라 표 안에서 두 숫자가 어긋나지 않는다 */
        var qty = m.expect === null ? m.target : m.expect;
        return '<tr>' +
          '<td data-label="자재명 / 자재코드"><div class="cell-2">' +
            '<div class="cell-1st">' + UI.esc(m.name || '품명 미확인') + ' ' +
              UI.typeBadge(m.type) + ' ' + UI.gradeBadge(m.grade) + '</div>' +
            '<div class="cell-2nd">' + UI.esc(m.q) + '</div></div></td>' +
          '<td class="num" data-label="소요 수량">' + UI.num(qty) + ' 개' +
            (m.expect === null ? '<span class="sub"> (목표)</span>' : '') + '</td>' +
          '<td class="num" data-label="현재 재고">' + UI.num(m.stock) + ' 개</td>' +
          '<td data-label="과부족">' + (m.need > 0
            ? '<span class="badge insur">' + UI.num(m.need) + '개 부족</span>'
            : '<span class="sub">0 (정상)</span>') + '</td>' +
          '<td data-label="긴급 조치">' + (m.needOrder
            ? '<button class="btn sm" type="button" data-draft="' + UI.esc(m.q) +
              '" data-wo="' + UI.esc(w.wo) + '">구매신청 초안 만들기 →</button>'
            : '<span class="badge ok">준비 완료</span>') + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table></div>' :
      '<div class="empty"><strong>이 정비계획에 걸린 자재가 없습니다</strong>' +
      '원천의 자재계획에 연결이 없습니다</div>';

    var noExpect = mats.filter(function (m) { return !m.missing && m.expect === null; }).length;

    var shortSum = mats.reduce(function (t, m) { return t + (m.missing ? 0 : m.need); }, 0);

    return legend + line +
      '<p class="note" style="margin:10px 0 14px">리드타임 평균 ' + UI.num(w.ltMean) + '일 · ' +
        '수리계획 ' + UI.esc(w.kind || '미확인') + '' +
        (w.driver ? ' · 마감을 정한 자재 ' + UI.esc(w.driver) : '') +
        (w.hours ? ' · 작업 ' + UI.num(w.hours) + '시간' : '') + '</p>' +
      '<div class="phead" style="margin-bottom:10px">' +
        '<p class="gt" style="margin:0"><span>소요 필수 자재 현황 (' +
          UI.num(mats.length) + '건)</span></p>' +
        '<span class="wo-short' + (shortSum ? ' bad' : '') + '">' +
          (shortSum ? '총 ' + UI.num(shortSum) + '개 부족 · 발주 필요 ' +
            UI.num(need.length) + '품목' : '자재 확보 완료') + '</span>' +
      '</div>' +
      table +
      (noExpect ? '<p class="note" style="margin-top:10px"><b>' + UI.num(noExpect) +
        '품목은 이 정비 건의 예상 소요가 원천에 없습니다.</b> ' +
        '예상 소요는 정비계획에 걸린 자재에만 있어서, 부족분은 목표재고 기준으로 셉니다.</p>' : '');
  }

  function pt(cls, at, label) {
    return '<div class="tline-pt ' + cls + '" style="left:' +
      Math.max(6, Math.min(94, at)).toFixed(1) + '%"><i></i><span>' + UI.esc(label) + '</span></div>';
  }

  function short(d) { return window.UI ? UI.dateShort(d) : String(d); }

  // ------------------------------------------------------------ 이벤트
  function wire() {
    el('tabs').addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('.tab');
      if (!b) { return; }
      tab = b.getAttribute('data-tab'); page = 0;
      paintTabs(); paintList();
    });

    /* 수리계획 배지의 ? · 마감일 산식과 그 계획의 선행일수를 여기서 본다
     * (옛 산식 알약이 있던 자리다) */
    el('list').addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('[data-lead]');
      if (!b) { return; }
      e.stopPropagation();          // WO 를 펼치지 않는다
      var L = S.planLead(b.getAttribute('data-lead'));
      POP.show(b, {
        title: '수리계획 · ' + L.kind,
        rows: [['이 계획의 선행일수', L.days === null ? '명세에 없습니다' : L.days + '일']]
          .concat(Object.keys(L.all).map(function (k) {
            return ['선행일수 · ' + k, L.all[k] + '일'];
          }))
          .concat([['내림 처리', 'floor · 하루라도 늦으면 작업 계획 일정에 못 맞춘다']]),
        formula: L.formula,
        note: L.note
      });
    });

    el('sort').addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('button');
      if (!b) { return; }
      sort = b.getAttribute('data-sort'); page = 0;
      /* 이번 주 WO 는 여섯 건이라 칸을 좁히면 빈 목록이 된다 */
      if (sort === 'week') { tab = 'all'; }
      [].forEach.call(el('sort').children, function (x) { x.classList.toggle('on', x === b); });
      paintList();
    });

    el('prev').addEventListener('click', function () { page -= 1; paintList(); });
    el('next').addEventListener('click', function () { page += 1; paintList(); });

    el('list').addEventListener('click', function (e) {
      /* 초안 버튼은 접기를 건드리지 않는다 */
      /* 초안을 만들고 구매신청 화면까지 데려간다.
       * 여기서 끝내면 「그래서 어디서 신청하나」 가 끊긴다 · 물음은 짧게 한 줄이다 */
      var d = e.target.closest && e.target.closest('[data-draft]');
      if (d) {
        var q = d.getAttribute('data-draft'), wo = d.getAttribute('data-wo');
        var m = DB.item(q);
        if (!m) { return; }
        var qty = Number(m.needNow) || 0;
        UI.confirm({
          title: '구매신청 화면으로 넘어갈까요?',
          body: '<b>' + UI.esc(m.name) + '</b> · ' + UI.esc(q) + ' · ' + UI.num(qty) + '개',
          rows: [['근거 정비계획', wo]],
          ok: '초안 만들고 이동',
          cancel: '여기 머무르기',
          onOk: function () {
            try {
              DB.draft('PR', { q: q, data: { qty: qty, wo: wo,
                why: '정비계획 ' + wo + ' 소요 부족' } });
              window.location.href = 'purchase.html#q=' + encodeURIComponent(q) +
                '&wo=' + encodeURIComponent(wo);
            } catch (err) {
              POP.show(d, { title: '초안을 만들지 못했습니다',
                rows: [['이유', String(err.message)]] });
            }
          }
        });
        return;
      }
      var h = e.target.closest && e.target.closest('.wo-head');
      if (!h) { return; }
      var wo2 = h.parentNode.getAttribute('data-wo');
      open[wo2] = !open[wo2];
      paintList();
    });
  }

  function paintAll() {
    var m = window.DB ? DB.meta() : null;
    el('asof').textContent = m && m.asof ? ('기준일 ' + UI.date(m.asof)) : '기준일 확인 중';
    paintStat(); paintStamp(); paintTabs(); paintList();
  }

  paintAll();
  wire();
  S.on(paintList);
})();
</script>
