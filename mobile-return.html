<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자재반납 · 현장</title>
<link rel="stylesheet" href="assets/shell.css">
<script>window.PAGE = 'return';</script>
</head>
<body>

<!-- 셸을 쓰지 않는다. 현장에서 한 손으로 쓰는 화면이라 사이드바가 방해가 된다 -->
<div class="phone">
  <div class="phone-top">
    <a class="homebtn" href="return.html" aria-label="돌아가기">←</a>
    <div style="min-width:0">
      <div style="font-size:13.5px;font-weight:600">자재반납</div>
      <div style="font-size:10.5px;color:var(--muted)" id="who">&nbsp;</div>
    </div>
    <span class="pill" style="margin-left:auto" id="asof">&nbsp;</span>
  </div>

  <div class="phone-body">
    <div id="pick"></div>
    <div id="panel"></div>
  </div>
</div>

<script src="assets/config.js"></script>
<!-- .env 에서 내려온 연결값 · serve.py 가 만든다 · 없으면 그냥 넘어간다 -->
<script src="assets/config.local.js"></script>
<!-- http 로 들어왔으면 같은 자리의 https 로 올린다 · 마이크는 https 에서만 열린다 -->
<script src="assets/secure.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/org.js"></script>
<script src="assets/popover.js"></script>
<script src="assets/db-master.js"></script>
<script src="assets/db-derived.js"></script>
<script src="assets/db-changes.js"></script>
<script src="assets/db.js"></script>
<!-- 음성은 한국어로 받아쓰고 품명은 영어다 · 그 사이를 잇는다 (너트 → Nut) -->
<script src="assets/ko-en.js"></script>
<script src="assets/db-biz.js"></script>
<script src="assets/plan-data.js"></script>
<script src="assets/analysis-data.js"></script>
<script src="assets/screen-data.js"></script>
<script src="assets/qr-items.js"></script>
<script>
(function () {
  'use strict';

  var S = window.SCREEN;

  /* 자재코드가 들어오는 길 세 가지 ·
   *   ?code=Q4046777   자재 확인 화면(material-view.html)에서 넘어올 때
   *   #Q1000108        옛 QR · 목록에서 고른 뒤 주소에 남는 값
   *   sessionStorage   주소가 지워지는 경로(홈 화면 추가 · 리다이렉트)를 대비한 보험
   * 코드가 있으면 1단계(자재 고르기)를 건너뛰고 2단계부터 시작한다 */
  function readCode() {
    /* 목록을 보러 온 것이면 세션에 남은 코드를 버린다.
     * 이게 없으면 「다른 자재 반납」 을 눌러도 세션 코드 때문에 같은 자재가 또 열렸다 */
    if (String(location.search || '').indexOf('list=1') >= 0) {
      try { window.sessionStorage.removeItem('mtrl.qr.code'); } catch (e) { /* 무시 */ }
      return '';
    }
    var m = String(location.search || '').match(/[?&]code=([^&]*)/);
    if (m) { return decodeURIComponent(m[1]); }
    var h = String(location.hash || '').replace('#', '');
    if (h) { return h; }
    try { return window.sessionStorage.getItem('mtrl.qr.code') || ''; }
    catch (e) { return ''; }
  }

  var q = (function () {
    var c = window.QRDB ? QRDB.norm(readCode()) : readCode();
    return c || null;
  })();
  /* QR 로 들어왔는가 · 그러면 「목록으로」 대신 「자재 확인으로」 를 보여 준다 */
  var viaQr = !!(String(location.search || '').indexOf('code=') >= 0);
  var qty = null;
  var cond = null;
  var done = false;

  /* 반납자 · 현장에서 이 사람이 반납했다는 기록이 남는다.
   * 로그인 세션이 있으면 그 사람으로 채우고, 없으면 아래 기본값이다 ·
   * 폰은 여러 사람이 돌려 쓰기 때문에 고칠 수 있어야 한다 */
  /* 반납자는 자재 확인 화면(material-view.html)에서 확인한 값이다.
   * 여기서는 고치지 않고 그대로 보여 준다 · 두 화면에서 따로 고치면 어느 값이 남는지 흐려진다 */
  var who = (function () {
    var saved = null;
    try { saved = JSON.parse(window.sessionStorage.getItem('mtrl.qr.who') || 'null'); }
    catch (e) { saved = null; }
    var me = window.ORG ? ORG.load() : null;
    return {
      emp: (saved && saved.emp) || (me && me.empNo) || '638844',
      name: (saved && saved.name) || (me && me.name) || '이예열'
    };
  })();

  /* 반납 대상 한 건을 만든다.
   *
   * 원래 이 화면은 불출 잔여가 있는 10건만 다뤘다. QR 은 그 목록에 없는 자재도 열 수 있다 ·
   * 자재식별표는 다른 부서 것도 있고, 정본에 있어도 불출 이력이 없을 수 있다.
   * 그때는 식별표에 인쇄된 값으로 초안을 만든다 · 없는 값을 지어내지 않고 그대로 적는다 */
  function target() {
    if (!q) { return null; }
    var hit = rows().filter(function (x) { return x.q === q; })[0];
    if (hit) { return hit; }
    var r = window.QRDB ? QRDB.get(q) : null;
    if (!r) { return null; }
    return {
      q: r.code, name: r.name || '품명 미확인', unit: r.unit || 'EA',
      cond: '신품', left: Number(r.qty) || 1,
      asm: r.spec || '', locator: r.wh || '',
      qrOnly: !r.inMaster, qr: r, off: null, wo: null
    };
  }

  function el(id) { return document.getElementById(id); }
  function rows() { return S.retList('all'); }

  function paintHead() {
    var me = window.ORG ? ORG.load() : null;
    el('who').textContent = me ? (me.name + ' 사원 · ' + me.part) : '현장 반납';
    var m = window.DB ? DB.meta() : null;
    el('asof').textContent = m && m.asof ? UI.dateShort(m.asof) : '';
  }

  /* 자재를 안 고르고 들어오면 목록부터 보여 준다.
   * QR 로 들어오면 코드가 주소에 붙어 있어 바로 그 자재로 간다 */
  function paintPick() {
    var list = rows();
    if (q) { el('pick').innerHTML = ''; return; }
    el('pick').innerHTML =
      '<p class="gt"><span>반납할 자재를 고르세요</span>' +
        '<span class="gt-sub">' + UI.num(list.length) + '건</span></p>' +
      '<div class="picklist">' + list.map(function (r) {
        return '<button class="pick" type="button" data-q="' + UI.esc(r.q) + '">' +
          '<span class="pick-body">' +
            '<span class="pick-name">' + UI.esc(r.name) + '</span>' +
            /* 상태(신품 · 중고)는 반납 뒤에 정한다 · 목록에 미리 적지 않는다 */
            '<span class="pick-meta">' + UI.esc(r.q) +
              ' · 잔여 ' + UI.num(r.left) + ' ' + UI.esc(r.unit) +
              (r.returned ? ' · 반납 완료' : '') + '</span>' +
          '</span>' +
          '<span class="pick-right"><span class="pick-v">' + UI.num(r.left) + '</span>' +
            '<span class="pick-k">' + (r.returned ? '반납함' : '잔여') +
            '</span></span></button>';
      }).join('') + '</div>';
  }

  function paintPanel() {
    if (!q) { el('panel').innerHTML = ''; return; }
    var r = target();
    if (!r) {
      el('panel').innerHTML = '<div class="empty"><strong>' +
        (window.QRDB && !QRDB.valid(q) ? '자재코드 형식이 아닙니다' : '등록되지 않은 자재입니다') +
        '</strong>' + UI.esc(q) + ' 는 자재 대장과 QR 등록 자재에 모두 없습니다 · ' +
        '자재 담당자에게 코드를 확인하세요</div>' +
        '<a class="btn line block" href="mobile-return.html?list=1" style="margin-top:12px">' +
        '반납 목록으로</a>';
      return;
    }
    if (qty === null) { qty = r.left; }
    /* 상태는 반납 뒤에 정한다 · 여기서는 비워 둔다 */
    cond = '';

    if (done) { el('panel').innerHTML = doneView(r); return; }

    var e = r.qrOnly ? null : S.retEffect({ q: r.q, left: qty });
    el('panel').innerHTML =
      (r.qrOnly
        ? '<div class="callout" style="margin:0 0 14px;background:var(--surface-2);' +
          'border:1px solid var(--line)"><span class="ci" style="color:var(--b1)">▣</span>' +
          '<span><b style="color:var(--text)">QR 로 들어온 자재입니다</b>' +
          '재고부서 ' + UI.esc(r.qr.deptCode) + ' · 담당 ' + UI.esc(r.qr.owner || '미확인') +
          ' · 창고 ' + UI.esc(r.qr.wh || '미확인') + '<br>' +
          '우리 부서 자재 대장 밖이라 반납 접수만 기록됩니다.</span></div>'
        : '') +
      '<p class="gt"><span>' + (r.qrOnly ? '식별표 수량' : '불출 잔여') +
        '</span><span class="gt-sub">' + UI.esc(r.q) + '</span></p>' +
      '<h1 style="font-size:19px;font-weight:600;letter-spacing:-.5px;margin-bottom:2px">' +
        UI.esc(r.name) + '</h1>' +
      '<p class="sub">' + UI.esc(r.asm || '') +
        (r.locator ? ' · 보관 ' + UI.esc(r.locator) : '') + '</p>' +

      /* 큰 숫자 하나와 큰 버튼 두 개. 장갑을 끼고도 눌러야 한다 */
      '<div class="card" style="margin-top:14px;text-align:center">' +
        '<div style="font-size:44px;font-weight:600;letter-spacing:-2px;line-height:1.1">' +
          UI.num(qty) + '<small style="font-size:16px;color:var(--muted);margin-left:4px">' +
          UI.esc(r.unit) + '</small></div>' +
        '<div class="sub">반납 수량 · ' + (r.qrOnly ? '식별표 ' : '잔여 ') +
          UI.num(r.left) + '</div>' +
        '<div style="display:flex;gap:12px;justify-content:center;margin-top:14px">' +
          '<button class="stepbtn" type="button" data-step="-1" aria-label="하나 줄이기"' +
            (qty <= 1 ? ' disabled' : '') + '>−</button>' +
          '<button class="stepbtn" type="button" data-step="1" aria-label="하나 늘리기"' +
            (qty >= Number(r.left) ? ' disabled' : '') + '>+</button>' +
        '</div>' +
      '</div>' +

      /* 물품 상태는 반납한 뒤 검사에서 사람이 정한다. 여기서 미리 고르게 하면
       * 현장에서 찍은 값이 검사 결과처럼 남는다 */
      '<div class="callout" style="margin-top:16px;background:var(--surface-2);' +
        'border:1px solid var(--line)"><span class="ci" style="color:var(--muted)">◇</span>' +
        '<span><b style="color:var(--text)">물품 상태는 반납 뒤에 정합니다</b>' +
        '신품 · 중고 · 불용 판정은 반납받은 자재를 검사하고 담당자가 정합니다 · ' +
        '이 화면에서는 정하지 않습니다.</span></div>' +

      '<p class="gt" style="margin:16px 0 8px"><span>반납자</span>' +
        '<span class="gt-sub">자재 확인 화면에서 확인한 값</span></p>' +
      '<div class="fgrid">' +
        '<div class="fval"><span class="fk">사번</span>' +
          '<span class="fv">' + UI.esc(who.emp) + '</span></div>' +
        '<div class="fval"><span class="fk">이름</span>' +
          '<span class="fv">' + UI.esc(who.name) + '</span></div>' +
      '</div>' +

      /* 회수 금액 · 이 반납으로 부서 장부에 돌아오는 돈이다.
       * 정본 자재는 어댑터가 낸 값(재고 · 조치까지), QR 로 들어온 자재는 단가 × 수량이다 */
      (e
        ? '<div class="callout ok" style="margin-top:16px"><span class="ci">₩</span>' +
          '<span><b>회수 금액 ' + UI.won(e.amount) + '</b>' +
          '재고 ' + UI.num(e.stock[0]) + ' → ' + UI.num(e.stock[1]) +
          ' · 조치 ' + UI.esc(e.action[0]) + ' → ' + UI.esc(e.action[1]) + '</span></div>'
        : (r.qrOnly && Number(r.qr.price)
          ? '<div class="callout ok" style="margin-top:16px"><span class="ci">₩</span>' +
            /* 식별표 금액과 대조하니 원 단위 그대로 적는다 · 「2만원」 으로 뭉치면 못 견준다 */
            '<span><b>회수 금액 ' +
              UI.num(Math.round(Number(r.qr.price) * qty)) + '원</b>' +
            '단가 ' + UI.num(Math.round(Number(r.qr.price))) + '원 × ' + UI.num(qty) + ' ' +
            UI.esc(r.unit) + ' · 부서 재고에는 반영되지 않습니다</span></div>'
          : '')) +

      '<button class="btn block" type="button" id="go" ' +
        'style="min-height:52px;margin-top:16px">반납 처리</button>' +
      (viaQr
        ? '<a class="btn line block" href="material-view.html?code=' +
          encodeURIComponent(r.q) + '" style="margin-top:10px">자재 확인으로 돌아가기</a>'
        : '<a class="btn line block" href="mobile-return.html?list=1" ' +
          'style="margin-top:10px">다른 자재 고르기</a>');
  }

  function doneView(r) {
    var t = (window.DB && !r.qrOnly) ? DB.item(r.q) : null;
    var log = window.DB && DB.qrReturns ? DB.qrReturns(r.q) : [];
    var last = log.length ? log[log.length - 1] : null;
    return '<div class="card" style="text-align:center;margin-top:20px">' +
woChk() +
      '<h1 style="font-size:20px;font-weight:600;margin:12px 0 4px">반납 완료</h1>' +
      '<p class="sub">' + UI.esc(r.name) + ' · ' + UI.num(qty) + ' ' + UI.esc(r.unit) +
        '<br>반납자 ' + UI.esc(who.name) + ' · 사번 ' + UI.esc(who.emp) + '</p>' +
      (t ? '<div class="pgrid" style="margin-top:16px;text-align:left">' +
        '<div><div class="pk">현재고</div><div class="pv">' + UI.num(t.stock) + '</div></div>' +
        '<div><div class="pk">조치</div><div class="pv">' + UI.esc(t.actionNow) + '</div></div>' +
      '</div>' : '') +
      (r.qrOnly ? '<div class="pgrid" style="margin-top:16px;text-align:left">' +
        '<div><div class="pk">접수 시각</div><div class="pv">' +
          UI.esc(last ? last.at : '미기록') + '</div></div>' +
        '<div><div class="pk">재고부서</div><div class="pv">' +
          UI.esc(r.qr.deptCode || '미확인') + '</div></div>' +
      '</div>' +
      '<p class="note" style="margin-top:12px;text-align:left">우리 부서 자재 대장 밖 ' +
        '자재라 부서 재고는 그대로입니다. 접수 이력은 담당 ' +
        UI.esc(r.qr.owner || '미확인') + ' · ' + UI.esc(r.qr.tel || '연락처 미확인') +
        ' 로 전달할 값입니다.</p>' : '') +
      '</div>' +
      '<p class="note" style="margin-top:12px;text-align:left">물품 상태(신품 · 중고 · 불용)는 ' +
        '반납받은 자재를 검사하고 담당자가 정합니다 · 반납 화면의 <b>반납 완료</b> 칸에서 ' +
        '확정된 상태를 봅니다.</p>' +
      '<a class="btn block" href="mobile-return.html?list=1" style="margin-top:14px">' +
        '다른 자재 반납</a>' +
      '<a class="btn line block" href="return.html" style="margin-top:10px">' +
        '반납 화면으로</a>';
  }

  function woChk() {
    return '<svg viewBox="0 0 48 48" style="width:48px;height:48px" role="img" ' +
      'aria-label="완료"><circle cx="24" cy="24" r="21" fill="none" ' +
      'stroke="var(--ok)" stroke-width="2.5"/>' +
      '<path d="M15 25 L21 31 L33 18" fill="none" stroke="var(--ok)" ' +
      'stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  document.addEventListener('click', function (e) {
    var p = e.target.closest && e.target.closest('[data-q]');
    if (p) {
      q = p.getAttribute('data-q'); qty = null; cond = null;
      location.hash = q;
      paintPick(); paintPanel();
      return;
    }
    var st = e.target.closest && e.target.closest('[data-step]');
    if (st) {
      /* target() 으로 찾는다 · rows() 는 불출 잔여가 있는 자재만이라
       * QR 로 들어온 자재에서는 버튼이 아무 일도 하지 않았다 */
      var r = target();
      if (!r) { return; }
      var max = Math.max(1, Number(r.left) || 1);
      qty = Math.max(1, Math.min(max, (Number(qty) || 0) + Number(st.getAttribute('data-step'))));
      paintPanel();
      return;
    }

    /* 반납자 입력 · 값만 담아 둔다. 여기서 다시 그리면 글자 칠 때마다 칸이 튄다 */
    var wi = e.target.closest && e.target.closest('[data-who]');
    if (wi) { return; }
    if (e.target.closest && e.target.closest('#go')) {
      var r2 = target();
      if (!r2 || !window.DB) { return; }
      try {
        /* 정본 자재면 재고까지 움직이고, QR 로 들어온 정본 밖 자재면 접수만 기록한다.
         * 그 판단은 데이터층(DB.qrReturn)이 한다 · 화면이 정하지 않는다 */
        DB.qrReturn({
          code: r2.q, dept: r2.qrOnly ? (r2.qr.deptCode || '') : undefined,
          qty: qty, unit: r2.unit, cond: cond,
          by: (who.name || '담당자') + (who.emp ? ' (' + who.emp + ')' : ''),
          cond: '',                       // 상태는 반납 뒤 검사에서 정한다
          note: (viaQr ? '현장 QR 반납' : '현장 반납') + ' · 상태 미정'
        });
        done = true;
        paintPanel();
      } catch (err) {
        POP.show(e.target, { title: '반납하지 못했습니다',
          rows: [['이유', String(err.message || err)]] });
      }
    }
  });

  /* 반납자 칸에 친 값을 담아 둔다. 다시 그릴 때 그 값으로 채운다 */
  document.addEventListener('input', function (e) {
    var wi = e.target.closest && e.target.closest('[data-who]');
    if (!wi) { return; }
    who[wi.getAttribute('data-who')] = String(e.target.value || '').trim();
  });

  paintHead();
  paintPick();
  paintPanel();
})();
</script>
</body>
</html>
