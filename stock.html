<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>적정재고 분석 · AI 자재 솔루션</title>
<link rel="stylesheet" href="assets/shell.css">
<script>window.PAGE = 'stock';</script>
</head>
<body>

<div class="layout">
  <aside class="side" id="side"></aside>

  <main class="main">
    <div class="top">
      <div class="top-left">
        <button class="hamb" id="hamb" aria-label="메뉴" aria-expanded="false">&#9776;</button>
        <div>
          <div class="crumb" data-group="분석">&nbsp;</div>
          <h1>적정재고 분석</h1>
        </div>
      </div>
      <div class="top-right">
        <span class="pill" id="asof">기준일 확인 중</span>
        <div class="avatar">이</div>
      </div>
    </div>

    <!-- 값 네 개를 한 카드 안에 나란히. 가운데(전수 743)가 이 화면의 모집단이라 크게 둔다 -->
    <section class="card kpistrip"><div class="kpistrip-in" id="stat"></div></section>

    <!-- 보유목적 판단과 이어진다 · 확정 대기가 있는지, 확정이 목표를 바꿨는지 적는다 -->
    <div class="noticebar" id="stagebar" style="margin-bottom:16px" hidden></div>

    <!-- 분석 전 · 여기서 사람이 분석을 실행한다 -->
    <section class="card runhero" id="anahero" hidden></section>

    <!-- 분석 결과 · 한 칸이 한 품목이다. kpistrip 과 단계 사이를 이것으로 채운다 -->
    <section class="card heat" id="heat" hidden></section>

    <!-- 손으로 할 일만 단계로 남긴다 · 3 조치 판정 · 4 공용화 · 5 금융비용 -->
    <div id="steps" hidden></div>

    <p class="note" style="margin-top:16px">
      목표재고 · 조치 · 등급은 모두 명세의 산식으로 계산한 값입니다 ·
      <b>화면이 상수를 만들지 않습니다</b>
    </p>
  </main>
</div>

<div class="overlay" id="overlay"></div>

<script src="assets/config.js"></script>
<!-- .env 에서 내려온 연결값 (토큰) · serve.py 가 만든다 · 없으면 그냥 넘어간다 -->
<script src="assets/config.local.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/org.js"></script>
<script src="assets/popover.js"></script>
<script src="assets/db-master.js"></script>
<script src="assets/db-derived.js"></script>
<script src="assets/db-changes.js"></script>
<script src="assets/db.js"></script>
<script src="assets/db-biz.js"></script>
<script src="assets/plan-data.js"></script>
<script src="assets/analysis-data.js"></script>
<script src="assets/screen-data.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  'use strict';

  var S = window.SCREEN;
  var A = window.ANALYSIS;
  var tab = 'order';        // 발주 필요부터 본다. 지금 해야 하는 일이다
  var query = '';
  var PAGE = 8;
  var page = 0;
  var stage = S.stockStage();   // 'raw' · 분석 전 | 'done' · 결과가 올라와 있다
  var running = false;

  /* 대시보드의 「적정재고 분석 열기」 처럼 결과를 직접 가리키는 주소로 들어오면
   * 분석된 화면을 바로 본다. 그냥 메뉴로 들어오면 분석 전부터 시작한다 */
  if ((location.hash || '').indexOf('order') >= 0 || (location.hash || '').indexOf('cut') >= 0) {
    stage = 'done'; S.setStockStage('done');
    if (!S.stockStamp()) { S.setStockStamp(S.nowStamp()); }
  }
  /* 챗봇 · 음성의 「Q1000108 적정재고 화면에서 보여줘」 는 #q=코드 로 들어온다 ·
   * 분석된 화면에서 그 자재 하나만 찾은 표를 바로 본다 (칸은 「전체」 · 어느 조치든 보이게) */
  (function () {
    var m = String(location.hash || '').match(/q=(Q\d{7})/i);
    if (!m) { return; }
    query = m[1].toUpperCase(); tab = 'all';
    stage = 'done'; S.setStockStage('done');
    if (!S.stockStamp()) { S.setStockStamp(S.nowStamp()); }
  })();

  function el(id) { return document.getElementById(id); }

  // ------------------------------------------------------------ 머리 숫자
  function paintStat() {
    var w = A.money(), s = A.summary(), c = S.stockCounts();
    /* 맨 왼쪽이 모집단이다 · 「무엇을 몇 품목 본 것인가」 를 먼저 읽어야
     * 그다음 세 숫자(회수 · 감축 · 발주)가 무엇의 일부인지 알 수 있다.
     * 그 뒤로 빼는 쪽(−) 둘, 더하는 쪽(+) 하나 순서다 */
    el('stat').innerHTML =
      box('hero', '', '분석 대상', UI.num(c.all), '품목', '전수 분석 완료',
          UI.num(c.all) + ' / ' + UI.num(c.all) + ' 계산') +
      box('ok', '−', '공용화 회수', UI.wonShort(s.poolAmt), UI.wonShortUnit(s.poolAmt),
          UI.num(s.poolItems) + '품목 정체', '즉시공용화 · 권장') +
      box('ok', '−', '감축 가능', UI.num(c.cut), '품목', UI.won(w.cutAmt) + ' 감축분',
          '목표를 넘는 몫') +
      box('core', '+', '발주 필요', UI.num(c.order), '품목',
          '즉시 ' + UI.num(s.signal.red || 0) + '건', '리드타임 고려');
  }

  function box(cls, sign, k, v, unit, x, right) {
    return '<div class="kpibox ' + cls + '">' +
      '<div class="kb-top">' +
        '<span class="kb-k">' + (sign ? '<i>' + sign + '</i>' : '') + UI.esc(k) + '</span>' +
        '<span class="kb-r">' + UI.esc(right) + '</span>' +
      '</div>' +
      '<div class="kb-v">' + v + (unit ? '<small>' + unit + '</small>' : '') + '</div>' +
      '<div class="kb-x">' + UI.esc(x) + '</div>' +
      '</div>';
  }

  // ------------------------------------------------------------ 분석 실행
  /* 분석 전 큰 카드. 무엇을 하는지 그대로 적는다 ·
   * 여기서 계산하는 것이 아니라 확정 속성으로 낸 엔진 결과를 올린다 */
  function paintHero() {
    var h = el('anahero');
    if (stage === 'done') { h.hidden = true; return; }
    var conf = window.DB ? DB.commitInfo().done : 0;
    var s = DB.summary();
    h.hidden = false;
    h.innerHTML =
      '<div class="rh-left">' +
        '<p class="gt"><span>지금 보고 있는 것</span></p>' +
        '<h2>아직 분석하지 않았습니다</h2>' +
        '<p class="sub">보유 수량과 속성만 있는 상태입니다. 목표재고 · 조치 · 금액은 ' +
          '분석을 실행하면 올라옵니다.</p>' +
        '<div class="rh-nums">' +
          '<div><b>' + UI.num(s.items) + '</b><span>분석 대상</span></div>' +
          '<div><b>' + UI.num(conf) + '</b><span>확정 속성 반영</span></div>' +
        '</div>' +
        (conf ? '' : '<p class="note" style="margin-top:12px">보유목적 판단에서 확정한 것이 ' +
          '없으면 알고리즘 판정 속성으로 분석합니다</p>') +
      '</div>' +
      '<div class="rh-right">' +
        '<button class="btn" type="button" id="ana" style="min-height:52px;padding:0 26px">' +
          '<span class="cbi">✦</span> 적정재고 분석</button>' +
        '<p class="note" style="margin-top:10px">확정 속성별 공식으로 목표재고를 잡고, ' +
          '보유와의 차이로 조치를 판정합니다</p>' +
        '<div class="runsteps" id="anasteps" hidden></div>' +
      '</div>';
  }

  /* 「분석」 · 확정 속성으로 낸 결과(2층)를 화면에 올린다. 문구는 실제로 하는 일만 적는다 */
  function runAnalysis() {
    if (running) { return; }
    running = true;
    var conf = DB.commitInfo().done;
    var STEPS = [
      '확정 속성 반영 · ' + UI.num(conf) + '품목',
      '속성별 공식으로 목표재고 결과 불러오기',
      '보유 → 목표 차이로 조치 판정',
      '감축 · 회수 · 금융비용 금액 환산'
    ];
    var box = el('anasteps'), btn = el('ana');
    box.hidden = false; btn.disabled = true;
    var i = 0;
    (function tick() {
      if (i >= STEPS.length) {
        S.setStockStage('done'); S.setStockStamp(S.nowStamp());
        stage = 'done'; running = false;
        paintAll();
        return;
      }
      box.innerHTML = STEPS.map(function (t, j) {
        return '<div class="rs' + (j < i ? ' done' : (j === i ? ' now' : '')) + '">' +
          '<span>' + (j < i ? '✓' : (j === i ? '●' : '·')) + '</span>' + UI.esc(t) + '</div>';
      }).join('');
      i += 1;
      window.setTimeout(tick, 750);      // 4단계 × 750ms 로 3초
    })();
  }

  // ------------------------------------------------------------ 히트맵
  /* 핵심예비품의 과부족을 한 판에 깐다.
   *
   * 상자 넓이 = 과부족 금액 · 색 = 방향(초과 빨강 · 부족 파랑) · 농도 = 목표 대비 배수.
   * 배치는 squarified treemap(Bruls et al.) 이다 · 값 합을 반으로 가르는 방식은
   * 얇고 긴 상자를 만들어서 이름이 들어가지 않았다. 이 방식은 상자를 정사각형에
   * 가깝게 만들어 글자가 들어간다 */
  function paintHeat() {
    var box = el('heat');
    if (stage !== 'done') { box.hidden = true; return; }
    /* 상자 수를 판 너비에 맞춘다. 폰에서는 여덟 개만 깔아야 이름이 들어간다.
     * 폭은 카드를 보인 뒤에 재야 한다 · 숨은 요소의 clientWidth 는 0 이다 */
    box.hidden = false;
    var wide = box.clientWidth || 1000;
    /* 좁을수록 상자를 줄이고 눈금을 더 누른다. 폰에서 스무 개를 깔면 이름이 안 들어간다 */
    var h = wide < 620 ? S.stockHeat(6, 0.5)
      : (wide < 1000 ? S.stockHeat(14, 0.6) : S.stockHeat(20, 0.7));

    var rects = h.boxes.length ? squarify(h.boxes, 0, 0, 100, 100) : [];
    var cells = rects.map(function (t) {
      var b = t.d;
      var sign = b.dir === 'over' ? '+' : '−';
      /* 글자를 얼마나 넣을지는 그린 뒤 실제 픽셀로 정한다 (fitCells).
       * %로 정하면 폰(판 너비 293px)에서 1% 가 3px 라 글자가 잘린다 */
      return '<button class="tm ' + b.dir + ' l' + b.lvl + '" type="button" ' +
        'data-q="' + UI.esc(b.q) + '" data-dept="' + UI.esc(b.dept) + '" ' +
        'style="left:' + t.x.toFixed(4) + '%;top:' + t.y.toFixed(4) + '%;width:' +
          t.w.toFixed(4) + '%;height:' + t.h.toFixed(4) + '%" ' +
        'title="' + UI.esc(b.name + ' · ' + b.q + ' · ' + b.grade + '등급 · 보유 ' +
          b.stock + ' 목표 ' + b.target + ' · ' +
          (b.dir === 'over' ? '초과 ' : '부족 ') + Math.abs(b.gap) + '개 · ' +
          UI.won(b.amt)) + '">' +
        '<span class="tm-in">' +
          '<span class="tm-n">' + UI.esc(b.name) + '</span>' +
          '<span class="tm-v">' + sign + Math.abs(b.gap) + '<small>개</small></span>' +
          '<span class="tm-a">' + UI.esc(UI.wonShort(b.amt)) +
            UI.esc(UI.wonShortUnit(b.amt)) + '</span>' +
        '</span></button>';
    }).join('');

    box.innerHTML =
      '<div class="heat-head">' +
        '<div class="hh-t">' +
          '<h2>적정재고 과부족</h2>' +
          '<p class="sub">핵심예비품 ' + UI.num(h.csp) + '품목 중 과부족 금액이 큰 ' +
            UI.num(h.boxes.length) + '품목 · 상자가 클수록 금액이 큽니다</p>' +
        '</div>' +
        '<div class="hh-r">' +
          '<div class="hh-num"><b class="short">' + UI.num(h.shortN) + '</b>' +
            '<span>부족 ' + UI.esc(UI.won(h.shortAmt)) + '</span></div>' +
          '<div class="hh-num"><b class="over">' + UI.num(h.overN) + '</b>' +
            '<span>초과 ' + UI.esc(UI.won(h.overAmt)) + '</span></div>' +
          '<button class="btn line sm" type="button" id="reana">다시 분석</button>' +
        '</div>' +
      '</div>' +
      (cells
        ? '<div class="tmap">' + cells + '</div>' +
          '<div class="heat-foot">' +
            '<span class="hf-l">부족</span>' +
            '<i class="sw short l4"></i><i class="sw short l3"></i>' +
            '<i class="sw short l2"></i><i class="sw short l1"></i>' +
            '<span class="hf-m">목표와 같음</span>' +
            '<i class="sw over l1"></i><i class="sw over l2"></i>' +
            '<i class="sw over l3"></i><i class="sw over l4"></i>' +
            '<span class="hf-l">초과</span>' +
            '<span class="hf-x">넓이 눈금 금액^' + h.pow + ' · 목표와 같은 ' + UI.num(h.fine) +
              '품목 제외 · 분석 ' + UI.esc(S.stockStamp() || '시각 미기록') +
              (h.staleN ? ' · 확정 속성 반영 ' + UI.num(h.staleN) + '품목' : '') + '</span>' +
          '</div>'
        : '<div class="empty"><strong>핵심예비품이 모두 목표재고와 같습니다</strong>' +
          '손댈 것이 없습니다</div>');

    fitCells();
  }

  /* 상자마다 실제 크기를 재서 글자를 얼마나 넣을지 정한다.
   * 자리가 없는데 넣으면 잘려서 더 지저분하다 · 화면 폭이 바뀌면 다시 잰다 */
  function fitCells() {
    var cells = document.querySelectorAll('#heat .tm');
    var i, c, r, tier;
    for (i = 0; i < cells.length; i += 1) {
      c = cells[i];
      r = c.getBoundingClientRect();
      tier = (r.width >= 150 && r.height >= 92) ? 'lg'
        : ((r.width >= 96 && r.height >= 64) ? 'md'
          : ((r.width >= 54 && r.height >= 40) ? 'sm' : 'xs'));
      c.classList.remove('lg', 'md', 'sm', 'xs');
      c.classList.add(tier);
    }
  }

  /* squarified treemap · 상자를 정사각형에 가깝게 채운다.
   * 짧은 변을 따라 줄을 만들고, 줄에 상자를 더할수록 비율이 나빠지면 그 줄을 닫는다 */
  function squarify(items, x, y, w, h) {
    var out = [];
    var rest = items.slice();
    while (rest.length) {
      if (w <= 0.001 || h <= 0.001) { break; }
      var total = sum(rest);
      if (total <= 0) { break; }
      var row = [], best = Infinity, i;
      for (i = 0; i < rest.length; i += 1) {
        var cand = row.concat([rest[i]]);
        var a = worstAspect(cand, total, w, h);
        if (a > best) { break; }
        best = a; row = cand;
      }
      var rowSum = sum(row);
      var frac = rowSum / total;
      if (w <= h) {
        var rh = h * frac, cx = x;
        row.forEach(function (d) {
          var cw = w * (d.value / rowSum);
          out.push({ d: d, x: cx, y: y, w: cw, h: rh });
          cx += cw;
        });
        y += rh; h -= rh;
      } else {
        var rw = w * frac, cy = y;
        row.forEach(function (d) {
          var ch = h * (d.value / rowSum);
          out.push({ d: d, x: x, y: cy, w: rw, h: ch });
          cy += ch;
        });
        x += rw; w -= rw;
      }
      rest = rest.slice(row.length);
    }
    return out;
  }

  function sum(a) { return a.reduce(function (t, d) { return t + d.value; }, 0); }

  /* 이 줄에 넣었을 때 가장 못난 상자의 가로세로 비 · 1 에 가까울수록 정사각형이다 */
  function worstAspect(row, total, w, h) {
    var rowSum = sum(row);
    if (rowSum <= 0) { return Infinity; }
    var along = w <= h ? w : h;              // 줄이 뻗는 길이
    var band = (w <= h ? h : w) * (rowSum / total);   // 줄의 두께
    if (band <= 0) { return Infinity; }
    var worst = 0;
    row.forEach(function (d) {
      var seg = along * (d.value / rowSum);
      if (seg <= 0) { worst = Infinity; return; }
      var ar = Math.max(seg / band, band / seg);
      if (ar > worst) { worst = ar; }
    });
    return worst;
  }

  // ------------------------------------------------------------ 단계
  function paintSteps() {
    el('steps').hidden = stage !== 'done';
    if (stage !== 'done') { el('steps').innerHTML = ''; return; }
    var steps = S.stockSteps();
    el('steps').innerHTML = steps.map(function (st) {
      return '<section class="sect' + (st.open ? ' open' : '') + '" id="s-' + st.n + '">' +
        '<div class="sect-head" role="button" tabindex="0" aria-expanded="' +
          (st.open ? 'true' : 'false') + '">' +
          '<div class="sect-title" style="display:flex;align-items:center;gap:12px">' +
            '<span class="stepno">' + st.n + '</span>' +
            '<h2>' + UI.esc(st.title) + '</h2>' +
          '</div>' +
          '<div class="card-tools">' +
            '<span class="sect-n">' + UI.esc(st.right) + '</span>' +
            '<span class="sect-arrow">' + (st.open ? '∧' : '∨') + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="sb">' + body(st) + '</div>' +
        '</section>';
    }).join('');
    paintTable();
  }

  function body(st) {
    if (st.kind === 'table') { return tableBody(st); }
    if (st.kind === 'pool') { return poolBody(st); }
    if (st.kind === 'fin') { return finBody(st); }
    return '';
  }

  /* 3 · 조치 판정 · 목록이 들어간다 */
  function tableBody(st) {
    return '<div class="phead" style="margin-bottom:12px">' +
        '<div class="tabs" id="stabs"></div>' +
        '<div class="ptools">' +
          '<input class="input" id="sq" type="search" placeholder="자재명 · 자재코드 검색" ' +
            'style="width:230px;padding:8px 12px;min-height:0" value="' + UI.esc(query) + '">' +
        '</div>' +
      '</div>' +
      '<div class="tablewrap" id="stable"></div>' +
      '<div class="pagerow"><span id="sinfo">&nbsp;</span>' +
        '<span class="pg"><button class="btn line sm" type="button" id="sprev">이전</button>' +
        '<button class="btn line sm" type="button" id="snext">다음</button></span></div>';

  }

  function paintTable() {
    if (!el('stable')) { return; }
    var c = S.stockCounts();
    el('stabs').innerHTML = S.STOCK_TABS.map(function (t) {
      return '<button class="tab' + (t.key === tab ? ' on' : '') + '" type="button" ' +
        'data-stab="' + t.key + '">' + UI.esc(t.label) + ' ' + UI.num(c[t.key]) + '</button>';
    }).join('');

    var rows = S.stockList(tab, query);
    var max = Math.max(0, Math.ceil(rows.length / PAGE) - 1);
    if (page > max) { page = max; }
    var view = rows.slice(page * PAGE, page * PAGE + PAGE);

    el('stable').innerHTML = view.length ?
      '<table><thead><tr><th>자재 · 코드</th><th>속성 · 등급</th>' +
      '<th class="num">보유 → 목표</th><th>조치</th><th>작업</th></tr></thead><tbody>' +
      view.map(function (r) {
        var move = Math.max(0, Number(r.stockAll) - Number(r.stock));
        return '<tr>' +
          '<td data-label="자재 · 코드"><div class="cell-2">' +
            '<div class="cell-1st">' + UI.esc(r.name || '품명 미확인') + '</div>' +
            '<div class="cell-2nd">' + UI.esc(r.q) +
              (r.eq ? ' · ' + UI.esc(r.eq) : '') +
              (r.csp ? ' · 핵심예비품' : '') + '</div>' +
          '</div></td>' +
          '<td data-label="속성 · 등급">' + UI.typeBadge(r.type) + ' ' +
            UI.gradeBadge(r.grade) +
            /* 확정 속성이 계산에 쓴 속성과 다르면 표시한다 · 목표가 다른 공식이어야 한다 */
            /* 확정 속성으로 목표를 다시 잡은 행 · 그 사실을 줄에 남긴다 */
            (r.stale ? ' <span class="badge plan">확정 반영</span>' : '') +
            '</td>' +
          '<td class="num" data-label="보유 → 목표"><span>' +
            '<button class="linkq" type="button" data-q="' + UI.esc(r.q) + '">' +
              UI.num(r.stock) + '</button>' +
            '<span class="arrow">→</span>' + targetCell(r) + '</span></td>' +
          '<td data-label="조치">' + actionBadge(r) + '</td>' +
          '<td data-label="작업">' + work(r, move) + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table>' :
      '<div class="empty"><strong>' + (query ? '찾는 자재가 없습니다' : '이 칸에는 자재가 없습니다') +
      '</strong>' + (query ? '코드 앞 두 자리만 넣어 보거나 품명으로 찾으세요'
        : '다른 칸을 눌러 보세요') + '</div>';

    el('sinfo').textContent = rows.length
      ? ('표시 ' + view.length + '건 · 전체 ' + UI.num(rows.length) + '건 · ' +
         (page + 1) + ' / ' + (max + 1))
      : '표시할 자재가 없습니다';
    el('sprev').disabled = page <= 0;
    el('snext').disabled = page >= max;
  }

  /* 목표 칸 · 속성이 바뀐 행은 옛 목표를 지우고 지금 목표를 적는다. 엔진이 다시 낼 것은 기다린다고 적는다 */
  function targetCell(r) {
    if (!r.stale) { return UI.num(r.target); }
    if (r.recalc && r.recalc.done) {
      return '<s style="color:var(--muted)">' + UI.num(r.target) + '</s> ' + UI.num(r.targetNow);
    }
    return '<span class="sub">' + UI.num(r.target) + ' · 대기</span>';
  }

  /* 보유목적 판단과 이어진 줄.
   * 단계(raw · algo)는 그 화면 안의 것이라 여기서 보지 않는다.
   * 이 화면이 알아야 하는 것은 「사람이 확정한 것이 있나 · 그게 목표를 바꾸나」 뿐이다 */
  function paintStageBar() {
    var bar = el('stagebar');
    var s = DB.summary();
    var cm = DB.commitInfo();
    /* 확정 대기가 있으면 그 사실만 적는다. 이 화면은 확정된 것만 쓴다 */
    if (cm.waiting) {
      bar.hidden = false;
      bar.innerHTML = '<span class="ni">△</span><span><b>보유목적 판단에 확정 대기 ' +
        UI.num(cm.waiting) + '품목</b>이 있습니다 · ' +
        '이 화면은 <b>확정된 속성만</b> 씁니다. 담당자가 확정하면 그 속성으로 다시 계산합니다</span>' +
        '<a class="nx" href="attr.html#done" style="color:var(--brand)">확정하러 가기 →</a>';
      return;
    }
    if (!cm.done) {
      bar.hidden = false;
      bar.innerHTML = '<span class="ni">◇</span><span><b>담당자가 확정한 속성이 아직 없습니다</b> · ' +
        '이 목표재고는 알고리즘 판정 속성으로 계산된 값입니다. 보유목적 판단에서 확정하면 ' +
        '그 속성으로 다시 봅니다</span>' +
        '<a class="nx" href="attr.html" style="color:var(--brand)">보유목적 판단으로 →</a>';
      return;
    }
    if (s.staleN) {
      bar.hidden = false;
      bar.innerHTML = '<span class="ni">↻</span><span><b>확정 속성이 반영된 ' +
        UI.num(s.staleN) + '품목</b> · 목표재고 · 조치 · 금액이 그 속성으로 계산돼 있습니다' +
        (s.recalcN ? ' (' + UI.num(s.recalcN) + '품목은 구운 목표가 없어 대기)' : '') + '</span>' +
        '<a class="nx" href="attr.html#done" style="color:var(--brand)">확정 내역 →</a>';
      return;
    }
    bar.hidden = true;
  }

  function actionBadge(r) {
    if (r.actionNow === '발주') {
      return '<span class="badge core">발주 ' + UI.num(r.needNow) + '</span>';
    }
    if (r.actionNow === '감축') {
      return '<span class="badge ok">감축 ' + UI.num(Math.max(0, r.stock - r.targetNow)) + '</span>';
    }
    return '<span class="badge">유지</span>';
  }

  /* 작업은 3층에 쌓는다. 정본과 판정은 그대로 남는다 */
  function work(r, move) {
    if (r.actionNow === '발주') {
      return '<button class="btn sm" type="button" data-draft="' + UI.esc(r.q) + '">' +
        'PR 초안</button>' +
        (move > 0 ? ' <span class="badge plan">이관 ' + UI.num(move) + '</span>' : '');
    }
    if (r.actionNow === '감축') {
      return '<button class="btn soft sm" type="button" data-pool="' + UI.esc(r.q) + '">' +
        '공용 전환</button>';
    }
    return '<span class="sub">적정 운용중</span>';
  }

  /* 4 · 공용화 후보 · 회수액을 두 값으로 나눈다.
   * review 는 핵심이고 보험품이라 공용화 대상이 아니다. 전부 더하면 회수액이 부풀려진다 */
  function poolBody(st) {
    return '<div class="dashrow c2" style="margin-bottom:0">' +
      '<div class="fbox">' +
        '<div class="kpistrip-in" style="grid-template-columns:1fr 1fr">' +
          box('ok', '', '회수 가능', UI.wonShort(st.amt), UI.wonShortUnit(st.amt),
              '즉시공용화 · 공용화권장', UI.num(st.items - st.hold) + '품목') +
          box('core', '', '보류', UI.num(st.hold), '품목',
              UI.won(st.holdAmt) + ' · 재분류 검토', '핵심 · 보험품') +
        '</div>' +
      '</div>' +
      '<div class="fbox">' +
        '<div class="formula"><div class="ft"><span>정체 판정</span></div>' +
          '<code>' + UI.esc(st.stale) + '</code>' +
          '<div class="ft" style="margin:8px 0 5px"><span>공용화 규칙</span></div>' +
          st.pool.map(function (x) { return '<code>' + UI.esc(x) + '</code>'; }).join('<br>') +
        '</div>' +
        /* 전환은 재고를 움직이는 일이라 화면을 따로 뒀다 */
        '<p style="margin-top:12px"><a class="btn line sm" href="pool.html">' +
          '공용 전환 화면에서 처리 →</a></p>' +
      '</div></div>';
  }

  /* 5 · 금융비용 · 상수를 화면이 만들지 않는다. 명세 문장에서 읽은 값이다 */
  function finBody(st) {
    return '<div class="fin-pill" style="margin-top:0">' +
        '<span class="fic">₩</span>' +
        '<span><b>연 ' + UI.won(st.finance) + '</b>' +
        '감축 ' + UI.won(st.cutAmt) + ' + 공용화 회수 ' + UI.won(st.poolAmt) +
        ' 기준 (부서 모집단)</span></div>' +
      '<div class="formula"><div class="ft"><span>절감액 산식</span>' +
        '<span>명세에서 읽은 상수</span></div>' +
        '<code>' + UI.esc(st.text) + '</code><br>' +
        '<code>(' + UI.num(st.cutAmt) + ' + ' + UI.num(st.poolAmt) + ') × ' +
        st.rate + ' × ' + st.interest + ' = ' + UI.num(st.finance) + '원</code></div>';
  }

  // ------------------------------------------------------------ 이벤트
  function wire() {
    UI.accordion(document);

    /* 분석 실행 · 한 번만 배선한다. 카드 안을 다시 그려도 살아 있게 카드에 건다 */
    el('anahero').addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('#ana')) { runAnalysis(); }
    });

    /* 히트맵 상자 · 한 품목의 계산을 그대로 펼친다. 표의 보유 수량과 같은 분해다 */
    el('heat').addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('#reana')) {
        /* 다시 분석 · 확정이 바뀐 뒤 눌러 새 속성으로 계산한다 */
        S.setStockStage('raw'); stage = 'raw'; paintAll();
        window.scrollTo({ top: 0 });
        return;
      }
      var c = e.target.closest && e.target.closest('.tm');
      if (!c || !c.getAttribute('data-q')) { return; }
      var r = DB.item(c.getAttribute('data-q'), c.getAttribute('data-dept'));
      if (!r) { return; }
      POP.show(c, {
        title: r.name + ' · ' + r.q,
        rows: S.stockBreak(r),
        formula: r.reasonNow || r.reason || '',
        note: '조달 ' + (r.proc || '미확인') + ' · 리드타임 평균 ' + UI.num(r.ltMean) +
              '일 · 공급사 ' + UI.num(r.suppliers) + '곳'
      });
    });

    el('steps').addEventListener('click', function (e) {
      var t = e.target;
      var stab = t.closest && t.closest('[data-stab]');
      if (stab) { tab = stab.getAttribute('data-stab'); page = 0; paintTable(); return; }
      if (t.closest && t.closest('#sprev')) { page -= 1; paintTable(); return; }
      if (t.closest && t.closest('#snext')) { page += 1; paintTable(); return; }

      /* 보유 수량을 누르면 그 값이 어떻게 나왔는지 그대로 보여 준다 */
      var lq = t.closest && t.closest('.linkq');
      if (lq) {
        var r = DB.item(lq.getAttribute('data-q'));
        if (!r) { return; }
        POP.show(lq, {
          title: r.name + ' · ' + r.q,
          rows: S.stockBreak(r),
          formula: r.reasonNow || r.reason || '',
          note: '조달 ' + (r.proc || '미확인') + ' · 리드타임 평균 ' + UI.num(r.ltMean) +
                '일 · 공급사 ' + UI.num(r.suppliers) + '곳'
        });
        return;
      }

      /* 초안 · 공용 전환은 3층에 쌓는다. 정본은 손대지 않는다.
       * 초안을 만든 다음 실제로 신청하는 곳은 구매신청 화면이라 거기까지 데려간다 */
      var dq = t.closest && t.closest('[data-draft]');
      if (dq) {
        var q = dq.getAttribute('data-draft');
        var m = DB.item(q);
        if (!m) { return; }
        UI.confirm({
          title: '구매신청 페이지로 넘어가시겠습니까?',
          body: '<b>' + UI.esc(m.name) + '</b> · ' + UI.esc(q),
          rows: [['신청 수량', UI.num(m.needNow) + ' (목표 ' + UI.num(m.targetNow) +
                    ' − 보유 ' + UI.num(m.stock) + ')'],
                 ['금액', UI.won((Number(m.price) || 0) * (Number(m.needNow) || 0))],
                 ['리드타임 평균', UI.num(m.ltMean) + '일'],
                 ['하는 일', '초안을 만들고 구매신청 화면을 엽니다']],
          note: '초안은 3층에 쌓입니다. 정본과 판정값은 그대로입니다.',
          ok: '초안 만들고 이동',
          cancel: '여기 머무르기',
          onOk: function () {
            try {
              DB.draft('PR', { q: q, data: { qty: m.needNow, why: '적정재고 분석 · 발주 필요' } });
              window.location.href = 'purchase.html#q=' + encodeURIComponent(q);
            } catch (err) {
              POP.show(dq, { title: '초안을 만들지 못했습니다',
                rows: [['이유', String(err.message)]] });
            }
          }
        });
        return;
      }

      var pq = t.closest && t.closest('[data-pool]');
      if (pq) {
        var q2 = pq.getAttribute('data-pool');
        var m2 = DB.item(q2);
        try {
          DB.pool({ q: q2, action: '공용전환', note: '적정재고 분석 · 감축 대상' });
          POP.show(pq, {
            title: '공용 전환으로 표시했습니다',
            rows: [['자재', m2.name + ' · ' + q2],
                   ['넘치는 수량', UI.num(Math.max(0, m2.stock - m2.target))],
                   ['회수 금액', UI.won(Math.max(0, m2.stock - m2.target) * m2.price)]],
            note: '재고를 바꾸지 않습니다. 공용 전환 의사만 3층에 기록합니다.'
          });
        } catch (err) {
          POP.show(pq, { title: '기록하지 못했습니다', rows: [['이유', String(err.message)]] });
        }
      }
    });

    /* 검색은 입력할 때마다 다시 센다. 743행이라 눌러도 바로 나온다 */
    el('steps').addEventListener('input', function (e) {
      if (e.target.id !== 'sq') { return; }
      query = e.target.value;
      page = 0;
      var pos = e.target.selectionStart;
      paintTable();
      var again = el('sq');
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    });
  }

  function paintAll() {
    var m = window.DB ? DB.meta() : null;
    el('asof').textContent = m && m.asof ? ('기준일 ' + UI.date(m.asof)) : '기준일 확인 중';
    paintStat();
    paintStageBar();
    paintHero();
    paintHeat();
    paintSteps();
  }

  paintAll();
  wire();

  /* 창 폭이 바뀌면 상자 크기도 바뀐다. 글자 양을 다시 정한다 */
  var fitTimer = null;
  window.addEventListener('resize', function () {
    if (fitTimer) { window.clearTimeout(fitTimer); }
    /* 폭이 바뀌면 상자 수와 글자 양이 둘 다 달라진다. 히트맵을 다시 그린다 */
    fitTimer = window.setTimeout(paintHeat, 140);
  });
  S.on(function () { paintStat(); paintStageBar(); paintHeat(); paintTable(); });

  /* 주소에 #cut 이 붙어 오면 감축 칸부터 본다.
   * 조치 판정 단계는 기본으로 열려 있어서 따로 펼칠 것이 없다 ·
   * 단계로 스크롤만 맞춘다 (대시보드의 「적정재고 분석 열기」 가 이 주소로 온다) */
  if (stage === 'done' && (location.hash || '').indexOf('cut') >= 0) {
    tab = 'cut';
    paintTable();
  }
  var jump = el('s-3');
  if (stage === 'done' && jump && jump.scrollIntoView && (location.hash || '')) {
    jump.scrollIntoView({ block: 'start' });
  }
})();
</script>

<script src="assets/catalog.js"></script>
