<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보유목적 판단 · AI 자재 솔루션</title>
<link rel="stylesheet" href="assets/shell.css">
<script>window.PAGE = 'attr';</script>
</head>
<body>

<div class="layout">
  <aside class="side" id="side"></aside>

  <main class="main">
    <div class="top">
      <div class="top-left">
        <button class="hamb" id="hamb" aria-label="메뉴" aria-expanded="false">&#9776;</button>
        <div>
          <div class="crumb" data-group="분석">&nbsp;</div>
          <div class="phead" style="margin-bottom:0">
            <h1>보유목적 판단</h1>
            <span class="badge" id="progress">&nbsp;</span>
          </div>
        </div>
      </div>
      <div class="top-right">
        <span class="pill" id="asof">기준일 확인 중</span>
        <div class="avatar">이</div>
      </div>
    </div>

    <!-- 언제 돌린 판단인가. 기준일(스냅샷)과 다른 값이라 제목 밑에 따로 적는다 -->
    <div class="stampbar" id="stamp" hidden></div>

    <!-- 네 단계. 원본 → 알고리즘 실행 → 사람 확정 → 적정재고. 지금 어디인지 늘 보인다 -->
    <div class="stageline" id="stageline"></div>

    <!-- 단계 0 · 원본만 있을 때 여기서 실행한다 -->
    <section class="card runhero" id="runhero" hidden></section>

    <div class="phead" id="filters">
      <div class="tabs" id="tabs"></div>
      <div class="ptools">
        <div class="seg" id="sort">
          <button type="button" data-sort="amt" class="on">재고금액 순</button>
          <button type="button" data-sort="gap">점수차 순</button>
        </div>
        <!-- 판단과 확정은 다른 일이다. 확정을 눌러야 다른 화면이 그 속성을 쓴다 -->
        <button class="btn" type="button" id="commit" hidden>담당자 확정</button>
        <button class="btn line sm" type="button" id="export" hidden>확정 내보내기</button>
        <button class="btn line sm" type="button" id="clear" hidden>초기화</button>
      </div>
    </div>

    <!-- 원본 단계에서 칸을 누르기 전에는 이 아래가 접혀 있다 -->
    <p class="foldhint" id="foldhint" hidden>
      위 칸(<b>전체 · 보험품 · 계획품</b>)을 누르면 그 칸의 자재 목록이 열립니다
    </p>

    <div class="split" id="split">
      <div>
        <div class="noticebar" id="notice"></div>
        <!-- 여러 건을 한 번에 판단한다. 회색지대 31품목을 하나씩 누르면 손이 너무 많이 간다 -->
        <div class="bulkbar" id="bulk" hidden></div>
        <div class="picklist" id="list"></div>
        <div class="pagerow">
          <span id="pinfo">&nbsp;</span>
          <span class="pg">
            <button class="btn line sm" type="button" id="prev">이전</button>
            <button class="btn line sm" type="button" id="next">다음</button>
          </span>
        </div>
        <p class="note" id="lnote" style="margin-top:12px">&nbsp;</p>
      </div>

      <section class="card sticky" id="panel"></section>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>

<script src="assets/config.js"></script>
<!-- .env 에서 내려온 연결값 (토큰) · serve.py 가 만든다 · 없으면 그냥 넘어간다 -->
<script src="assets/config.local.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/org.js"></script>
<script src="assets/popover.js"></script>
<script src="assets/db-master.js"></script>
<script src="assets/db-derived.js"></script>
<script src="assets/db-changes.js"></script>
<script src="assets/db.js"></script>
<script src="assets/db-biz.js"></script>
<script src="assets/plan-data.js"></script>
<script src="assets/analysis-data.js"></script>
<script src="assets/screen-data.js"></script>
<script src="assets/nav.js"></script>
<script>
(function () {
  'use strict';

  var S = window.SCREEN;
  var PAGE = 12;
  var stage = S.stage();          // 'raw' · 원본만 | 'algo' · 알고리즘 결과가 올라와 있다
  /* 원본 단계에서는 아무 칸도 눌려 있지 않다(null) · 눌러야 목록이 열린다.
   * algo 단계는 「전체」 부터 본다 */
  var tab = stage === 'algo' ? 'all' : null;
  var sort = 'amt';
  var page = 0;
  var picked = null;
  /* 원본 단계에서만 쓰는 두 개 · 목록과 오른쪽 카드를 펼쳤나.
   * algo 단계에서는 늘 펼쳐 둔다 (판단이 그 화면의 일이다) */
  var openList = false;
  var openPanel = false;
  var listRows = [];
  var running = false;
  var sel = {};             // 체크한 자재 · key 집합

  /* 처음 들어오면 원본이다. 한 번 실행하면 그 상태가 남는다 ·
   * 다른 화면에 갔다 돌아와도 2단계(알고리즘 결과)에서 이어 본다.
   * 원본으로 되돌리는 것은 단계 줄의 「원본 속성」 을 누르는 것뿐이다 (시연 초기화도 지운다) */
  var hash = (location.hash || '').replace('#', '');
  if (stage === 'algo' && ['all', 'i2p', 'p2i', 'gray', 'done'].indexOf(hash) >= 0) { tab = hash; }

  /* 원본 단계의 칸 · 속성은 정본 Type 두 가지뿐이다 */
  var RAW_TABS = [
    { key: 'all', label: '전체' },
    { key: 'ins', label: '보험품' },
    { key: 'pln', label: '계획품' }
  ];

  function el(id) { return document.getElementById(id); }

  /* 지금 무엇을 펼칠지 한 곳에서 정한다 · 화면 두 군데에서 hidden 을 만지면 어긋난다 */
  function applyFold() {
    var raw = stage === 'raw';
    var listOn = !raw || openList;
    var panelOn = !raw || openPanel;
    el('split').hidden = !listOn;
    el('split').classList.toggle('nopanel', !panelOn);
    el('panel').hidden = !panelOn;
    el('foldhint').hidden = listOn;
  }
  function byAmt(a, b) { return (b.stock * b.price) - (a.stock * a.price); }

  // ------------------------------------------------------------ 단계 표시
  /* 네 칸이 각각 누를 수 있는 버튼이다.
   * 1 원본 보기 · 2 실행 · 3 확정 대기 목록 · 4 적정재고 분석으로 이동.
   * 마지막 칸은 확정한 뒤에만 열린다 · 확정 전에는 다른 화면이 이 판단을 쓰지 않기 때문이다 */
  function paintStage() {
    var c = S.attrCounts();
    var cm = DB.commitInfo();
    var steps = [
      { k: '1', t: '원본 속성', act: 'raw',
        s: '정본 743품목 · 보험품 ' + UI.num(c.insBase) + ' · 계획품 ' + UI.num(c.plnBase),
        state: 'done' },
      { k: '2', t: '알고리즘 실행', act: 'run',
        /* 743 중 판정 근거에서 빠지는 것(사전 배제 · 판정일치)을 같이 적는다.
         * 이걸 안 적으면 「743 이 왜 270 이 됐나」 가 화면에서 사라진다 */
        s: stage === 'algo'
          ? '변경 제안 ' + UI.num(c.i2p + c.p2i) + ' · 보류 ' + UI.num(c.gray + c.done)
          : '눌러서 실행하세요',
        x: stage === 'algo'
          ? '<span class="excl">제외대상 ' + UI.num(c.excluded) + '</span>' : '',
        state: stage === 'algo' ? 'done' : 'doing' },
      { k: '3', t: '담당자 확정', act: 'judge',
        s: stage !== 'algo' ? '실행 뒤에 할 수 있습니다'
          : (c.waiting ? '판단 ' + UI.num(c.done) + ' · 확정 대기 ' + UI.num(c.waiting)
             : (cm.done ? '확정 ' + UI.num(cm.done) + '품목 · ' + UI.esc(cm.at)
                : '판단한 자재가 없습니다')),
        state: stage !== 'algo' ? 'wait' : (c.waiting ? 'doing' : (cm.done ? 'done' : 'wait')) },
      { k: '4', t: '적정재고 분석', act: 'stock',
        s: cm.done ? '확정 ' + UI.num(cm.done) + '품목으로 계산합니다'
          : '확정하면 이 판단으로 계산합니다',
        state: cm.done && !c.waiting ? 'done' : 'wait' }
    ];
    el('stageline').innerHTML = steps.map(function (s) {
      return '<button class="prstep ' + s.state + '" type="button" data-act="' + s.act + '">' +
        '<span class="sc">' + (s.state === 'done' ? '✓' : s.k) + '</span>' +
        '<span class="sk">' + UI.esc(s.t) + '</span>' +
        '<span class="sv">' + UI.esc(s.s) + (s.x ? ' · ' + s.x : '') + '</span></button>';
    }).join('');

    el('progress').className = 'badge ' + (stage === 'algo' ? 'ok' : '');
    el('progress').textContent = stage === 'algo'
      ? (c.done ? '승인 ' + UI.num(c.done) + '건 · 검토 ' + UI.num(c.gray + c.done) + ' → ' + UI.num(c.gray) + '품목'
                : '검토 대기 ' + UI.num(c.gray) + '품목')
      : '원본 속성 · 알고리즘 실행 전';
    el('export').hidden = stage !== 'algo' || !cm.done;
    el('clear').hidden = stage !== 'algo';
    el('sort').hidden = stage !== 'algo';        // 점수차는 실행 뒤에 생긴다

    /* 확정 버튼 · 판단이 하나라도 있으면 언제든 누를 수 있다.
     * 아무 판단도 하지 않은 처음 상태에서만 비활성이다 (누를 것이 없다).
     * 칸(전체 · 회색지대 …)과는 상관없다 · 확정은 목록이 아니라 판단 전체에 대한 일이다 */
    var cb = el('commit');
    cb.hidden = stage !== 'algo';
    cb.disabled = !c.done;
    cb.className = 'btn' + (c.waiting ? '' : ' line');
    cb.textContent = c.waiting
      ? ('담당자 확정 · ' + UI.num(c.waiting) + '건')
      : (c.done ? '확정 완료 · ' + UI.num(cm.done) + '건' : '판단한 자재가 없습니다');
    paintStamp(c);
  }

  /* 판단을 언제 돌렸는지. 실행하지 않았으면 줄 자체를 두지 않는다 */
  function paintStamp(c) {
    var bar = el('stamp');
    if (stage !== 'algo') { bar.hidden = true; return; }
    var at = S.stamp();
    bar.hidden = false;
    var cm = DB.commitInfo();
    bar.innerHTML = '<span class="st-k">보유목적 판단 실행</span>' +
      '<b class="st-v">' + UI.esc(at || '시각을 기록하지 못했습니다') + '</b>' +
      '<span class="st-x">기준일 ' + UI.esc(UI.date(DB.meta().asof)) +
        ' 스냅샷 · 743품목 판정 · 제외 ' + UI.num(c.excluded) + '품목</span>' +
      (cm.at ? '<span class="st-k" style="margin-left:auto">담당자 확정</span>' +
        '<b class="st-v">' + UI.esc(cm.at) + '</b>' +
        '<span class="st-x">' + UI.num(cm.done) + '품목' +
        (cm.waiting ? ' · 대기 ' + UI.num(cm.waiting) : '') + '</span>' : '');
  }

  /* 실행 전 · 무엇을 실행하는지 정확히 적는다.
     알고리즘을 여기서 돌리는 게 아니라, feat/algo 엔진이 이 DB 로 낸 결과를 올리는 것이다 */
  function paintHero() {
    var h = el('runhero');
    if (stage === 'algo') { h.hidden = true; return; }
    var c = S.attrCounts();
    h.hidden = false;
    h.innerHTML =
      '<div class="rh-left">' +
        '<h2>원본 속성 그대로입니다</h2>' +
        '<p class="sub">정본 743품목에 적힌 보험품 · 계획품. 어떤 알고리즘도 적용하지 않은 값입니다.</p>' +
        '<div class="rh-nums">' +
          '<div><b>' + UI.num(c.insBase) + '</b><span>보험품</span></div>' +
          '<div><b>' + UI.num(c.plnBase) + '</b><span>계획품</span></div>' +
        '</div>' +
        (c.done ? '<p class="note" style="margin-top:12px">담당자가 이미 확정한 ' +
          UI.num(c.done) + '품목이 있습니다 · 실행하면 확정 내용과 함께 보입니다</p>' : '') +
      '</div>' +
      '<div class="rh-right">' +
        /* 왼쪽 제목과 같은 크기 · 같은 높이에 둔다 · 「이건 지금 상태」 「이건 다음 할 일」 이
         * 한 줄에서 마주 봐야 무엇을 누르면 되는지 바로 읽힌다 */
        '<h2>AI의 도움을 받아볼까요?</h2>' +
        '<button class="btn" type="button" id="run" style="min-height:52px;padding:0 26px">' +
          '<span class="cbi">✦</span> 알고리즘 실행</button>' +
        '<p class="note" style="margin-top:10px">7요인 가중합으로 743품목의 속성을 다시 판정합니다 · ' +
          '점수 차이가 작은 것은 보류하고 담당자에게 넘깁니다</p>' +
        '<div class="runsteps" id="runsteps" hidden></div>' +
      '</div>';
  }

  // ------------------------------------------------------------ 목록
  function paintTabs() {
    var c = S.attrCounts();
    var tabs = stage === 'algo' ? S.ATTR_TABS : RAW_TABS;
    var n = stage === 'algo' ? c : { all: 743, ins: c.insBase, pln: c.plnBase };
    el('tabs').innerHTML = tabs.map(function (t) {
      return '<button class="tab' + (t.key === tab ? ' on' : '') + '" type="button" ' +
        'data-tab="' + t.key + '">' + UI.esc(t.label) + ' ' + UI.num(n[t.key]) + '</button>';
    }).join('');
  }

  function rowsNow() {
    if (stage === 'algo') { return S.attrList(tab, sort); }
    var all = DB.list();
    if (tab === 'ins') { all = all.filter(function (r) { return r.baseType === '보험품'; }); }
    if (tab === 'pln') { all = all.filter(function (r) { return r.baseType === '계획품'; }); }
    return all.sort(byAmt);
  }

  function paintList() {
    listRows = rowsNow();
    var total = listRows.length;
    var max = Math.max(0, Math.ceil(total / PAGE) - 1);
    if (page > max) { page = max; }
    var view = listRows.slice(page * PAGE, page * PAGE + PAGE);
    /* algo 단계는 첫 자재를 골라 둔다 · 오른쪽 카드가 비어 있으면 화면 절반이 빈다.
     * 원본 단계는 사람이 누른 것만 고른다 · 자동으로 고르면 접어 둔 카드가 저절로 열린다 */
    if (stage === 'algo' &&
        !view.filter(function (r) { return r.key === picked; }).length) {
      picked = view.length ? view[0].key : null;
    }

    el('list').innerHTML = view.length ? view.map(function (r) {
      var right = stage === 'algo'
        ? '<span class="pick-v">' + S.gap(r).toFixed(1) + '</span><span class="pick-k">점수차</span>'
        : '<span class="pick-v">' + UI.num(r.stock) + '</span><span class="pick-k">재고</span>';
      var b = stage === 'algo' ? S.attrBucket(r) : null;
      var col = stage === 'algo'
        ? ({ i2p: 'var(--brand)', p2i: 'var(--insur)', gray: 'var(--core)', done: 'var(--ok)' }[b] || 'var(--slate)')
        : (r.baseType === '보험품' ? 'var(--insur)' : 'var(--brand)');
      /* 속성 배지는 사람이 판단한 값이 있으면 그 값이다. 아직 확정 전이면 ◌ 로 적는다 ·
       * 배지를 여러 개 달면 목록이 배지 밭이 되어 이름이 안 읽힌다 */
      var mark = r.judged ? (r.committed ? '<i class="pm ok">✓</i>' : '<i class="pm wait">◌</i>') : '';
      return '<div class="pick' + (r.key === picked ? ' on' : '') +
        (sel[r.key] ? ' sel' : '') + '" data-key="' + UI.esc(r.key) + '">' +
        (stage === 'algo'
          ? '<label class="pick-chk"><input type="checkbox" data-chk="' + UI.esc(r.key) + '"' +
            (sel[r.key] ? ' checked' : '') + ' aria-label="선택"></label>'
          : '<span class="pick-dot" style="background:' + col + '"></span>') +
        '<button class="pick-body" type="button" data-open="' + UI.esc(r.key) + '">' +
          '<span class="pick-name">' + mark + UI.esc(r.name || '품명 미확인') + ' ' +
            UI.typeBadge(stage === 'algo' ? (r.judged || r.type) : r.baseType) +
          '</span>' +
          '<span class="pick-meta">' + UI.esc(r.q) + ' · ' + UI.esc(r.grade || '?') +
            '등급 · 재고 ' + UI.num(r.stock) + ' · ' + UI.won(r.stock * r.price) + '</span>' +
        '</button>' +
        '<span class="pick-right">' + right + '</span></div>';
    }).join('') :
      '<div class="empty"><strong>이 칸에는 자재가 없습니다</strong>다른 칸을 눌러 보세요</div>';

    paintBulk(view);

    el('pinfo').textContent = total
      ? ('표시 ' + UI.num(view.length) + '건 · 전체 ' + UI.num(total) + '건 · ' + (page + 1) + ' / ' + (max + 1))
      : '표시할 자재가 없습니다';
    el('prev').disabled = page <= 0;
    el('next').disabled = page >= max;

    var c = S.attrCounts();
    if (stage === 'raw') {
      el('notice').innerHTML = '<span class="ni">◇</span><span><b>정본에 적힌 속성</b>입니다 · ' +
        '보험품 ' + UI.num(c.insBase) + ' · 계획품 ' + UI.num(c.plnBase) +
        '</span><span class="nx">알고리즘 실행 전</span>';
      el('lnote').innerHTML = '위의 <b>알고리즘 실행</b>을 누르면 743품목을 다시 판정한 결과가 올라옵니다. ' +
        '그 전까지 이 화면은 원본 값만 보여 줍니다.';
      return;
    }
    var gaps = listRows.map(function (r) { return S.gap(r); });
    el('notice').innerHTML = gaps.length
      ? '<span class="ni">◇</span><span>' +
        (tab === 'gray' ? '<b>점수차가 작아 알고리즘이 보류한 자재</b>입니다 · 사람이 확정해야 라벨이 생깁니다'
          : (tab === 'done' ? '<b>담당자가 확정한 자재</b>입니다 · 확정 속성으로 적정재고를 봅니다'
            : '<b>알고리즘이 속성을 바꾸자고 본 자재</b>입니다 · 근거를 보고 확정하세요')) +
        '</span><span class="nx">점수차 ' + Math.min.apply(null, gaps).toFixed(1) + ' ~ ' +
        Math.max.apply(null, gaps).toFixed(1) + '점</span>'
      : '<span class="ni">◇</span><span>이 칸에는 자재가 없습니다</span>';
    el('lnote').innerHTML = '이 목록은 <b>손대야 하는 ' + UI.num(c.all) + '품목</b>입니다. ' +
      '정본 743품목에서 <span class="excl">제외대상 ' + UI.num(c.excluded) + '품목</span>' +
      '(사전 배제 ' + UI.num(c.out) + ' · 판정일치 ' + UI.num(c.same) + ')은 올리지 않습니다. ' +
      '점수차가 작은 것이 알고리즘이 가장 헷갈린 자재입니다.';
  }

  /* 여러 건 판단 줄 · 이 쪽에 보이는 것을 한 번에 고르고 한 번에 판단한다.
   * 판단은 3층에 쌓이고, 다른 화면이 쓰는 것은 「담당자 확정」 을 누른 뒤부터다 */
  function paintBulk(view) {
    var bar = el('bulk');
    if (stage !== 'algo') { bar.hidden = true; return; }
    /* 선택은 **이 칸 전체**다. 쪽(12건)만 고르면 회색지대 31건을 세 번 나눠 눌러야 한다 */
    var keys = listRows.map(function (r) { return r.key; });
    var on = keys.filter(function (k) { return sel[k]; }).length;
    var n = Object.keys(sel).filter(function (k) { return sel[k]; }).length;
    var label = (S.ATTR_TABS.filter(function (t) { return t.key === tab; })[0] || {}).label || '전체';
    bar.hidden = false;
    bar.innerHTML =
      '<label class="pick-chk"><input type="checkbox" id="chkall"' +
        (on && on === keys.length ? ' checked' : '') + ' aria-label="이 칸 전체 선택"></label>' +
      '<span class="bk">「' + UI.esc(label) + '」 ' + UI.num(keys.length) + '건 전체 선택' +
        (on ? ' · ' + UI.num(on) + '건 선택됨' : '') + '</span>' +
      (n ? '<span class="bn">선택 ' + UI.num(n) + '건</span>' +
        '<span class="bacts">' +
          '<button class="btn ins sm" type="button" data-bulk="보험품">보험품</button>' +
          '<button class="btn pln sm" type="button" data-bulk="계획품">계획품</button>' +
          '<button class="btn ghost sm" type="button" data-bulk="keep">현행유지</button>' +
          '<button class="btn ghost sm" type="button" data-bulk="revert">판단 취소</button>' +
          '<button class="btn line sm" type="button" data-bulk="clear">선택 해제</button>' +
        '</span>'
        : '<span class="bn sub">체크하면 여러 건을 한 번에 판단합니다</span>');
  }

  // ------------------------------------------------------------ 근거 패널
  function paintPanel() {
    var r = picked && window.DB ? DB.item(picked.split('|')[0], picked.split('|')[1]) : null;
    if (!r) {
      el('panel').innerHTML = '<div class="empty"><strong>왼쪽에서 자재를 고르세요</strong></div>';
      return;
    }
    if (stage === 'raw') { el('panel').innerHTML = rawPanel(r); return; }
    el('panel').innerHTML = algoPanel(r);
  }

  /* 원본 단계 · 정본 사실만. 점수 · 판정 · 확정 버튼은 없다 */
  function rawPanel(r) {
    var facts = [
      ['정본 속성', r.baseType], ['등급', r.grade + '등급'],
      ['리드타임 평균', UI.num(r.ltMean) + '일'], ['리드타임 표준편차', UI.num(r.ltStd) + '일'],
      ['등록 공급사', UI.num(r.suppliers) + '곳'], ['연 사용 횟수', UI.num(r.cycles) + '회'],
      ['자재 단가', UI.won(r.price)], ['핵심예비품', r.csp ? '지정됨' : '아님'],
      ['현재고', UI.num(r.stock)], ['조달', r.proc || '미확인']
    ];
    return panelHead(r) +
      '<div class="callout" style="background:var(--surface-2);border:1px solid var(--line)">' +
        '<span class="ci" style="color:var(--muted)">◇</span>' +
        '<span><b style="color:var(--text)">원본 속성 · ' + UI.esc(r.baseType) + '</b>' +
        '정본에 적힌 값입니다. 알고리즘 판정과 점수는 「알고리즘 실행」 뒤에 나옵니다.</span></div>' +
      '<p class="gt" style="margin:14px 0 8px"><span>정본 값</span></p>' +
      '<div class="pgrid">' + facts.map(function (p) {
        return '<div><div class="pk">' + UI.esc(p[0]) + '</div><div class="pv">' + UI.esc(p[1]) + '</div></div>';
      }).join('') + '</div>';
  }

  function panelHead(r) {
    return '<div class="panel-head"><div style="min-width:0">' +
      '<p class="gt" style="margin-bottom:6px"><span>' + (stage === 'algo' ? '자재 판정 근거' : '자재 정본') + '</span></p>' +
      '<h2 style="font-size:20px;letter-spacing:-.6px;margin-bottom:4px">' + UI.esc(r.name || '품명 미확인') + '</h2>' +
      '<p class="sub">' + UI.esc(r.q) + ' · ' + UI.esc((window.ORG ? ORG.load().part : '') || r.dept) +
        ' · ' + UI.esc(r.dept) + ' · ' + UI.gradeBadge(r.grade) + '</p>' +
      '</div><span class="panel-ico">◈</span></div>';
  }

  function algoPanel(r) {
    var d = S.attrDetail(r);
    var si = Number(r.si) || 0, sp = Number(r.sp) || 0;
    var cls = d.bucket === 'gray' ? 'gray' : (d.bucket === 'done' ? 'ok' : (r.verdict === '보험품' ? 'ins' : 'pln'));
    var mark = d.bucket === 'gray' ? '△' : (d.bucket === 'done' ? '✓' : '✦');

    /* 축은 「어느 쪽이 우세한가」 하나다.
     *
     * 전에는 두 점수를 같은 축에 각각 찍었다. 축의 왼쪽이 계획품인데 계획품 점수가
     * 크면 점이 오른쪽으로 가서, 계획품이 우세할 때 파란 점이 오른쪽에 놓였다.
     * 지금은 우세도(보험품 점수 - 계획품 점수)로 점 하나를 놓는다 ·
     * 계획품이 우세하면 왼쪽, 보험품이 우세하면 오른쪽이다. 점 색도 우세한 쪽 색이다.
     * 두 점수 자체는 아래 막대 두 개로 각각 보인다 */
    var lead = si - sp;                       // + 보험품 우세 · − 계획품 우세
    var at = clamp(50 + lead / 2);            // 0~100 · 50 이 균형
    var side = d.bucket === 'gray' ? 'gray' : (lead > 0 ? 'ins' : (lead < 0 ? 'pln' : 'gray'));
    var sideText = d.bucket === 'gray'
      ? '판단 보류 · 점수차 ' + d.gap.toFixed(1) + '점'
      : ((lead > 0 ? '보험품 우세 ' : '계획품 우세 ') + d.gap.toFixed(1) + '점');

    return panelHead(r) +
      /* 판정이 이 화면의 결론이다. 그림 아래에 두면 결론을 찾아 내려가야 한다 */
      '<div class="callout ' + cls + '" style="margin-top:14px"><span class="ci">' + mark + '</span>' +
        '<span><b>' + UI.esc(r.judged
          ? ((r.committed ? '담당자 확정 · ' : '담당자 판단 (확정 대기) · ') + r.judged)
          : UI.verdict(r.verdict)) + '</b>' +
        UI.esc(d.verdictText) + '</span></div>' +

      '<div class="axis2">' +
        '<div class="axis2-head">' +
          '<span class="pln"><i class="ad sp"></i>계획품 ' + sp.toFixed(1) + '</span>' +
          '<span class="mid">' + UI.esc(sideText) + '</span>' +
          '<span class="ins">보험품 ' + si.toFixed(1) + '<i class="ad si"></i></span>' +
        '</div>' +
        '<div class="axis2-track"><span class="axis2-mid"></span>' +
          '<span class="axis2-dot ' + side + '" style="left:' + at + '%"></span>' +
        '</div>' +
        '<div class="axis2-foot"><span>계획품 우세</span><span>균형</span><span>보험품 우세</span></div>' +
        /* 점수 자체는 각자의 막대로 · 0~100 이 그대로 보인다 */
        '<div class="axis2-bars">' +
          bar('계획품 점수', sp, 'pln') +
          bar('보험품 점수', si, 'ins') +
        '</div>' +
      '</div>' +

      /* 원본 → 알고리즘 → 확정, 세 값을 한 줄에. 무엇이 어디서 바뀌었는지가 이 화면의 요점이다 */
      '<div class="flow3">' +
        step3('원본', r.baseType, 'muted') +
        '<span class="fa">→</span>' +
        step3('알고리즘', r.verdict === '회색지대' ? '보류' : UI.verdict(r.verdict),
              r.verdict === '회색지대' ? 'core' : 'text') +
        '<span class="fa">→</span>' +
        step3(r.committed ? '확정' : '담당자 판단',
              r.judged ? r.judged + (r.committed ? '' : ' (대기)') : '대기',
              r.judged ? (r.committed ? 'ok' : 'core') : 'muted') +
      '</div>' +

      '<p class="gt" style="margin:14px 0 8px"><span>점수를 만든 값</span><span class="gt-sub">신뢰도 ' + UI.esc(d.confText) + '</span></p>' +
      '<div class="pgrid">' + d.params.map(function (p) {
        return '<div><div class="pk">' + UI.esc(p[0]) + '</div><div class="pv' + (p[2] ? ' ' + p[2] : '') + '">' + UI.esc(p[1]) + '</div></div>';
      }).join('') + '</div>' +
      '<div class="formula"><div class="ft"><span>적용 가중치</span><span>명세 · 7요인 가중합</span></div>' +
        '<code>' + UI.esc(d.weightText) + '</code>' +
        (d.why ? '<div class="ft" style="margin:8px 0 0"><span>판정 메모</span></div>' + UI.esc(d.why) : '') +
      '</div>' +

      '<div class="decide">' +
        '<p class="decide-note">' + (r.judged
          ? (r.committed
            ? '담당자가 <b>' + UI.esc(r.judged) + '</b> 으로 <b>확정</b>한 자재입니다 · 다른 화면이 이 속성을 씁니다'
            : '<b>' + UI.esc(r.judged) + '</b> 으로 판단했습니다 · <b>확정 대기</b>이며 ' +
              '위의 「담당자 확정」 을 눌러야 다른 화면에 반영됩니다')
          : '담당자 판단이 이 자재의 <b>첫 라벨</b>이 됩니다 · 판단한 뒤 「담당자 확정」 을 눌러야 ' +
            '적정재고 · 적정구매시점이 이 속성으로 계산합니다') + '</p>' +
        (r.judged
          ? '<div class="decide-row">' +
              '<button class="btn ghost" type="button" data-act="revert">판단 취소</button></div>'
          : '<div class="decide-row">' +
              '<button class="btn ins" type="button" data-act="보험품">보험품으로 판단</button>' +
              '<button class="btn pln" type="button" data-act="계획품">계획품으로 판단</button></div>' +
            '<div class="decide-row" style="margin-top:8px"><button class="btn ghost" type="button" data-act="keep">' +
              '현행유지 · ' + UI.esc(r.baseType) + ' 그대로</button></div>') +
      '</div>';
  }

  /* 점수 막대 한 줄 · 0~100 을 그대로 그린다 */
  function bar(k, v, cls) {
    return '<div class="ab ' + cls + '">' +
      '<span class="abk">' + UI.esc(k) + '</span>' +
      '<span class="abt"><i style="width:' + Math.max(0, Math.min(100, v)).toFixed(1) + '%"></i></span>' +
      '<b>' + v.toFixed(1) + '</b></div>';
  }

  function step3(k, v, tone) {
    var col = { muted: 'var(--muted)', core: 'var(--core)', ok: 'var(--ok)', text: 'var(--text)' }[tone];
    return '<div class="f3"><span class="f3k">' + k + '</span><b style="color:' + col + '">' + UI.esc(v) + '</b></div>';
  }

  function clamp(v) { return Math.max(2, Math.min(98, Number(v) || 0)).toFixed(1); }

  // ------------------------------------------------------------ 실행
  /* 「실행」 · 알고리즘 결과(2층)를 화면에 올린다.
     단계 문구는 실제로 일어나는 일만 적는다 · 여기서 계산하는 것은 없다 */
  function run() {
    if (running) { return; }
    running = true;
    var STEPS = [
      '정본 743품목 읽기',
      'feat/algo 엔진 판정 결과 불러오기',
      '점수 · 신뢰도 · 판정 경로 정리',
      '점수차 작은 자재 보류 표시'
    ];
    var box = el('runsteps'), btn = el('run');
    box.hidden = false; btn.disabled = true;
    var i = 0;
    (function tick() {
      if (i >= STEPS.length) {
        S.setStage('algo'); S.setStamp(S.nowStamp());
        stage = 'algo'; tab = 'all'; page = 0; picked = null; running = false; sel = {};
        openList = true; openPanel = true;      // 판단이 일이다 · 실행 뒤에는 펼쳐 둔다
        location.hash = 'all';        // 실행 직후에는 「전체」 가 눌린 화면을 본다
        paintAll();
        return;
      }
      box.innerHTML = STEPS.map(function (s, j) {
        return '<div class="rs' + (j < i ? ' done' : (j === i ? ' now' : '')) + '">' +
          '<span>' + (j < i ? '✓' : (j === i ? '●' : '·')) + '</span>' + UI.esc(s) + '</div>';
      }).join('');
      i += 1;
      window.setTimeout(tick, 750);   // 4단계 × 750ms ≈ 3초 · 실행이 실제로 일어나는 느낌을 준다
    })();
  }

  /* 확정을 알고리즘 담당의 경계 파일로 낸다 */
  function exportCsv(anchor) {
    var csv = S.exportClassification();
    var n = DB.list().filter(function (r) { return r.typeSrc === 'override'; }).length;
    try {
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'classification_result.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch (e) { /* 내려받기가 막힌 환경 · 아래 안내만 */ }
    POP.show(anchor, {
      title: 'classification_result.csv',
      rows: [['행', '743 · 확정 ' + UI.num(n) + '건 포함'], ['칸', 'Qcode · DeptCode · Type · 신뢰도 · 판단근거'],
             ['다음', 'feat/algo 에서 python -B run_all.py → 06 재생성 → algo_in/ 에 넣기']],
      note: '엔진은 보험품 · 계획품 행만 Type 을 바꾸고, 회색지대는 원본 Type 을 씁니다 (03_연동_인터페이스.md).'
    });
  }

  /* 한 건 판단 · 3층에 쌓는다. 정본과 알고리즘 판정은 그대로 남는다 */
  function judge(k, act) {
    var q = k.split('|')[0], dept = k.split('|')[1];
    var r = DB.item(q, dept);
    if (!r) { return false; }
    if (act === 'revert') {
      if (!r.judged) { return false; }
      return !!DB.revertAttr({ q: q, dept: dept });
    }
    if (r.judged) { DB.revertAttr({ q: q, dept: dept }); }   // 판단을 바꾸면 앞 줄을 걷는다
    DB.approveAttr({
      q: q, dept: dept, newType: act === 'keep' ? r.baseType : act,
      reason: act === 'keep' ? '담당자 확인 · 현행유지' : '담당자 판단 · 보유목적 판단'
    });
    return true;
  }

  /* 여러 건 판단 · 한 건씩 돌린다. 실패한 건은 세어서 그대로 알린다 */
  function judgeMany(act, anchor) {
    var keys = Object.keys(sel).filter(function (k) { return sel[k]; });
    if (!keys.length) { return; }
    var ok = 0, fail = 0;
    keys.forEach(function (k) {
      try { if (judge(k, act)) { ok += 1; } else { fail += 1; } }
      catch (e) { fail += 1; }
    });
    sel = {};
    var label = { revert: '판단 취소', keep: '현행유지' }[act] || (act + ' 판단');
    POP.show(anchor, {
      title: label + ' ' + UI.num(ok) + '건',
      rows: [['적용', UI.num(ok) + '건'], ['건너뜀', UI.num(fail) + '건'],
             ['다음', act === 'revert' ? '판단이 지워졌습니다'
               : '「담당자 확정」 을 눌러야 다른 화면에 반영됩니다']],
      note: '판단은 3층에 쌓입니다. 정본과 알고리즘 판정은 그대로입니다.'
    });
    paintAll();
  }

  /* 확정 · 여기까지의 판단을 다른 화면이 쓰게 한다 */
  function commit(anchor) {
    var c = S.attrCounts();
    if (!c.waiting) {
      /* 이미 다 확정한 상태 · 무엇이 확정돼 있는지 그대로 보여 준다 */
      var cm0 = DB.commitInfo();
      POP.show(anchor, {
        title: '이미 확정돼 있습니다',
        rows: [['확정', UI.num(cm0.done) + '품목'], ['확정 시각', cm0.at || '미기록'],
               ['확정 대기', '0품목']],
        note: '새로 판단한 자재가 생기면 이 버튼이 다시 활성화됩니다.'
      });
      return;
    }
    var info = DB.commitAttr();
    POP.show(anchor, {
      title: '담당자 확정 ' + UI.num(info.n) + '품목',
      rows: [['확정 시각', info.at],
             ['이제 반영되는 화면', '적정재고 분석 · 적정구매시점 · 대시보드'],
             ['다음', '적정재고 분석에서 「분석」 을 다시 누르면 이 속성으로 계산합니다']],
      note: '확정 전까지 다른 화면은 알고리즘 판정 속성을 씁니다. 확정은 3층 이력으로 남습니다.'
    });
    paintAll();
  }

  // ------------------------------------------------------------ 이벤트
  function wire() {
    /* 단계 줄 · 네 칸이 각각 실제 동작이다 */
    el('stageline').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) { return; }
      var act = b.getAttribute('data-act');
      if (act === 'raw') {
        S.setStage('raw'); stage = 'raw'; tab = null; page = 0; sel = {};
        picked = null; openList = false; openPanel = false;   // 원본으로 돌아오면 다시 접는다
        location.hash = '';
        paintAll();
        return;
      }
      if (act === 'run') {
        if (stage === 'algo') { return; }     // 이미 결과가 올라와 있다
        run();
        return;
      }
      if (act === 'judge') {
        if (stage !== 'algo') { run(); return; }
        tab = 'done'; page = 0; location.hash = 'done';
        paintTabs(); paintList(); paintPanel();
        el('commit').scrollIntoView({ block: 'center' });
        return;
      }
      if (act === 'stock') {
        var cm = DB.commitInfo();
        if (!cm.done || S.attrCounts().waiting) {
          POP.show(b, {
            title: '먼저 확정해야 합니다',
            rows: [['확정된 판단', UI.num(cm.done) + '품목'],
                   ['확정 대기', UI.num(S.attrCounts().waiting) + '품목']],
            note: '적정재고 분석은 확정된 속성만 씁니다. 「담당자 확정」 을 누른 뒤 넘어가세요.'
          });
          return;
        }
        window.location.href = 'stock.html';
      }
    });

    el('commit').addEventListener('click', function (e) { commit(e.currentTarget); });

    /* 초기화 · 이 화면에서 한 일만 지운다. 반납 · 초안은 사이드바의 시연 초기화가 지운다 */
    el('clear').addEventListener('click', function () {
      var c = S.attrCounts(), cm = DB.commitInfo();
      UI.confirm({
        title: '보유목적 판단을 초기화할까요?',
        body: '판단 · 확정을 지우고 <b>원본 속성</b> 상태로 돌립니다.',
        rows: [['지우는 것', '판단 ' + UI.num(c.done) + '건 · 확정 ' + UI.num(cm.done) + '건 · 실행 단계'],
               ['남는 것', '자재반납 · 구매신청 초안 · 공용 전환 이력'],
               ['다른 화면', '확정이 지워지므로 알고리즘 판정 속성으로 되돌아갑니다']],
        note: '반납 · 초안까지 지우려면 왼쪽 아래 「시연 초기화」 를 쓰세요.',
        ok: '초기화',
        onOk: function () {
          DB.clearAttr();
          S.setStage('raw');
          stage = 'raw'; tab = null; page = 0; sel = {}; picked = null;
          openList = false; openPanel = false;
          location.hash = '';
          paintAll();
        }
      });
    });

    /* 체크 · 이 쪽 전체 선택 · 여러 건 판단 */
    el('bulk').addEventListener('click', function (e) {
      var all = e.target.closest('#chkall');
      if (all) {
        /* 이 칸에 있는 것 전부 · 쪽 넘김과 무관하다 */
        var keys = listRows.map(function (r) { return r.key; });
        var on = keys.filter(function (k) { return sel[k]; }).length === keys.length;
        keys.forEach(function (k) { if (on) { delete sel[k]; } else { sel[k] = true; } });
        paintList();
        return;
      }
      var b = e.target.closest('[data-bulk]');
      if (!b) { return; }
      var act = b.getAttribute('data-bulk');
      if (act === 'clear') { sel = {}; paintList(); return; }
      judgeMany(act, b);
    });
    el('runhero').addEventListener('click', function (e) { if (e.target.closest('#run')) { run(); } });
    el('export').addEventListener('click', function (e) { exportCsv(e.currentTarget); });
    el('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.tab'); if (!b) { return; }
      var key = b.getAttribute('data-tab');
      /* 원본 단계 · 같은 칸을 다시 누르면 접는다 (토글) */
      if (stage === 'raw' && openList && tab === key) {
        openList = false; openPanel = false; picked = null; tab = null;
        paintTabs(); paintList(); paintPanel(); applyFold();
        return;
      }
      tab = key; page = 0;
      if (stage === 'raw') { openList = true; }
      if (stage === 'algo') { location.hash = tab; }
      paintTabs(); paintList(); paintPanel(); applyFold();
    });
    el('sort').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) { return; }
      sort = b.getAttribute('data-sort');
      [].forEach.call(el('sort').children, function (x) { x.classList.toggle('on', x === b); });
      page = 0; paintList(); paintPanel();
    });
    el('list').addEventListener('click', function (e) {
      var chk = e.target.closest('[data-chk]');
      if (chk) {
        var k = chk.getAttribute('data-chk');
        if (sel[k]) { delete sel[k]; } else { sel[k] = true; }
        paintList();
        return;
      }
      var b = e.target.closest('[data-open]'); if (!b) { return; }
      var key = b.getAttribute('data-open');
      /* 원본 단계 · 같은 자재를 다시 누르면 오른쪽 카드를 접는다 (토글) */
      if (stage === 'raw' && openPanel && picked === key) {
        openPanel = false; picked = null;
      } else {
        picked = key; openPanel = true;
      }
      paintList(); paintPanel(); applyFold();
    });
    el('prev').addEventListener('click', function () { page -= 1; paintList(); paintPanel(); });
    el('next').addEventListener('click', function () { page += 1; paintList(); paintPanel(); });

    el('panel').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b || !picked || !window.DB) { return; }
      try { judge(picked, b.getAttribute('data-act')); }
      catch (err) {
        POP.show(b, { title: '판단하지 못했습니다', rows: [['이유', String(err.message || err)]] });
      }
    });
  }

  function paintAll() {
    var m = window.DB ? DB.meta() : null;
    el('asof').textContent = m && m.asof ? ('기준일 ' + UI.date(m.asof)) : '기준일 확인 중';
    paintStage(); paintHero(); paintTabs(); paintList(); paintPanel(); applyFold();
  }

  paintAll();
  wire();
  S.on(paintAll);
})();
</script>

<script src="assets/chat.js"></script>

</body>
