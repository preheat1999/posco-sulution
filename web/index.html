<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포스코 자재관리 도우미</title>
<!-- 외부 요청 없이 favicon 404 를 없앤다 (오프라인 안전) -->
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f4f5f7; --panel:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e6ea;
    --accent:#00539b; --accent-soft:#e8f0f8; --warn:#8a5a00; --warn-bg:#fff6e5;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.65 "Malgun Gothic","Segoe UI",system-ui,sans-serif;
       background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;
         display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700}
  .badge{font-size:12px;color:var(--muted);border:1px solid var(--line);
         border-radius:999px;padding:2px 10px;white-space:nowrap}
  .badge.ok{color:#0a6b3d;border-color:#b7e0c9;background:#eefaf3}
  .badge.bad{color:#a11;border-color:#f0c2c2;background:#fdeeee}
  #tok{margin-left:auto;font:12px monospace;border:1px solid var(--line);
       border-radius:6px;padding:5px 8px;width:210px}
  main{flex:1;overflow-y:auto;padding:22px 20px}
  .wrap{max-width:900px;margin:0 auto}
  .msg{margin-bottom:22px;overflow:hidden}
  .q{background:var(--accent);color:#fff;padding:10px 14px;border-radius:12px 12px 2px 12px;
     display:inline-block;max-width:85%;float:right}
  .a{background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 12px 2px;
     padding:16px 18px}
  .a h3{font-size:15px;margin:14px 0 6px}
  .a p{margin:8px 0}
  .a ul,.a ol{margin:8px 0;padding-left:22px}
  .a table{border-collapse:collapse;margin:12px 0;font-size:14px;width:100%}
  .a th,.a td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .a th{background:#f7f8fa}
  .cite{display:inline-block;min-width:18px;text-align:center;font-size:11px;font-weight:700;
        color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 4px;
        margin:0 1px;cursor:pointer;vertical-align:super}
  .cite:hover{background:var(--accent);color:#fff}
  .sources{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  .src{display:flex;gap:9px;padding:7px 8px;border-radius:7px;font-size:13px}
  .src.hl{background:var(--accent-soft);outline:1px solid #bcd6ea}
  .src .n{color:var(--accent);font-weight:700;flex:none}
  .src .t{color:var(--muted)}
  .src .t b{color:var(--ink);font-weight:600}
  .metrics{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
  .noans{background:var(--warn-bg);border-color:#f0dcae;color:var(--warn)}
  footer{background:var(--panel);border-top:1px solid var(--line);padding:12px 20px}
  .bar{max-width:900px;margin:0 auto;display:flex;gap:10px}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;
           padding:11px 13px;font:inherit;height:46px;max-height:130px}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;
         padding:0 22px;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{background:#9bb4c9;cursor:default}
  .ex{max-width:900px;margin:0 auto 10px;display:flex;gap:7px;flex-wrap:wrap}
  .ex span{font-size:12px;color:var(--accent);background:var(--panel);
           border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--accent-soft);
        border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;
        vertical-align:-2px;margin-right:7px}
  @keyframes s{to{transform:rotate(360deg)}}
  /* 진행 단계 표시 */
  .steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .step{font-size:12px;color:var(--muted);border:1px solid var(--line);
        border-radius:999px;padding:3px 11px;display:flex;align-items:center;gap:6px}
  .step .dot{width:6px;height:6px;border-radius:50%;background:#cfd5dc;flex:none}
  .step.now{color:var(--accent);border-color:#bcd6ea;background:var(--accent-soft)}
  .step.now .dot{background:var(--accent);animation:p 1s ease-in-out infinite}
  .step.done{color:#0a6b3d;border-color:#b7e0c9;background:#eefaf3}
  .step.done .dot{background:#0a6b3d}
  @keyframes p{50%{opacity:.25}}
  .cursor{display:inline-block;width:7px;height:15px;background:var(--accent);
          vertical-align:-2px;animation:p .9s steps(2) infinite}
  .route{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;
         padding:2px 8px;margin-bottom:9px}
  .route.sql{color:#7a4b00;background:#fff3e0;border:1px solid #f0d9ae}
  .route.hybrid{color:#5b3fa8;background:#f1ecfb;border:1px solid #d8cdf0}
  .rw{font-size:12px;color:var(--muted);background:#f7f8fa;border:1px solid var(--line);
      border-radius:7px;padding:6px 10px;margin-bottom:10px}
  .rw b{color:var(--ink);font-weight:600}
  #new{background:none;color:var(--muted);border:1px solid var(--line);
       padding:5px 12px;font-size:12px;font-weight:400}
  #new:hover{color:var(--accent);border-color:#bcd6ea}
</style>
</head>
<body>
<header>
  <h1>포스코 자재관리 도우미</h1>
  <span class="badge" id="b-mode">연결 확인 중…</span>
  <span class="badge" id="b-chunks"></span>
  <span class="badge" id="b-llm"></span>
  <!-- 시연 화면·스크린샷에 토큰이 그대로 찍히지 않도록 가린다 -->
  <button id="new" title="대화 이력을 지웁니다">새 대화</button>
  <input id="tok" type="password" placeholder="X-API-Token"
         title="서버 토큰 (.env 의 RAG_API_TOKEN)">
</header>

<main><div class="wrap" id="chat">
  <div class="msg"><div class="a">
    사내 규정·매뉴얼·계약서·질의응답 기록을 근거로 답합니다.
    모든 답변에는 <b>문서명과 슬라이드·페이지·조항</b> 출처가 붙습니다.
    근거가 없으면 추측하지 않고 <b>찾을 수 없다고 답합니다.</b>
  </div></div>
</div></main>

<footer>
  <div class="ex" id="ex"></div>
  <div class="bar">
    <textarea id="q" placeholder="질문을 입력하세요  (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
    <button id="send">전송</button>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
const chat = $('#chat'), tok = $('#tok');
tok.value = localStorage.getItem('ragToken') || '';
tok.addEventListener('change', () => localStorage.setItem('ragToken', tok.value.trim()));

const EXAMPLES = [
  '자재 입하 검수 절차를 알려주세요',
  '표준하도급계약서의 지체상금 기준은?',
  'VMI 자재 증량 요청은 어떻게 하나요?',
  'Q1000108 지금 몇 개 있어?',                       // 정형 경로
  '속성별 재고 금액 알려줘',                          // 정형 경로
  'Q1000108 재고 알려주고 발주 신청 절차도 알려줘',    // 하이브리드
  '우주선 부품 재고를 알려주세요',                     // 무응답 정책
];
EXAMPLES.forEach(t => {
  const s = document.createElement('span');
  s.textContent = t;
  s.onclick = () => { $('#q').value = t; send(); };
  $('#ex').appendChild(s);
});

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* 답변에 실제로 쓰이는 마크다운만 렌더한다 (외부 라이브러리 없음 = 오프라인 안전) */
function md(src){
  const lines = esc(src).split('\n');
  let out = '', list = null, tbl = null;
  const inline = t => t
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[(\d{1,2})\]/g, '<span class="cite" data-n="$1">$1</span>');
  const closeList = () => { if (list) { out += '</' + list + '>'; list = null; } };
  const closeTbl = () => { if (tbl) { out += '</tbody></table>'; tbl = null; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); closeTbl(); continue; }
    if (/^\|.*\|$/.test(line)) {
      if (/^[\s:|-]+$/.test(line.replace(/\|/g, ''))) continue;
      const cells = line.slice(1, -1).split('|').map(c => c.trim());
      if (!tbl) {
        closeList();
        out += '<table><thead><tr>' + cells.map(c => '<th>' + inline(c) + '</th>').join('') +
               '</tr></thead><tbody>';
        tbl = 1;
      } else {
        out += '<tr>' + cells.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      }
      continue;
    }
    closeTbl();
    let m;
    if ((m = line.match(/^#{1,4}\s+(.*)$/))) { closeList(); out += '<h3>' + inline(m[1]) + '</h3>'; continue; }
    if ((m = line.match(/^(\d+)[.)]\s+(.*)$/))) {
      if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; }
      out += '<li>' + inline(m[2]) + '</li>'; continue;
    }
    if ((m = line.match(/^[-*•]\s+(.*)$/))) {
      if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; }
      out += '<li>' + inline(m[1]) + '</li>'; continue;
    }
    closeList();
    out += '<p>' + inline(line) + '</p>';
  }
  closeList(); closeTbl();
  return out;
}

async function health(){
  try{
    const h = await (await fetch('/api/health')).json();
    const hybrid = h.retrieval.indexOf('hybrid') === 0;
    $('#b-mode').textContent = hybrid ? 'hybrid (Qdrant dense + 로컬 BM25)' : 'BM25 단독';
    $('#b-mode').className = 'badge ' + (hybrid ? 'ok' : 'bad');
    $('#b-chunks').textContent = '색인 ' + h.n_chunks.toLocaleString() +
                                 ' · 로컬 청크 ' + h.local_chunks.toLocaleString();
    $('#b-llm').textContent = h.llm.model;
    if (!h.auth_required) tok.style.display = 'none';
  }catch(e){
    $('#b-mode').textContent = '서버 연결 실패';
    $('#b-mode').className = 'badge bad';
  }
}
health();

function bubble(cls, html){
  const d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = '<div class="' + cls + '">' + html + '</div>';
  chat.appendChild(d);
  d.scrollIntoView({behavior:'smooth', block:'end'});
  return d.firstChild;
}

/* 대화 이력 — 서버에도 최근 4턴만 보낸다(프롬프트가 근거 문서를 밀어내지 않도록) */
let history = [];
$('#new').onclick = () => {
  history = [];
  [...chat.children].slice(1).forEach(el => el.remove());
};

const STAGES = ['질의 분석', '사내 문서 검색', '근거 정밀 선별', '답변 작성'];
const STAGES_SQL = ['질의 분석', '사내 데이터 조회', '-', '답변 작성'];

function renderSteps(cur, route){
  const names = route === 'sql' ? STAGES_SQL : STAGES;
  return '<div class="steps">' + names.filter(n => n !== '-').map((s, i) => {
    const cls = i < cur ? 'done' : (i === cur ? 'now' : '');
    return '<span class="step ' + cls + '"><span class="dot"></span>' + s + '</span>';
  }).join('') + '</div>';
}

async function send(){
  const q = $('#q').value.trim();
  if (!q) return;
  $('#q').value = '';
  $('#send').disabled = true;
  bubble('q', esc(q));
  const box = bubble('a', renderSteps(0));
  const t0 = performance.now();
  try{
    const r = await fetch('/api/chat/stream', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'X-API-Token': tok.value.trim()},
      body: JSON.stringify({question:q, history: history.slice(-4)}),
    });
    if (r.status === 401){
      box.className = 'a noans';
      box.textContent = '인증 실패 — 우측 상단에 서버 토큰(.env 의 RAG_API_TOKEN)을 입력하세요.';
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);

    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '', d = null, stage = 0, rw = '', route = '';
    const ROUTE_LABEL = {sql: '사내 데이터 조회', hybrid: '데이터 + 문서'};
    const head = () => (route && ROUTE_LABEL[route]
        ? '<div class="route ' + route + '">' + ROUTE_LABEL[route] + '</div>' : '')
      + (rw ? '<div class="rw">앞 대화를 반영해 <b>' + esc(rw) +
              '</b> 로 이해하고 검색했습니다.</div>' : '');
    while (true){
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();                       // 마지막 조각은 아직 미완성일 수 있다
      for (const line of lines){
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch(_) { continue; }
        if (ev.type === 'route'){
          route = ev.route;
          box.innerHTML = head() + renderSteps(stage, route);
        } else if (ev.type === 'rewrite'){
          rw = ev.question;
          box.innerHTML = head() + renderSteps(stage, route);
        } else if (ev.type === 'stage'){
          if (ev.index < 4) stage = ev.index + 1;
          if (!text) box.innerHTML = head() + renderSteps(stage, route);
        } else if (ev.type === 'delta'){
          text += ev.text;
          box.innerHTML = head() + renderSteps(4, route) + md(text) + '<span class="cursor"></span>';
          box.scrollIntoView({behavior:'smooth', block:'end'});
        } else if (ev.type === 'replace'){
          text = ev.answer;
          box.innerHTML = head() + renderSteps(4, route) + md(text);
        } else if (ev.type === 'error'){
          throw new Error(ev.message);
        } else if (ev.type === 'result'){
          d = ev;
        }
      }
    }
    if (!d) throw new Error('결과 이벤트를 받지 못했습니다');

    if (d.rewritten_question) rw = d.rewritten_question;
    if (d.route) route = d.route;
    let html = head() + md(d.answer);
    if (d.no_answer) box.className = 'a noans';
    if (d.citations.length){
      html += '<div class="sources">' + d.citations.map(c =>
        '<div class="src" id="src-' + c.index + '">' +
          '<span class="n">[' + c.index + ']</span>' +
          '<span class="t"><b>' + esc(c.source) + '</b>' +
            (c.date ? ' · ' + c.date : '') + '<br>' + esc(c.snippet) + '…</span>' +
        '</div>').join('') + '</div>';
    }
    // 경로마다 거치는 단계가 다르므로 실제로 측정된 지표만 보여준다
    const m = d.metrics, parts = ['총 ' + (m.total_ms/1000).toFixed(1) + '초'];
    if (m.sql_ms != null) parts.push('조회 ' + m.sql_ms + 'ms (' + (m.sql_rows ?? 0) + '행)');
    if (m.retrieve_ms != null) parts.push('검색 ' + m.retrieve_ms + 'ms');
    if (m.rerank_ms != null) parts.push('선별 ' + m.rerank_ms + 'ms');
    if (m.generate_ms != null) parts.push('생성 ' + m.generate_ms + 'ms');
    if (d.citations.length) {
      parts.push('인용률 ' + ((m.citation_coverage || 0)*100).toFixed(0) + '%');
      parts.push('근거 ' + d.citations.length + '건');
    }
    html += '<div class="metrics">' + parts.map(p => '<span>' + p + '</span>').join('') + '</div>';
    box.innerHTML = html;
    // 근거를 못 찾은 답변은 이력에 남기지 않는다 — 뒤 질문의 맥락을 오염시킨다
    if (!d.no_answer) history.push({question: q, answer: d.answer});
    box.querySelectorAll('.cite').forEach(el => el.onclick = () => {
      const t = box.querySelector('#src-' + el.dataset.n);
      if (!t) return;
      box.querySelectorAll('.src').forEach(s => s.classList.remove('hl'));
      t.classList.add('hl');
      t.scrollIntoView({behavior:'smooth', block:'center'});
    });
  }catch(e){
    box.className = 'a noans';
    box.textContent = '요청 실패: ' + e.message +
                      ' (' + ((performance.now()-t0)/1000).toFixed(1) + '초)';
  }finally{
    $('#send').disabled = false;
    box.scrollIntoView({behavior:'smooth', block:'end'});
  }
}
$('#send').onclick = send;
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
</script>
</body>
</html>
