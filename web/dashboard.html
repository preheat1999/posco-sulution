<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포스코 자재관리 데이터 분석</title>
<link rel="icon" href="data:,">
<style>
  /* 팔레트: dataviz 참조 인스턴스 (검증기 통과: 인접 4계열 light/dark, all-pairs 3계열) */
  :root{
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb; --surface-2:#f0efec;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
    --series-5:#e87ba4; --series-6:#008300;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#0d0d0d; --surface-1:#1a1a19; --surface-2:#2c2c2a;
      --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
      --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
      --series-5:#d55181; --series-6:#008300;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --surface-2:#2c2c2a;
    --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --series-5:#d55181; --series-6:#008300;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text-primary);
       font:14px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--surface-1);
         border-bottom:1px solid var(--border);padding:12px 22px;
         display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0}
  header .sp{margin-left:auto;display:flex;gap:8px}
  button{font:inherit;font-size:12px;border:1px solid var(--border);border-radius:7px;
         background:var(--surface-1);color:var(--text-secondary);padding:6px 12px;cursor:pointer}
  button:hover{color:var(--series-1)}
  button[aria-pressed="true"]{background:var(--series-1);color:#fff;border-color:transparent}
  main{max-width:1180px;margin:0 auto;padding:22px}
  .notice{background:var(--surface-2);border-left:3px solid var(--warning);
          border-radius:6px;padding:10px 14px;font-size:13px;color:var(--text-secondary);
          margin-bottom:22px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:8px}
  .tile{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .tile .k{font-size:12px;color:var(--muted)}
  .tile .v{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
  .tile .s{font-size:12px;color:var(--text-secondary);margin-top:2px}
  .hero{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;
        padding:18px 20px;margin:12px 0 24px}
  .hero .v{font-size:52px;font-weight:700;letter-spacing:-1.5px;line-height:1.05}
  .hero .k{font-size:13px;color:var(--muted)}
  .hero .s{font-size:13px;color:var(--text-secondary);margin-top:6px;max-width:70ch}
  section{margin:34px 0;scroll-margin-top:64px}
  section > h2{font-size:19px;margin:0 0 4px;letter-spacing:-.3px}
  section > .lead{color:var(--text-secondary);font-size:13.5px;margin:0 0 16px;max-width:88ch}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
  .grid.wide{grid-template-columns:1fr}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow:hidden}
  .card h3{font-size:13.5px;margin:0 0 2px}
  .card .sub{font-size:12px;color:var(--muted);margin:0 0 10px}
  .card .finding{font-size:12.5px;color:var(--text-secondary);margin-top:8px;
                 border-top:1px dashed var(--grid);padding-top:8px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:2px 0 8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  svg.chart{width:100%;height:auto;display:block;overflow:visible}
  .grid line, line.grid{stroke:var(--grid);stroke-width:1}
  .refline{stroke:var(--axis);stroke-width:1;stroke-dasharray:3 3}
  .plotbg{fill:var(--surface-2);fill-opacity:.45}
  text{font:11px system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
  text.lbl{fill:var(--text-secondary)}
  text.ax{fill:var(--muted);font-size:10.5px}
  text.val{fill:var(--text-primary);font-weight:600;font-size:11px}
  text.inbar{fill:#fff;font-weight:700;font-size:10.5px}
  text.incell{fill:var(--text-primary);font-size:10px}
  text.note{fill:var(--text-secondary);font-size:10.5px;font-weight:600}
  text.quad{fill:var(--muted);font-size:11px;font-weight:600}
  path.lineMark{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linejoin:round}
  path.areafill{fill:var(--series-1);fill-opacity:.12}
  path.areaseg{fill-opacity:.85;stroke:var(--surface-1);stroke-width:2}
  circle.dot{fill:var(--series-1);stroke:var(--surface-1);stroke-width:2}
  circle.pt{stroke:var(--surface-1);stroke-width:1}
  line.stem{stroke:var(--axis);stroke-width:2}
  rect.mark{stroke:var(--surface-1);stroke-width:0}
  .viz-tip{position:fixed;z-index:99;pointer-events:none;display:none;max-width:280px;
           background:var(--text-primary);color:var(--page);font-size:12px;line-height:1.5;
           padding:7px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.22)}
  .dtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  .dtable th,.dtable td{border:1px solid var(--grid);padding:4px 8px;text-align:left}
  .dtable th{background:var(--surface-2);font-weight:600}
  .dtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  body:not(.show-tables) .tablewrap{display:none}
  .flow{overflow-x:auto}
  .flow svg{min-width:560px}
  .fbox{fill:var(--surface-2);stroke:var(--axis);stroke-width:1}
  .fbox.accent{fill:var(--series-1);stroke:none}
  .fbox.warn{fill:var(--warning);stroke:none;fill-opacity:.28}
  .ftext{fill:var(--text-primary);font-size:11.5px}
  .ftext.on{fill:#fff;font-weight:600}
  .farrow{stroke:var(--axis);stroke-width:1.6;fill:none;marker-end:url(#ah)}
  .fnote{fill:var(--muted);font-size:10.5px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0 40px}
  @media (max-width:700px){ .hero .v{font-size:38px} main{padding:14px} }
</style>
</head>
<body>
<header>
  <h1>포스코 자재관리 데이터 분석</h1>
  <span id="built" style="font-size:12px;color:var(--muted)"></span>
  <span class="sp">
    <button id="btnTable" aria-pressed="false">표로 보기</button>
    <button id="btnTheme">테마</button>
    <button onclick="location.href='/'">챗봇으로</button>
  </span>
</header>
<main id="app">불러오는 중…</main>
<footer>집계 수치만 사용 · 문서 원문과 개인정보는 포함하지 않음</footer>

<script src="/web/viz.js"></script>
<script>
const $ = s => document.querySelector(s);
const { hbar, vbar, gbar, stackbar, line, curve, stackarea, heatmap, scatter,
        lollipop, dumbbell, meter, table, fmt, pct, CAT } = window.VIZ;

/* 카드 조립 */
function card(title, sub, node, finding, tableSpec) {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<h3>${title}</h3>` + (sub ? `<p class="sub">${sub}</p>` : '');
  if (node) c.appendChild(node);
  if (finding) {
    const f = document.createElement('div'); f.className = 'finding'; f.innerHTML = finding;
    c.appendChild(f);
  }
  if (tableSpec) {
    const w = document.createElement('div'); w.className = 'tablewrap';
    w.appendChild(table(tableSpec.cols, tableSpec.rows));
    c.appendChild(w);
  }
  return c;
}
function legend(items) {
  const d = document.createElement('div'); d.className = 'legend';
  d.innerHTML = items.map((t, i) => `<span><i style="background:${CAT[i % CAT.length]}"></i>${t}</span>`).join('');
  return d;
}
function section(title, lead, cards, wide) {
  const s = document.createElement('section');
  s.innerHTML = `<h2>${title}</h2><p class="lead">${lead}</p>`;
  const g = document.createElement('div');
  g.className = 'grid' + (wide ? ' wide' : '');
  cards.forEach(c => c && g.appendChild(c));
  s.appendChild(g);
  return s;
}
const rowsOf = d => d.map(x => [x.label, fmt(x.value)]);

/* ---------------- 흐름도 (인라인 SVG) ---------------- */
function flowSvg(nodes, edges, w, h, notes) {
  const NSU = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NSU, 'svg');
  s.setAttribute('viewBox', `0 0 ${w} ${h}`);
  s.innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--axis)"/></marker></defs>`;
  edges.forEach(e => {
    const p = document.createElementNS(NSU, 'path');
    p.setAttribute('d', e.d); p.setAttribute('class', 'farrow');
    if (e.dash) p.setAttribute('stroke-dasharray', '4 3');
    s.appendChild(p);
    if (e.label) {
      const t = document.createElementNS(NSU, 'text');
      t.setAttribute('x', e.lx); t.setAttribute('y', e.ly);
      t.setAttribute('class', 'fnote'); t.setAttribute('text-anchor', 'middle');
      t.textContent = e.label; s.appendChild(t);
    }
  });
  nodes.forEach(n => {
    const r = document.createElementNS(NSU, 'rect');
    r.setAttribute('x', n.x); r.setAttribute('y', n.y);
    r.setAttribute('width', n.w || 132); r.setAttribute('height', n.h || 40);
    r.setAttribute('rx', 8);
    r.setAttribute('class', 'fbox' + (n.k ? ' ' + n.k : ''));
    s.appendChild(r);
    (n.t.split('\n')).forEach((ln, i, arr) => {
      const t = document.createElementNS(NSU, 'text');
      t.setAttribute('x', n.x + (n.w || 132) / 2);
      t.setAttribute('y', n.y + (n.h || 40) / 2 + 4 + (i - (arr.length - 1) / 2) * 13);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'ftext' + (n.k === 'accent' ? ' on' : ''));
      t.textContent = ln; s.appendChild(t);
    });
  });
  (notes || []).forEach(n => {
    const t = document.createElementNS(NSU, 'text');
    t.setAttribute('x', n.x); t.setAttribute('y', n.y);
    t.setAttribute('class', 'fnote'); t.textContent = n.t; s.appendChild(t);
  });
  const wrap = document.createElement('div'); wrap.className = 'flow'; wrap.appendChild(s);
  return wrap;
}
const H = (x1, x2, y) => `M${x1},${y} L${x2},${y}`;
const Vt = (x, y1, y2) => `M${x},${y1} L${x},${y2}`;

/* ---------------- 메인 ---------------- */
(async function () {
  const V = await (await fetch('/api/viz')).json();
  let E = null;
  try { E = await (await fetch('/api/eval')).json(); } catch (e) { E = null; }
  const app = $('#app'); app.innerHTML = '';
  $('#built').textContent = `집계 ${V.meta.built_at} · 기준일 ${V.meta.asof}`;

  const nt = document.createElement('div');
  nt.className = 'notice';
  nt.innerHTML = `⚠️ ${V.meta.note} 질문 로그는 실제 사내 데이터이며 <b>개인정보(작성자·등록일)는 집계에서 제외</b>했습니다.`;
  app.appendChild(nt);

  /* KPI */
  const k = document.createElement('div'); k.className = 'kpis';
  [['사내 문서', V.corpus.n_docs + '건', `검색 청크 ${fmt(V.corpus.n_chunks)}개`],
   ['실무 질문 로그', fmt(V.faq.n_rows) + '행', `질문 ${fmt(V.faq.qa.questions)} · 답변 ${fmt(V.faq.qa.answers)}`],
   ['자재', V.material.n_items + '종', `재고금액 ${fmt(V.material.total_value)}원`],
   ['설비 정비 이력', fmt(V.maint.n) + '건', `총 정지 ${fmt(V.maint.hours_stats.total)}시간`],
   ['불출 이력', fmt(V.demand.monthly.reduce((a, b) => a + b.value, 0)) + '개', `창고 ${V.flow.n_warehouses}곳`],
  ].forEach(([a, b, c]) => {
    const t = document.createElement('div'); t.className = 'tile';
    t.innerHTML = `<div class="k">${a}</div><div class="v">${b}</div><div class="s">${c}</div>`;
    k.appendChild(t);
  });
  app.appendChild(k);

  /* 히어로 */
  const hero = document.createElement('div'); hero.className = 'hero';
  hero.innerHTML = `<div class="k">실무 답변의 집중도</div>
    <div class="v">${pct(V.faq.answer_concentration.top1)}</div>
    <div class="s">답변 ${fmt(V.faq.answer_concentration.n_answers)}건 중 <b>한 사람</b>이 낸 비중입니다.
    답변자 ${V.faq.answer_concentration.n_answerers}명 중 ${V.faq.answer_concentration.single_answer_people}명
    (${pct(V.faq.answer_concentration.single_answer_people / V.faq.answer_concentration.n_answerers)})은 딱 한 번만 답했습니다.
    답변은 빠릅니다(당일 ${pct(V.faq.answer_lag.bands[0].value / V.faq.answer_lag.n)}) — 문제는 그 속도가 소수에게 의존한다는 것입니다.</div>`;
  app.appendChild(hero);

  /* ===================== 스토리 1 ===================== */
  const lagRows = V.faq.answer_lag.bands;
  app.appendChild(section('1 · 실무자는 무엇을 몰라서 묻는가',
    `사내 질문 로그 ${fmt(V.faq.n_rows)}행(3개 시스템)을 집계했습니다. 무엇을 묻는지, 답이 언제 돌아오는지, 누가 답하는지를 봅니다.`,
    [
      card('질문 주제', '무엇을 묻는가 (질문분류 시스템)',
        hbar(V.faq.topics, { labelW: 118 }), null,
        { cols: ['주제', '건수'], rows: rowsOf(V.faq.topics) }),
      card('기술 분야', '분야별 질문 수',
        hbar(V.faq.fields, { labelW: 138 }), null,
        { cols: ['분야', '건수'], rows: rowsOf(V.faq.fields) }),
      card('질문 → 답변 소요일 ★신규', `측정 스레드 ${fmt(V.faq.answer_lag.n)}건`,
        vbar(lagRows, { height: 190 }),
        `중앙 <b>${V.faq.answer_lag.median}일</b> · 90분위 ${V.faq.answer_lag.p90}일 · 95분위 ${V.faq.answer_lag.p95}일 · 최대 ${V.faq.answer_lag.max}일.
         대부분 당일에 답이 오지만 <b>${pct(1 - lagRows[0].value / V.faq.answer_lag.n)}는 하루를 넘깁니다.</b>`,
        { cols: ['구간', '건수'], rows: rowsOf(lagRows) }),
      card('답변 집중도 (로렌츠 곡선) ★신규', '가로: 답변자 누적 비율 · 세로: 답변 누적 비율',
        curve(V.faq.answer_concentration.lorenz, { marks: [0.034], xlabel: '답변자 누적 비율' })  /* 마커가 왼쪽에 몰려 겹치므로 하나만 찍고 나머지 수치는 아래 설명에 둔다 */,
        `상위 1명 <b>${pct(V.faq.answer_concentration.top1)}</b> · 5명 ${pct(V.faq.answer_concentration.top5)}
         · 10명 ${pct(V.faq.answer_concentration.top10)} · 20명 ${pct(V.faq.answer_concentration.top20)}.
         점선(대각선)은 완전 균등일 때의 모습입니다. ※ 이름은 쓰지 않고 순위별 비중만 집계했습니다.`),
      card('주제 구성의 변화', '연도별 상위 5개 주제 (누적 영역)',
        (() => { const d = document.createElement('div');
          d.appendChild(legend(V.faq.topic_by_year.series.map(s => s.label)));
          d.appendChild(stackarea(V.faq.topic_by_year.years, V.faq.topic_by_year.series));
          return d; })()),
      card('연도별 질문 수', '3개 시스템 합계',
        line(V.faq.by_year, { area: true, suffix: '건' }), null,
        { cols: ['연도', '건수'], rows: rowsOf(V.faq.by_year) }),
      card('전문가가 답한 비율', '질문분류·생산관리 시스템',
        meter(V.faq.expert_ratio.expert / (V.faq.expert_ratio.expert + V.faq.expert_ratio.normal),
          { label: '전문가 답변' }),
        `전문가 ${fmt(V.faq.expert_ratio.expert)}건 / 일반 ${fmt(V.faq.expert_ratio.normal)}건.
         답변의 대부분이 전문가 인증 없이 이뤄집니다 — 근거 문서로 검증할 필요가 여기서 나옵니다.`),
      card('설비별 질문', `상위 12종 (미분류 ${fmt(V.faq.equipment.unclassified)}건 제외)`,
        hbar(V.faq.equipment.items, { labelW: 96 }),
        `전체의 ${pct(V.faq.equipment.unclassified / (V.faq.equipment.unclassified + V.faq.equipment.items.reduce((a, b) => a + b.value, 0)))}가
         설비 미분류입니다. 분류된 건만 표시했습니다.`),
      card('기술 주제 분포', '질문분류 시스템 기준',
        hbar(V.faq.themes, { labelW: 96 })),
      card('구매 질문 유형', '구매지원 시스템',
        (() => { const d = document.createElement('div');
          d.appendChild(legend(V.faq.buy_kinds.map(x => x.label)));
          d.appendChild(stackbar(V.faq.buy_kinds)); return d; })(),
        'Q코드(자재 식별) 문의가 절반을 넘습니다 — 챗봇의 자재코드 원형 보존 규칙이 여기서 중요해집니다.'),
    ]));

  /* ===================== 스토리 2 ===================== */
  const mq = V.material;
  app.appendChild(section('2 · 돈이 어디에 잠겨 있는가',
    `자재 ${mq.n_items}종의 재고금액 ${fmt(mq.total_value)}원을 불출 이력과 결합했습니다. 적정재고 산출 없이도 과잉·결품을 판정할 수 있습니다.`,
    [
      card('보유량 × 실제 불출 사분면 ★신규',
        '가로: 5년 누적 불출량 · 세로: 부서 재고 (둘 다 로그 축) · 주황 = 핵심예비품',
        scatter(mq.scatter.map(p => ({ ...p, hl: p.c === 'O' })), {
          log: true, vline: 0.5, hline: 0.5, height: 320,
          xlabel: '누적 불출량 (로그)', ylabel: '재고 수량 (로그)',
          quads: [{ label: '재고만 있음 (정체)', fx: .22, fy: .12 },
                  { label: '정상 회전', fx: .78, fy: .12 },
