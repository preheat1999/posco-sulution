<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · AI 자재 솔루션</title>
<link rel="stylesheet" href="assets/shell.css">
<!-- 공통 셸을 쓰지 않는다. 사이드바도 상단 바도 없다.
     이 화면은 두 가지를 한다.
       1) 사내 SSO 로 들어오는 경로를 보여 준다
       2) 「나는 어느 부서 누구인가」 를 정한다
     여기서 고른 값이 모든 화면의 빵조각 · 리포트 수신자 · 담당 설비에 그대로 쓰인다.

     비밀번호 칸을 두지 않는다. 실제 SSO 는 우리 페이지에서 비밀번호를 받지 않고
     인증 서버로 넘긴다. 우리 화면에 입력칸을 두면 실제 동작과 달라지고,
     시연용 화면이 사내 계정을 받는 것처럼 보인다. -->
</head>
<body>

<div class="auth">

  <!-- ======================= 왼쪽 · 표지 ======================= -->
  <section class="auth-brand">
    <!-- 그림은 외부 이미지를 쓰지 않고 직접 그린다.
         사내망에서 주소가 막히면 표지가 통째로 비어 버린다 -->
    <svg class="brand-art" viewBox="0 0 700 900" preserveAspectRatio="xMidYMid slice"
         aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F7FAFF"/><stop offset=".55" stop-color="#D9DEEC"/>
          <stop offset="1" stop-color="#B4BCD0"/>
        </linearGradient>
        <linearGradient id="gMetal2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E4EAF7"/><stop offset="1" stop-color="#A3ADC4"/>
        </linearGradient>
        <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#A9C4FF"/><stop offset=".5" stop-color="#5B8CFF"/>
          <stop offset="1" stop-color="#7FA6FF"/>
        </linearGradient>
        <linearGradient id="gRing2" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFD65C"/><stop offset="1" stop-color="#F2B04E"/>
        </linearGradient>
        <linearGradient id="gPhone" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1E2A4D"/><stop offset="1" stop-color="#131A3D"/>
        </linearGradient>
        <linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EDFF"/>
        </linearGradient>
        <linearGradient id="gBub" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
          <stop offset="1" stop-color="#D8E4FF" stop-opacity=".8"/>
        </linearGradient>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16204A" flood-opacity=".3"/>
        </filter>
      </defs>

      <!-- 바탕의 큰 덩어리. 흐리게 깔아 깊이를 만든다 -->
      <circle cx="655" cy="90" r="235" fill="#FFFFFF" opacity=".07"/>
      <circle cx="40" cy="640" r="250" fill="#FFFFFF" opacity=".05"/>
      <circle cx="560" cy="760" r="160" fill="#FFFFFF" opacity=".05"/>
      <circle cx="350" cy="200" r="300" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="46"/>

      <!-- 큰 링 -->
      <g filter="url(#soft)">
        <ellipse cx="430" cy="215" rx="128" ry="122" fill="none"
                 stroke="url(#gRing)" stroke-width="42"/>
        <ellipse cx="430" cy="215" rx="128" ry="122" fill="none"
                 stroke="#FFFFFF" stroke-opacity=".3" stroke-width="6"
                 stroke-dasharray="115 450" stroke-linecap="round" transform="rotate(-26 430 215)"/>
      </g>

      <!-- 작은 노란 링 -->
      <g filter="url(#soft)">
        <ellipse cx="612" cy="118" rx="48" ry="46" fill="none"
                 stroke="url(#gRing2)" stroke-width="19"/>
      </g>

      <!-- 말풍선 · 챗봇으로 물어보는 경로 -->
      <g filter="url(#soft)" transform="translate(112 66)">
        <rect x="0" y="0" width="122" height="82" rx="25" fill="url(#gBub)"/>
        <path d="M28 80 L24 104 L52 82 Z" fill="url(#gBub)"/>
        <circle cx="38" cy="41" r="6.5" fill="#5B8CFF" opacity=".55"/>
        <circle cx="61" cy="41" r="6.5" fill="#5B8CFF" opacity=".78"/>
        <circle cx="84" cy="41" r="6.5" fill="#5B8CFF" opacity=".55"/>
      </g>

      <!-- 톱니바퀴 -->
      <g filter="url(#soft)" transform="translate(66 258)">
        <g fill="url(#gMetal2)">
          <circle cx="0" cy="0" r="44"/>
          <rect x="-9" y="-60" width="18" height="20" rx="4"/>
          <rect x="-9" y="40" width="18" height="20" rx="4"/>
          <rect x="-60" y="-9" width="20" height="18" rx="4"/>
          <rect x="40" y="-9" width="20" height="18" rx="4"/>
          <rect x="-9" y="-60" width="18" height="20" rx="4" transform="rotate(45)"/>
          <rect x="-9" y="40" width="18" height="20" rx="4" transform="rotate(45)"/>
          <rect x="-60" y="-9" width="20" height="18" rx="4" transform="rotate(45)"/>
          <rect x="40" y="-9" width="20" height="18" rx="4" transform="rotate(45)"/>
        </g>
        <circle cx="0" cy="0" r="18" fill="#3A63D9"/>
        <circle cx="-12" cy="-14" r="8" fill="#FFFFFF" opacity=".45"/>
      </g>

      <!-- 휴대폰 · 현장에서 QR 을 찍는 화면 -->
      <g filter="url(#soft)" transform="translate(398 262) rotate(-9)">
        <rect x="-82" y="-148" width="164" height="296" rx="26" fill="url(#gPhone)"/>
        <rect x="-71" y="-136" width="142" height="272" rx="18" fill="url(#gScreen)"/>
        <rect x="-19" y="-143" width="38" height="8" rx="4" fill="#2C3A63"/>
        <rect x="-56" y="-114" width="70" height="9" rx="4.5" fill="#5B8CFF" opacity=".85"/>
        <rect x="-56" y="-96" width="42" height="7" rx="3.5" fill="#AFB7CB"/>
        <g fill="#FFFFFF" stroke="#D6E0FF">
          <rect x="-56" y="-76" width="112" height="39" rx="10"/>
          <rect x="-56" y="-29" width="112" height="39" rx="10"/>
          <rect x="-56" y="18" width="112" height="39" rx="10"/>
        </g>
        <g fill="#5B8CFF" opacity=".8">
          <rect x="-46" y="-64" width="50" height="7" rx="3.5"/>
          <rect x="-46" y="-17" width="62" height="7" rx="3.5"/>
          <rect x="-46" y="30" width="40" height="7" rx="3.5"/>
        </g>
        <g fill="#C2CADD">
          <rect x="-46" y="-51" width="33" height="6" rx="3"/>
          <rect x="-46" y="-4" width="29" height="6" rx="3"/>
          <rect x="-46" y="43" width="36" height="6" rx="3"/>
        </g>
        <rect x="22" y="-66" width="25" height="14" rx="7" fill="#FFD65C"/>
        <rect x="22" y="-19" width="25" height="14" rx="7" fill="#F2B04E"/>
        <rect x="22" y="28" width="25" height="14" rx="7" fill="#33C48F"/>
        <g transform="translate(-56 70)" fill="#1E2A4D">
          <rect x="0" y="0" width="10" height="10"/><rect x="14" y="0" width="6" height="6"/>
          <rect x="26" y="0" width="10" height="10"/><rect x="0" y="14" width="6" height="6"/>
          <rect x="16" y="12" width="8" height="8"/><rect x="30" y="16" width="6" height="6"/>
          <rect x="0" y="26" width="10" height="10"/><rect x="16" y="26" width="6" height="6"/>
          <rect x="26" y="26" width="10" height="10"/>
        </g>
        <rect x="-10" y="74" width="64" height="8" rx="4" fill="#D6E0FF"/>
        <rect x="-10" y="88" width="46" height="8" rx="4" fill="#D6E0FF"/>
        <rect x="-56" y="112" width="112" height="22" rx="11" fill="#3A63D9"/>
      </g>

      <!-- 스패너 · 위쪽은 열린 머리, 아래쪽은 링 머리 -->
      <g filter="url(#soft)" transform="translate(150 400) rotate(-38)">
        <path d="M-30 -66 A30 30 0 1 0 30 -66 L14 -66 A16 16 0 1 1 -14 -66 Z" fill="url(#gMetal)"/>
        <rect x="-11" y="-70" width="22" height="126" rx="11" fill="url(#gMetal)"/>
        <circle cx="0" cy="58" r="26" fill="url(#gMetal2)"/>
        <circle cx="0" cy="58" r="12" fill="#3A63D9"/>
        <rect x="-11" y="-70" width="8" height="126" rx="4" fill="#FFFFFF" opacity=".45"/>
      </g>

      <!-- 볼트 -->
      <g filter="url(#soft)" transform="translate(592 392) rotate(24)">
        <path d="M-28 -38 l28 -17 l28 17 v34 l-28 17 l-28 -17 Z" fill="url(#gMetal2)"/>
        <path d="M-28 -38 l28 -17 l28 17 l-28 17 Z" fill="url(#gMetal)"/>
        <rect x="-10" y="-6" width="20" height="86" rx="5" fill="url(#gMetal2)"/>
        <g fill="#FFFFFF" opacity=".45">
          <rect x="-10" y="8" width="20" height="5"/><rect x="-10" y="23" width="20" height="5"/>
          <rect x="-10" y="38" width="20" height="5"/><rect x="-10" y="53" width="20" height="5"/>
          <rect x="-10" y="68" width="20" height="5"/>
        </g>
      </g>

      <!-- 육각 너트 -->
      <g filter="url(#soft)" transform="translate(268 470) rotate(-12)">
        <path d="M-38 -22 l38 -22 l38 22 v44 l-38 22 l-38 -22 Z" fill="url(#gMetal2)"/>
        <path d="M-38 -22 l38 -22 l38 22 l-38 22 Z" fill="url(#gMetal)"/>
        <ellipse cx="0" cy="-2" rx="17" ry="16" fill="#27408F"/>
      </g>

      <!-- 작은 나사 -->
      <g filter="url(#soft)" transform="translate(520 520) rotate(-52)">
        <ellipse cx="0" cy="-26" rx="16" ry="8" fill="url(#gMetal)"/>
        <path d="M-16 -26 l16 66 l16 -66 Z" fill="url(#gMetal2)"/>
        <rect x="-8" y="-29" width="16" height="4.5" rx="2" fill="#98A2B8"/>
      </g>
    </svg>

    <div class="brand-copy">
      <p class="brand-eyebrow">많지도 적지않게 스스로 수량을 <span class="hl">자제</span>하는</p>
      <h1 class="brand-title">AI <span class="hl">자재</span> 관리 솔루션</h1>

      <!-- 표지에 숫자를 적어 두지 않는다. DB 에서 읽고, DB 가 없으면 이 카드를 지운다.
           첫 화면부터 가짜 숫자를 보여 주면 시연 전체가 의심받는다 -->
      <div class="stat-float" id="stat" hidden></div>

      <p class="brand-team">
        <b>팀 설루션</b>
        이예나 · 김혜정 · 이예열 · 서동민
      </p>
    </div>
  </section>

  <!-- ======================= 오른쪽 · 로그인 ======================= -->
  <section class="auth-form">
    <div class="auth-inner">
      <div class="auth-logo">
        <div class="auth-logo-mark">자</div>
        <div class="auth-logo-name">AI 자재 솔루션</div>
      </div>

      <h2 class="auth-greet">반갑습니다, 자재 담당자님</h2>
      <p class="auth-greet-sub">사내 계정으로 들어오거나, 소속을 직접 골라 시작합니다.</p>

      <button class="sso" type="button" id="sso">
        <span class="sso-mark">P</span>
        <span>포스코 사내 SSO 로 로그인</span>
      </button>
      <div class="sso-step" id="sso-step" hidden>
        <span class="sso-dot"></span><span id="sso-msg"></span>
      </div>

      <div class="divider"><span>또는 소속을 직접 선택</span></div>

      <div class="field">
        <label for="f-section">소속 섹션</label>
        <select class="select" id="f-section"></select>
      </div>

      <div class="grid2" style="gap:12px">
        <div class="field">
          <label for="f-part">파트</label>
          <select class="select" id="f-part"></select>
        </div>
        <div class="field">
          <label for="f-person">담당자</label>
          <select class="select" id="f-person"></select>
        </div>
      </div>

      <div class="hr-box" id="hr">
        <p class="gt"><span id="hr-title">✓ 인사 정보 확인</span><span id="hr-badge"></span></p>
        <div id="hr-rows"></div>
      </div>

      <button class="btn block" type="button" id="go" style="min-height:46px">로그인</button>
      <p class="note" id="guide" hidden></p>

      <p class="auth-foot">
        사내망 폐쇄 환경을 가정한 시연용 화면입니다. 인사 DB 와 연동하지 않습니다.<br>
        SSO 는 연동 예정 구간이며, 지금은 사내 인증 흐름을 화면으로만 보여 줍니다.<br>
        선택한 소속과 역할은 브라우저에만 저장되며 서버로 전송되지 않습니다.
      </p>
    </div>
  </section>
</div>

<script src="assets/config.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/org.js"></script>
<script src="assets/db-master.js"></script>
<script src="assets/db-derived.js"></script>
<script src="assets/db-changes.js"></script>
<script src="assets/db.js"></script>
<script>
(function () {
  'use strict';

  var partEl = document.getElementById('f-part');
  var secEl = document.getElementById('f-section');
  var perEl = document.getElementById('f-person');
  var rowsEl = document.getElementById('hr-rows');
  var badgeEl = document.getElementById('hr-badge');
  var goEl = document.getElementById('go');
  var guideEl = document.getElementById('guide');
  var ssoEl = document.getElementById('sso');
  var stepEl = document.getElementById('sso-step');
  var msgEl = document.getElementById('sso-msg');

  var me = ORG.load();
  var ssoDone = false;

  function opt(value, text, disabled) {
    var o = document.createElement('option');
    o.value = value;
    o.textContent = text;
    if (disabled) { o.disabled = true; }
    return o;
  }

  function fillSections() {
    secEl.innerHTML = '';
    ORG.sections().forEach(function (s) { secEl.appendChild(opt(s, s)); });
    secEl.value = me.section;
  }

  /* 부서코드가 없는 파트는 고를 수 없다.
     없는 코드로 조회하면 화면이 빈 채로 뜨고 불변식 4 가 잡는다.
     그래서 「없다」 고만 적지 않고 무엇을 하면 되는지 적는다 */
  function fillParts() {
    partEl.innerHTML = '';
    var list = ORG.parts(secEl.value);
    list.forEach(function (p) {
      partEl.appendChild(opt(p.name, p.name + (p.dept ? '' : ' · 시연 데이터 준비 전'), !p.dept));
    });
    var live = list.filter(function (p) { return p.dept; });
    if (live.length) {
      partEl.value = live.some(function (p) { return p.name === me.part; }) ? me.part : live[0].name;
    }
    return live.length > 0;
  }

  function fillPeople() {
    perEl.innerHTML = '';
    ORG.people(partEl.value).forEach(function (p) {
      perEl.appendChild(opt(p.name, p.name + ' ' + p.rank));
    });
    var names = ORG.people(partEl.value).map(function (p) { return p.name; });
    if (names.indexOf(me.name) >= 0) { perEl.value = me.name; }
  }

  /* 섹션이 그대로면 파트 목록을 다시 만들지 않는다.
     매번 다시 만들면 사람이 고른 파트가 첫 항목으로 되돌아간다 */
  var lastSec = null;
  function fillPartsIfNeeded() {
    if (lastSec === secEl.value) {
      return ORG.parts(secEl.value).some(function (p) { return p.dept; });
    }
    lastSec = secEl.value;
    return fillParts();
  }

  function row(k, v) {
    return '<div class="hr-row"><span class="hr-k">' + UI.esc(k) +
           '</span><span class="hr-v">' + v + '</span></div>';
  }

  function paint() {
    var hasLive = fillPartsIfNeeded();
    fillPeople();

    var pt = ORG.part(partEl.value);
    var per = ORG.person(partEl.value, perEl.value);

    if (!hasLive || !pt || !pt.dept) {
      rowsEl.innerHTML = row('소속', UI.esc(secEl.value));
      guideEl.hidden = false;
      guideEl.textContent = '이 시연 데이터에는 FM기계파트(SEO26FF) 자재 743종만 들어 있습니다. ' +
        '소속 섹션을 「열연정비 1섹션」 으로 두고 「FM기계파트」 를 선택하세요.';
      goEl.disabled = true;
      return;
    }

    guideEl.hidden = true;
    goEl.disabled = false;

    rowsEl.innerHTML =
      row('소속 부', UI.esc(ORG.division)) +
      row('소속', UI.esc(secEl.value + ' · ' + pt.name)) +
      row('직급', UI.esc(per ? per.rank : '미확인')) +
      row('역할', '<span class="badge plan">' + UI.esc(per ? per.role : '미확인') + '</span>') +
      row('담당 설비군', UI.esc(pt.eqGroup || '미확인')) +
      row('부서코드', UI.esc(pt.dept)) +
      '<div class="hr-foot note">' +
        (per && per.role === ORG.ROLE.LEAD
          ? '부서 자재 현황을 주간 리포트로 받습니다 · 승인 대기 건을 확인할 수 있습니다'
          : '내 담당 설비의 자재 현황 확인 · 구매신청 · 반납') +
      '</div>';
  }

  /* 사내 SSO.
     실제 연동은 인증 서버로 넘겼다가 돌아오는 왕복이라 우리 페이지에 입력칸이 없다.
     지금은 그 왕복을 단계 문구로만 보여 준다.
     스피너 대신 단계 문구를 쓰는 이유 · 무엇을 기다리는지 알 수 있다 */
  var STEPS = [
    '사내 인증 서버에 연결',
    '사원 정보 조회',
    '부서 권한 확인',
    '담당 설비군 확인'
  ];

  ssoEl.addEventListener('click', function () {
    if (ssoDone) { return; }
    ssoEl.disabled = true;
    stepEl.hidden = false;
    var i = 0;
    (function tick() {
      if (i >= STEPS.length) { finish(); return; }
      msgEl.textContent = STEPS[i] + ' ...';
      i += 1;
      window.setTimeout(tick, 420);
    })();
  });

  function finish() {
    ssoDone = true;
    stepEl.hidden = true;
    ssoEl.innerHTML = '<span class="sso-mark">P</span>' +
      '<span>사내 SSO 인증 완료 · 이예열 사원</span>';
    ssoEl.disabled = true;

    /* SSO 가 준 소속으로 맞춘다. 지금은 반출 데이터에 있는 부서 하나가 그 값이다 */
    secEl.value = ORG.DEFAULT.section;
    lastSec = null;
    me.section = ORG.DEFAULT.section;
    me.part = ORG.DEFAULT.part;
    me.name = ORG.DEFAULT.name;
    paint();
    perEl.value = ORG.DEFAULT.name;
    paint();

    badgeEl.innerHTML = '<span class="badge ok">SSO 확인</span>';
    document.getElementById('hr-title').textContent = '✓ 사내 인증으로 확인된 소속';
    goEl.textContent = '대시보드로 이동';
  }

  /* 표지의 숫자는 DB 에서 읽는다. 없으면 카드를 아예 지운다 */
  function stat() {
    if (!window.DB) { return; }
    var s, box = document.getElementById('stat');
    try { s = DB.summary(); } catch (e) { return; }
    box.innerHTML =
      '<div><div class="sv">' + UI.num(s.items) + '</div><div class="sk">담당 자재 품목</div></div>' +
      '<div><div class="sv">' + UI.won(s.nowAmt) + '</div><div class="sk">보유 재고</div></div>' +
      '<div><div class="sv">' + UI.won(s.cutAmt) + '</div><div class="sk">감축 가능</div></div>';
    box.hidden = false;
  }

  fillSections();
  paint();
  stat();

  secEl.addEventListener('change', paint);
  partEl.addEventListener('change', function () { me.part = partEl.value; paint(); });
  /* 고른 담당자를 me 에 넣어 둔다.
   * 안 넣으면 목록을 다시 채울 때 fillPeople 이 me.name(예전 값)으로 되돌려
   * 사람을 바꿔도 인사 정보 칸이 안 바뀐다 */
  perEl.addEventListener('change', function () { me.name = perEl.value; paint(); });

  goEl.addEventListener('click', function () {
    ORG.save({ section: secEl.value, part: partEl.value, name: perEl.value });
    window.location.href = 'main.html';
  });
})();
</script>
</body>
</html>
