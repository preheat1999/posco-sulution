<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · AI 자재 솔루션</title>
<link rel="stylesheet" href="assets/shell.css">
<!-- 공통 셸을 쓰지 않는다. 사이드바도 상단 바도 없다.
     이 화면은 두 가지를 한다.
       1) 사내 SSO 로 들어오는 경로를 보여 준다
       2) 「나는 어느 부서 누구인가」 를 정한다
     여기서 고른 값이 모든 화면의 빵조각 · 리포트 수신자 · 담당 설비에 그대로 쓰인다.

     비밀번호 칸을 두지 않는다. 실제 SSO 는 우리 페이지에서 비밀번호를 받지 않고
     인증 서버로 넘긴다. 우리 화면에 입력칸을 두면 실제 동작과 달라지고,
     시연용 화면이 사내 계정을 받는 것처럼 보인다. -->
</head>
<body>

<div class="auth">

  <!-- ======================= 왼쪽 · 표지 ======================= -->
  <section class="auth-brand">
    <!-- 그림은 외부 이미지를 쓰지 않고 직접 그린다.
         사내망에서 주소가 막히면 표지가 통째로 비어 버린다 -->
    <svg class="brand-art" viewBox="0 0 700 900" preserveAspectRatio="xMidYMid slice"
         aria-hidden="true" focusable="false">
      <defs>
        <!-- 빛은 왼쪽 위에서 온다 · 모든 도형이 같은 방향으로 밝고 어둡다.
             이것만 지켜도 평평한 도형이 입체로 읽힌다 -->
        <linearGradient id="pLight" x1="0" y1="0" x2=".9" y2="1">
          <stop offset="0" stop-color="#FBF8FF"/><stop offset="1" stop-color="#CDB8FF"/>
        </linearGradient>
        <linearGradient id="pMid" x1="0" y1="0" x2=".9" y2="1">
          <stop offset="0" stop-color="#E4D7FF"/><stop offset="1" stop-color="#9B7BE8"/>
        </linearGradient>
        <linearGradient id="pDeep" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#A98BF2"/><stop offset="1" stop-color="#6B3FCC"/>
        </linearGradient>
        <linearGradient id="pGlass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity=".42"/>
          <stop offset="1" stop-color="#FFFFFF" stop-opacity=".10"/>
        </linearGradient>
        <linearGradient id="pPhone" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2C2350"/><stop offset="1" stop-color="#17102E"/>
        </linearGradient>
        <linearGradient id="pScreen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6E4FD8"/><stop offset="1" stop-color="#4B2FA8"/>
        </linearGradient>
        <linearGradient id="pHand" x1="0" y1="0" x2=".8" y2="1">
          <stop offset="0" stop-color="#F3ECFF"/><stop offset="1" stop-color="#C8B2F0"/>
        </linearGradient>
        <linearGradient id="pMint" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8EF0D8"/><stop offset="1" stop-color="#3FC9A8"/>
        </linearGradient>
        <filter id="pSoft" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3A1C7A" flood-opacity=".34"/>
        </filter>
        <filter id="pBlur" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="26"/>
        </filter>
      </defs>

      <!-- 바탕 · 흐린 덩어리로 깊이를 만든다 -->
      <g filter="url(#pBlur)" opacity=".5">
        <circle cx="120" cy="120" r="170" fill="#B79BFF" opacity=".55"/>
        <circle cx="620" cy="660" r="210" fill="#8C63EE" opacity=".5"/>
      </g>
      <circle cx="596" cy="150" r="250" fill="#FFFFFF" opacity=".05"/>
      <circle cx="90" cy="700" r="230" fill="#FFFFFF" opacity=".045"/>

      <!-- 유리판 두 장 · 뒤쪽에 얇게 깔린다 -->
      <g opacity=".9">
        <rect x="92" y="92" width="150" height="150" rx="34" fill="url(#pGlass)"
              transform="rotate(-13 167 167)"/>
        <rect x="470" y="556" width="118" height="118" rx="28" fill="url(#pGlass)"
              transform="rotate(16 529 615)"/>
      </g>

      <!-- 큰 도넛 · 오른쪽 위 -->
      <g filter="url(#pSoft)">
        <circle cx="556" cy="156" r="104" fill="none" stroke="url(#pDeep)" stroke-width="54"/>
        <circle cx="556" cy="156" r="104" fill="none" stroke="#FFFFFF" stroke-opacity=".45"
                stroke-width="9" stroke-dasharray="92 460" stroke-linecap="round"
                transform="rotate(-34 556 156)"/>
      </g>

      <!-- 말풍선 · 물어보면 답한다 -->
      <g filter="url(#pSoft)" transform="translate(286 96)">
        <rect x="0" y="0" width="132" height="92" rx="30" fill="url(#pLight)"/>
        <path d="M32 88 L26 118 L60 90 Z" fill="url(#pLight)"/>
        <g fill="#7C4FE0">
          <circle cx="40" cy="46" r="7.5" opacity=".55"/>
          <circle cx="66" cy="46" r="7.5" opacity=".8"/>
          <circle cx="92" cy="46" r="7.5" opacity=".55"/>
        </g>
      </g>

      <!-- 원뿔 -->
      <g filter="url(#pSoft)" transform="translate(430 268) rotate(8)">
        <path d="M0 -52 L34 34 H-34 Z" fill="url(#pMid)"/>
        <path d="M0 -52 L0 34 H-34 Z" fill="#FFFFFF" opacity=".22"/>
        <ellipse cx="0" cy="34" rx="34" ry="10" fill="url(#pDeep)"/>
      </g>

      <!-- 톱니바퀴 -->
      <g filter="url(#pSoft)" transform="translate(108 352)">
        <g fill="url(#pMid)">
          <circle cx="0" cy="0" r="52"/>
          <g>
            <rect x="-11" y="-72" width="22" height="24" rx="6"/>
            <rect x="-11" y="48" width="22" height="24" rx="6"/>
            <rect x="-72" y="-11" width="24" height="22" rx="6"/>
            <rect x="48" y="-11" width="24" height="22" rx="6"/>
          </g>
          <g transform="rotate(45)">
            <rect x="-11" y="-72" width="22" height="24" rx="6"/>
            <rect x="-11" y="48" width="22" height="24" rx="6"/>
            <rect x="-72" y="-11" width="24" height="22" rx="6"/>
            <rect x="48" y="-11" width="24" height="22" rx="6"/>
          </g>
        </g>
        <circle cx="0" cy="0" r="21" fill="#6B3FCC"/>
        <circle cx="-16" cy="-18" r="10" fill="#FFFFFF" opacity=".4"/>
      </g>

      <!-- 스패너 -->
      <g filter="url(#pSoft)" transform="translate(232 470) rotate(-34)">
        <path d="M-30 -70 A30 30 0 1 0 30 -70 L14 -70 A16 16 0 1 1 -14 -70 Z" fill="url(#pLight)"/>
        <rect x="-11" y="-74" width="22" height="130" rx="11" fill="url(#pLight)"/>
        <circle cx="0" cy="58" r="27" fill="url(#pMid)"/>
        <circle cx="0" cy="58" r="12" fill="#6B3FCC"/>
        <rect x="-11" y="-74" width="8" height="130" rx="4" fill="#FFFFFF" opacity=".5"/>
      </g>

      <!-- 나사 -->
      <g filter="url(#pSoft)" transform="translate(372 452) rotate(-46)">
        <ellipse cx="0" cy="-30" rx="18" ry="9" fill="url(#pLight)"/>
        <path d="M-18 -30 l18 76 l18 -76 Z" fill="url(#pMid)"/>
        <rect x="-9" y="-33" width="18" height="5" rx="2.5" fill="#9B7BE8"/>
      </g>

      <!-- 캡슐 부품 -->
      <g filter="url(#pSoft)" transform="translate(150 596) rotate(26)">
        <rect x="-56" y="-17" width="112" height="34" rx="17" fill="url(#pLight)"/>
        <rect x="-56" y="-17" width="56" height="34" rx="17" fill="#FFFFFF" opacity=".35"/>
        <circle cx="-34" cy="0" r="7" fill="#9B7BE8" opacity=".55"/>
      </g>

      <!-- 손에 든 휴대폰 · 현장에서 말로 묻는 장면이다 -->
      <g transform="translate(452 588)">
        <g filter="url(#pSoft)">
          <!-- 손등 -->
          <path fill="url(#pHand)"
                d="M-92 150 q-22 -58 4 -112 q14 -30 46 -30 l104 0 q30 2 34 30 l0 112 Z"/>
          <!-- 엄지 · 폰 앞으로 올라온다 -->
          <path fill="url(#pHand)"
                d="M74 -2 q34 -6 40 22 q6 26 -22 34 l-42 10 l-6 -54 Z"/>
          <!-- 손가락 마디 · 선 두 줄이면 손으로 읽힌다 -->
          <g stroke="#A98BF2" stroke-opacity=".45" stroke-width="2.4" fill="none"
             stroke-linecap="round">
            <path d="M-56 26 q40 -12 78 -4"/>
            <path d="M-60 58 q42 -12 80 -4"/>
          </g>
        </g>
        <g filter="url(#pSoft)" transform="translate(6 -126) rotate(-8)">
          <rect x="-92" y="-186" width="184" height="330" rx="30" fill="url(#pPhone)"/>
          <rect x="-80" y="-174" width="160" height="306" rx="22" fill="url(#pScreen)"/>
          <rect x="-21" y="-181" width="42" height="9" rx="4.5" fill="#3A2C66"/>
          <g transform="translate(-58 -144)">
            <rect x="0" y="0" width="94" height="34" rx="14" fill="url(#pMint)"/>
            <circle cx="19" cy="17" r="8" fill="#FFFFFF" opacity=".85"/>
            <rect x="34" y="12" width="44" height="9" rx="4.5" fill="#FFFFFF" opacity=".8"/>
          </g>
          <g fill="#FFFFFF">
            <rect x="-58" y="-92" width="110" height="10" rx="5" opacity=".85"/>
            <rect x="-58" y="-70" width="84" height="10" rx="5" opacity=".55"/>
            <rect x="-58" y="-34" width="116" height="10" rx="5" opacity=".85"/>
            <rect x="-58" y="-12" width="70" height="10" rx="5" opacity=".55"/>
            <rect x="-58" y="24" width="100" height="10" rx="5" opacity=".85"/>
            <rect x="-58" y="46" width="58" height="10" rx="5" opacity=".55"/>
          </g>
          <rect x="-58" y="84" width="22" height="22" rx="7" fill="url(#pMint)"/>
          <rect x="-58" y="-118" width="30" height="8" rx="4" fill="#FFFFFF" opacity=".4"/>
        </g>
      </g>
    </svg>

    <div class="brand-copy">
      <p class="brand-eyebrow">정비부서 <span class="hl">4천명</span>을 위한</p>
      <h1 class="brand-title">AI 자재 솔루션</h1>

      <div class="brand-team">
        <p class="team-mark">
          <svg class="tm-ico" viewBox="0 0 34 18" aria-hidden="true" focusable="false">
            <g fill="none" stroke="currentColor" stroke-width="2.6">
              <circle cx="11" cy="9" r="7"/><circle cx="23" cy="9" r="7"/>
            </g>
          </svg>SUL + LUTION
        </p>
        <p class="team-names">이예나 김혜정 이예열 서동민 <span>with 이지환 코치</span></p>
      </div>
    </div>
  </section>

  <!-- ======================= 오른쪽 · 로그인 ======================= -->
  <section class="auth-form">
    <div class="auth-inner">
      <div class="auth-logo">
        <div class="auth-logo-mark">자</div>
        <div class="auth-logo-name">AI 자재 솔루션</div>
      </div>

      <h2 class="auth-greet">반갑습니다, 자재 담당자님</h2>
      <p class="auth-greet-sub">사내 계정으로 들어오거나, 소속을 직접 골라 시작합니다.</p>

      <button class="sso" type="button" id="sso">
        <span class="sso-mark">P</span>
        <span>포스코 사내 SSO 로 로그인</span>
      </button>
      <div class="sso-step" id="sso-step" hidden>
        <span class="sso-dot"></span><span id="sso-msg"></span>
      </div>

      <div class="divider"><span>또는 소속을 직접 선택</span></div>

      <div class="field">
        <label for="f-section">소속 섹션</label>
        <select class="select" id="f-section"></select>
      </div>

      <div class="grid2" style="gap:12px">
        <div class="field">
          <label for="f-part">파트</label>
          <select class="select" id="f-part"></select>
        </div>
        <div class="field">
          <label for="f-person">담당자</label>
          <select class="select" id="f-person"></select>
        </div>
      </div>

      <div class="hr-box" id="hr">
        <p class="gt"><span id="hr-title">✓ 인사 정보 확인</span><span id="hr-badge"></span></p>
        <div id="hr-rows"></div>
      </div>

      <button class="btn block" type="button" id="go" style="min-height:46px">로그인</button>
      <p class="note" id="guide" hidden></p>

      <p class="auth-foot">
        사내망 폐쇄 환경을 가정한 시연용 화면입니다. 인사 DB 와 연동하지 않습니다.<br>
        SSO 는 연동 예정 구간이며, 지금은 사내 인증 흐름을 화면으로만 보여 줍니다.<br>
        선택한 소속과 역할은 브라우저에만 저장되며 서버로 전송되지 않습니다.
      </p>
    </div>
  </section>
</div>

<script src="assets/config.js"></script>
<!-- .env 에서 내려온 연결값 · serve.py 가 만든다 · 없으면 그냥 넘어간다 -->
<script src="assets/config.local.js"></script>
<!-- http 로 들어왔으면 같은 자리의 https 로 올린다 · 마이크는 https 에서만 열린다 -->
<script src="assets/secure.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/org.js"></script>
<script src="assets/db-master.js"></script>
<script src="assets/db-derived.js"></script>
<script src="assets/db-changes.js"></script>
<script src="assets/db.js"></script>
<!-- 음성은 한국어로 받아쓰고 품명은 영어다 · 그 사이를 잇는다 (너트 → Nut) -->
<script src="assets/ko-en.js"></script>
<script>
(function () {
  'use strict';

  var partEl = document.getElementById('f-part');
  var secEl = document.getElementById('f-section');
  var perEl = document.getElementById('f-person');
  var rowsEl = document.getElementById('hr-rows');
  var badgeEl = document.getElementById('hr-badge');
  var goEl = document.getElementById('go');
  var guideEl = document.getElementById('guide');
  var ssoEl = document.getElementById('sso');
  var stepEl = document.getElementById('sso-step');
  var msgEl = document.getElementById('sso-msg');

  var me = ORG.load();
  var ssoDone = false;

  function opt(value, text, disabled) {
    var o = document.createElement('option');
    o.value = value;
    o.textContent = text;
    if (disabled) { o.disabled = true; }
    return o;
  }

  function fillSections() {
    secEl.innerHTML = '';
    ORG.sections().forEach(function (s) { secEl.appendChild(opt(s, s)); });
    secEl.value = me.section;
  }

  /* 부서코드가 없는 파트는 고를 수 없다.
     없는 코드로 조회하면 화면이 빈 채로 뜨고 불변식 4 가 잡는다.
     그래서 「없다」 고만 적지 않고 무엇을 하면 되는지 적는다 */
  function fillParts() {
    partEl.innerHTML = '';
    var list = ORG.parts(secEl.value);
    list.forEach(function (p) {
      partEl.appendChild(opt(p.name, p.name + (p.dept ? '' : ' · 시연 데이터 준비 전'), !p.dept));
    });
    var live = list.filter(function (p) { return p.dept; });
    if (live.length) {
      partEl.value = live.some(function (p) { return p.name === me.part; }) ? me.part : live[0].name;
    }
    return live.length > 0;
  }

  function fillPeople() {
    perEl.innerHTML = '';
    ORG.people(partEl.value).forEach(function (p) {
      perEl.appendChild(opt(p.name, p.name + ' ' + p.rank));
    });
    var names = ORG.people(partEl.value).map(function (p) { return p.name; });
    if (names.indexOf(me.name) >= 0) { perEl.value = me.name; }
  }

  /* 섹션이 그대로면 파트 목록을 다시 만들지 않는다.
     매번 다시 만들면 사람이 고른 파트가 첫 항목으로 되돌아간다 */
  var lastSec = null;
  function fillPartsIfNeeded() {
    if (lastSec === secEl.value) {
      return ORG.parts(secEl.value).some(function (p) { return p.dept; });
    }
    lastSec = secEl.value;
    return fillParts();
  }

  function row(k, v) {
    return '<div class="hr-row"><span class="hr-k">' + UI.esc(k) +
           '</span><span class="hr-v">' + v + '</span></div>';
  }

  function paint() {
    var hasLive = fillPartsIfNeeded();
    fillPeople();

    var pt = ORG.part(partEl.value);
    var per = ORG.person(partEl.value, perEl.value);

    if (!hasLive || !pt || !pt.dept) {
      rowsEl.innerHTML = row('소속', UI.esc(secEl.value));
      guideEl.hidden = false;
      guideEl.textContent = '이 시연 데이터에는 FM기계파트(SEO26FF) 자재 743종만 들어 있습니다. ' +
        '소속 섹션을 「열연정비 1섹션」 으로 두고 「FM기계파트」 를 선택하세요.';
      goEl.disabled = true;
      return;
    }

    guideEl.hidden = true;
    goEl.disabled = false;

    rowsEl.innerHTML =
      row('소속 부', UI.esc(ORG.division)) +
      row('소속', UI.esc(secEl.value + ' · ' + pt.name)) +
      row('직급', UI.esc(per ? per.rank : '미확인')) +
      row('역할', '<span class="badge plan">' + UI.esc(per ? per.role : '미확인') + '</span>') +
      row('담당 설비군', UI.esc(pt.eqGroup || '미확인')) +
      row('부서코드', UI.esc(pt.dept)) +
      '<div class="hr-foot note">' +
        (per && per.role === ORG.ROLE.LEAD
          ? '부서 자재 현황을 주간 리포트로 받습니다 · 승인 대기 건을 확인할 수 있습니다'
          : '내 담당 설비의 자재 현황 확인 · 구매신청 · 반납') +
      '</div>';
  }

  /* 사내 SSO.
     실제 연동은 인증 서버로 넘겼다가 돌아오는 왕복이라 우리 페이지에 입력칸이 없다.
     지금은 그 왕복을 단계 문구로만 보여 준다.
     스피너 대신 단계 문구를 쓰는 이유 · 무엇을 기다리는지 알 수 있다 */
  var STEPS = [
    '사내 인증 서버에 연결',
    '사원 정보 조회',
    '부서 권한 확인',
    '담당 설비군 확인'
  ];

  ssoEl.addEventListener('click', function () {
    if (ssoDone) { return; }
    ssoEl.disabled = true;
    stepEl.hidden = false;
    var i = 0;
    (function tick() {
      if (i >= STEPS.length) { finish(); return; }
      msgEl.textContent = STEPS[i] + ' ...';
      i += 1;
      window.setTimeout(tick, 420);
    })();
  });

  function finish() {
    ssoDone = true;
    stepEl.hidden = true;
    ssoEl.innerHTML = '<span class="sso-mark">P</span>' +
      '<span>사내 SSO 인증 완료 · 이예열 사원</span>';
    ssoEl.disabled = true;

    /* SSO 가 준 소속으로 맞춘다. 지금은 반출 데이터에 있는 부서 하나가 그 값이다 */
    secEl.value = ORG.DEFAULT.section;
    lastSec = null;
    me.section = ORG.DEFAULT.section;
    me.part = ORG.DEFAULT.part;
    me.name = ORG.DEFAULT.name;
    paint();
    perEl.value = ORG.DEFAULT.name;
    paint();

    badgeEl.innerHTML = '<span class="badge ok">SSO 확인</span>';
    document.getElementById('hr-title').textContent = '✓ 사내 인증으로 확인된 소속';
    goEl.textContent = '대시보드로 이동';
  }

  fillSections();
  paint();

  secEl.addEventListener('change', paint);
  partEl.addEventListener('change', function () { me.part = partEl.value; paint(); });
  /* 고른 담당자를 me 에 넣어 둔다.
   * 안 넣으면 목록을 다시 채울 때 fillPeople 이 me.name(예전 값)으로 되돌려
   * 사람을 바꿔도 인사 정보 칸이 안 바뀐다 */
  perEl.addEventListener('change', function () { me.name = perEl.value; paint(); });

  goEl.addEventListener('click', function () {
    ORG.save({ section: secEl.value, part: partEl.value, name: perEl.value });
    /* 대시보드에 들어가는 순간 튜토리얼이 한 번 뜨게 적어 둔다 ·
     * 대시보드가 이 표시를 읽고 지운다 (tour.js) */
    try { window.localStorage.setItem('mtrl.tour.pending', '1'); } catch (e) { /* 무시 */ }
    window.location.href = 'main.html';
  });
})();
</script>
